<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>⚽ 3D Football Strike</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,"Noto Sans KR",sans-serif;
  background:#07111c;
  color:#fff;
  user-select:none;
}

body{
  touch-action:none;
}

.game{
  position:relative;
  width:100vw;
  height:100vh;
  min-height:500px;
  overflow:hidden;
  background:#72b7ed;
  perspective:900px;
}

/* =========================
   하늘
========================= */

.sky{
  position:absolute;
  inset:0 0 46% 0;
  background:
    radial-gradient(circle at 16% 25%,
      rgba(255,255,255,.95) 0 2.5%,
      transparent 3.5%),
    radial-gradient(circle at 76% 17%,
      rgba(255,255,255,.85) 0 3%,
      transparent 4%),
    radial-gradient(circle at 87% 35%,
      rgba(255,255,255,.7) 0 2%,
      transparent 3%),
    linear-gradient(#58a7e7,#c5e7ff);
}

/* =========================
   경기장
========================= */

.stands{
  position:absolute;
  left:0;
  right:0;
  top:25%;
  height:23%;
  overflow:hidden;

  background:
    repeating-linear-gradient(
      90deg,
      #26364d 0 34px,
      #3b506c 34px 68px
    );

  border-top:8px solid #182638;
  border-bottom:10px solid #101a28;

  box-shadow:
    inset 0 12px 18px rgba(255,255,255,.08);
}

.stands:before{
  content:"";
  position:absolute;
  inset:30% 0 0;

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,70,70,.35) 0 8px,
      transparent 8px 18px,
      rgba(80,160,255,.35) 18px 26px,
      transparent 26px 38px
    );

  opacity:.8;
}

.stands:after{
  content:"● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ●";
  position:absolute;
  left:50%;
  top:25%;
  transform:translateX(-50%);
  width:100%;
  text-align:center;
  color:#e8f2ff;
  font-size:clamp(14px,2vw,27px);
  letter-spacing:6px;
  text-shadow:0 2px 3px #000;
}

/* =========================
   필드
========================= */

.field{
  position:absolute;
  left:-30%;
  right:-30%;
  top:43%;
  bottom:-35%;

  transform:
    perspective(650px)
    rotateX(48deg);

  transform-origin:50% 0;

  background:
    repeating-linear-gradient(
      90deg,
      #075c2b 0 70px,
      #087238 70px 140px
    );

  box-shadow:
    inset 0 35px 90px rgba(0,0,0,.28);
}

.field:after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      to bottom,
      transparent 0 20%,
      rgba(255,255,255,.025) 20% 21%,
      transparent 21% 40%,
      rgba(255,255,255,.025) 40% 41%,
      transparent 41%
    );
}

.center-line{
  position:absolute;
  left:50%;
  top:0;
  width:4px;
  height:100%;
  background:rgba(255,255,255,.8);
}

.penalty{
  position:absolute;
  left:50%;
  top:3%;
  width:55%;
  height:26%;
  transform:translateX(-50%);
  border:5px solid rgba(255,255,255,.9);
}

.goal-area{
  position:absolute;
  left:50%;
  top:0;
  width:28%;
  height:14%;
  transform:translateX(-50%);
  border:5px solid rgba(255,255,255,.9);
}

/* =========================
   3D 골대
========================= */

.goal{
  position:absolute;
  left:50%;
  top:20%;
  width:min(58vw,760px);
  height:min(31vw,350px);
  min-width:300px;
  min-height:190px;

  transform:translateX(-50%);

  z-index:10;

  filter:
    drop-shadow(0 15px 18px rgba(0,0,0,.45));
}

.goal-frame{
  position:absolute;
  inset:0;

  border:9px solid #fff;
  border-bottom-width:13px;

  box-shadow:
    inset 0 0 8px rgba(0,0,0,.35),
    0 0 3px #aaa;

  z-index:4;
}

.goal-frame:before,
.goal-frame:after{
  content:"";
  position:absolute;
  background:#ddd;
  box-shadow:0 0 3px #555;
}

.goal-frame:before{
  left:-18px;
  top:-10px;
  width:18px;
  height:calc(100% + 25px);
  transform:skewY(-18deg);
}

.goal-frame:after{
  right:-18px;
  top:-10px;
  width:18px;
  height:calc(100% + 25px);
  transform:skewY(18deg);
}

.goal-depth{
  position:absolute;
  left:7%;
  right:7%;
  top:13%;
  bottom:-18%;

  border-left:6px solid rgba(255,255,255,.8);
  border-right:6px solid rgba(255,255,255,.8);
  border-bottom:8px solid rgba(255,255,255,.8);

  transform:perspective(450px) rotateX(-20deg);

  background:rgba(255,255,255,.025);
}

.goal-net{
  position:absolute;
  inset:8px;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 27px,
      rgba(255,255,255,.5) 27px 29px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 22px,
      rgba(255,255,255,.5) 22px 24px
    ),
    linear-gradient(
      145deg,
      rgba(255,255,255,.13),
      rgba(0,0,0,.25)
    );

  transform:perspective(500px) rotateX(-5deg);
  z-index:2;
}

.goal.hit{
  animation:netHit .45s ease-out;
}

@keyframes netHit{
  0%{transform:translateX(-50%) scale(1)}
  30%{transform:translateX(-50%) scale(1.04,.96)}
  65%{transform:translateX(-50%) scale(.98,1.02)}
  100%{transform:translateX(-50%) scale(1)}
}

/* =========================
   골키퍼
========================= */

.keeper{
  position:absolute;
  left:50%;
  top:43%;

  width:92px;
  height:158px;

  transform:
    translate(-50%,-50%)
    scale(.72);

  transform-origin:center bottom;

  z-index:15;

  transition:
    left .12s linear,
    transform .16s ease;
}

.keeper-head{
  position:absolute;
  left:50%;
  top:0;
  width:43px;
  height:45px;

  transform:translateX(-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 25%,
      #ffe2c4,
      #d9956b 75%,
      #a85f42
    );

  border:3px solid #663c2b;
}

.keeper-head:before{
  content:"";
  position:absolute;
  left:0;
  top:-2px;
  width:100%;
  height:18px;
  border-radius:50% 50% 30% 30%;
  background:#211712;
}

.keeper-head:after{
  content:"•  •";
  position:absolute;
  left:50%;
  top:17px;
  transform:translateX(-50%);
  color:#222;
  font-size:11px;
  white-space:nowrap;
}

.keeper-body{
  position:absolute;
  left:50%;
  top:43px;

  width:57px;
  height:64px;

  transform:translateX(-50%);

  border-radius:16px 16px 10px 10px;

  background:
    linear-gradient(
      90deg,
      #8e0b15,
      #ef2636 45%,
      #a30d18
    );

  border:3px solid #ffb2b2;

  box-shadow:
    inset 5px 0 rgba(255,255,255,.15),
    inset -5px 0 rgba(0,0,0,.2);
}

.keeper-arm{
  position:absolute;
  top:46px;

  width:17px;
  height:68px;

  border-radius:15px;

  background:#dc2935;
  border:3px solid #8b1018;

  transform-origin:top center;
}

.keeper-arm.left{
  left:9px;
  transform:rotate(28deg);
}

.keeper-arm.right{
  right:9px;
  transform:rotate(-28deg);
}

.glove{
  position:absolute;
  bottom:-5px;
  left:50%;

  width:28px;
  height:22px;

  transform:translateX(-50%);

  border-radius:50%;

  background:#f4dc48;
  border:3px solid #8a7500;
}

.keeper-leg{
  position:absolute;
  top:102px;

  width:20px;
  height:51px;

  border-radius:10px;

  background:#c51e29;
  border:3px solid #7e1017;
}

.keeper-leg.left{left:24px}
.keeper-leg.right{right:24px}

.keeper-boot{
  position:absolute;
  bottom:-5px;

  width:31px;
  height:14px;

  border-radius:8px 4px 4px 8px;

  background:#111;
  box-shadow:0 3px 5px #000;
}

.keeper.dive-left{
  transform:
    translate(-50%,-50%)
    translateX(-100px)
    rotate(-58deg)
    scale(.88);
}

.keeper.dive-right{
  transform:
    translate(-50%,-50%)
    translateX(100px)
    rotate(58deg)
    scale(.88);
}

.keeper.dive-center{
  transform:
    translate(-50%,-50%)
    translateY(-15px)
    scale(.9);
}

/* =========================
   공
========================= */

.ball{
  position:absolute;

  left:50%;
  top:66%;

  width:44px;
  height:44px;

  border-radius:50%;

  transform:translate(-50%,-50%);

  background:
    radial-gradient(
      circle at 30% 22%,
      white 0 15%,
      #eee 32%,
      #aaa 70%,
      #333
    );

  border:3px solid #222;

  box-shadow:
    0 9px 12px rgba(0,0,0,.5),
    inset 3px 3px 5px white;

  z-index:25;

  cursor:pointer;
}

.ball:after{
  content:"⬟";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  color:#111;
  font-size:13px;
}

.ball.ready{
  animation:ballFloat 1s ease-in-out infinite;
}

@keyframes ballFloat{
  0%,100%{margin-top:0}
  50%{margin-top:-5px}
}

/* =========================
   조준점
========================= */

.aim{
  position:absolute;
  left:50%;
  top:47%;

  width:74px;
  height:74px;

  transform:translate(-50%,-50%);

  z-index:80;

  pointer-events:none;

  transition:
    left .08s linear,
    top .08s linear;
}

.aim:before,
.aim:after{
  content:"";
  position:absolute;
  inset:0;
  border:2px solid rgba(255,239,83,.9);
  border-radius:50%;
}

.aim:after{
  inset:13px;
  border-color:rgba(255,255,255,.75);
}

.aim-dot{
  position:absolute;
  left:50%;
  top:50%;

  width:8px;
  height:8px;

  transform:translate(-50%,-50%);

  border-radius:50%;
  background:#ffe83b;

  box-shadow:
    0 0 12px #ffe600;
}

.aim.cross:before{
  border-radius:0;
  border-width:0;
  background:
    linear-gradient(#ffe83b,#ffe83b) center/2px 100% no-repeat,
    linear-gradient(90deg,#ffe83b,#ffe83b) center/100% 2px no-repeat;
  opacity:.7;
}

/* =========================
   1인칭 다리
========================= */

.legs{
  position:absolute;
  left:50%;
  bottom:-18px;

  width:340px;
  height:270px;

  transform:translateX(-50%);

  z-index:30;

  pointer-events:none;
}

.leg-left,
.leg-right{
  position:absolute;
  bottom:0;

  width:78px;
  height:225px;

  background:
    linear-gradient(
      90deg,
      #101722,
      #3c4655 45%,
      #101722
    );

  border-radius:35px 35px 18px 18px;

  box-shadow:
    inset 8px 0 rgba(255,255,255,.08),
    8px 15px 20px rgba(0,0,0,.35);
}

.leg-left{
  left:62px;
  transform:rotate(9deg);
}

.leg-right{
  right:62px;
  transform:rotate(-9deg);
}

.boot-left,
.boot-right{
  position:absolute;
  bottom:-3px;

  width:128px;
  height:63px;

  border-radius:55% 30% 25% 25%;

  background:
    linear-gradient(
      180deg,
      #f5f5f5,
      #c1c5ca 55%,
      #555
    );

  border:4px solid #222;

  box-shadow:
    0 10px 14px rgba(0,0,0,.6),
    inset 5px 5px rgba(255,255,255,.55);
}

.boot-left{
  left:-25px;
  transform:rotate(8deg);
}

.boot-right{
  right:-25px;
  transform:rotate(-8deg);
}

.boot-left:after,
.boot-right:after{
  content:"≡ ≡ ≡";

  position:absolute;
  left:50%;
  top:13px;

  transform:translateX(-50%);

  color:#333;
  font-weight:bold;
  letter-spacing:5px;
}

.legs.kick .leg-right{
  animation:kickLeg .48s ease-out;
}

.legs.kick .boot-right{
  animation:kickBoot .48s ease-out;
}

@keyframes kickLeg{
  0%{transform:rotate(-9deg)}
  40%{
    transform:
      rotate(36deg)
      translateY(-48px);
  }
  100%{transform:rotate(-9deg)}
}

@keyframes kickBoot{
  0%{transform:rotate(-8deg)}
  40%{
    transform:
      rotate(25deg)
      translateY(-58px)
      translateX(32px);
  }
  100%{transform:rotate(-8deg)}
}

/* =========================
   HUD
========================= */

.hud{
  position:absolute;
  left:16px;
  top:16px;

  z-index:100;

  min-width:165px;

  padding:12px 16px;

  border-radius:14px;

  background:rgba(0,0,0,.42);

  backdrop-filter:blur(10px);

  font-weight:bold;

  box-shadow:
    0 5px 18px rgba(0,0,0,.35);
}

.hud-row{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin:4px 0;
}

.hud-value{
  color:#ffe95a;
}

.message{
  position:absolute;

  left:50%;
  top:18px;

  transform:translateX(-50%);

  z-index:100;

  color:#ffe75a;

  font-size:18px;
  font-weight:bold;

  text-shadow:0 3px 6px #000;

  white-space:nowrap;
}

.reset{
  position:absolute;

  right:16px;
  top:16px;

  z-index:100;

  padding:10px 15px;

  border:0;
  border-radius:10px;

  background:linear-gradient(#34d399,#159447);

  color:#fff;

  font-weight:bold;

  cursor:pointer;

  box-shadow:0 4px 10px rgba(0,0,0,.4);
}

/* =========================
   파워 게이지
========================= */

.power-panel{
  position:absolute;

  left:50%;
  bottom:20px;

  transform:translateX(-50%);

  width:min(420px,72vw);

  z-index:110;

  text-align:center;
}

.power-label{
  margin-bottom:6px;

  font-size:12px;
  font-weight:bold;

  text-shadow:0 2px 4px #000;
}

.power-bar{
  height:17px;

  overflow:hidden;

  border:2px solid #fff;
  border-radius:20px;

  background:rgba(0,0,0,.55);

  box-shadow:
    0 3px 10px rgba(0,0,0,.5);
}

.power-fill{
  width:0%;
  height:100%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #32d583,
      #ffe047 65%,
      #ff3c3c
    );

  transition:width .04s linear;
}

.power-mark{
  display:flex;
  justify-content:space-between;

  font-size:9px;
  opacity:.8;

  margin-top:3px;
}

/* =========================
   슛 타입
========================= */

.shot-buttons{
  position:absolute;

  left:50%;
  bottom:76px;

  transform:translateX(-50%);

  z-index:110;

  display:flex;
  gap:7px;
}

.shot-btn{
  border:1px solid rgba(255,255,255,.5);

  padding:8px 11px;

  border-radius:9px;

  color:#fff;

  background:rgba(0,0,0,.45);

  font-weight:bold;

  cursor:pointer;
}

.shot-btn.active{
  color:#111;
  background:#ffe447;
  border-color:#fff;
}

/* =========================
   골 텍스트
========================= */

.goal-text{
  position:absolute;

  left:50%;
  top:39%;

  transform:
    translate(-50%,-50%)
    scale(.2);

  z-index:200;

  font-size:
    clamp(55px,12vw,135px);

  font-weight:900;

  color:#ffe500;

  text-shadow:
    0 8px #b98400,
    0 15px 30px #000;

  opacity:0;

  pointer-events:none;
}

.goal-text.show{
  animation:goalAnimation 1s ease-out;
}

@keyframes goalAnimation{
  0%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(.2)
      rotate(-10deg);
  }

  25%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1.2)
      rotate(4deg);
  }

  70%{
    opacity:1;
    transform:
      translate(-50%,-50%)
      scale(1)
      rotate(0);
  }

  100%{
    opacity:0;
    transform:
      translate(-50%,-50%)
      scale(1.15);
  }
}

/* =========================
   콤보 팝업
========================= */

.combo-popup{
  position:absolute;

  left:50%;
  top:30%;

  transform:translate(-50%,-50%) scale(.5);

  z-index:180;

  font-size:clamp(24px,5vw,52px);
  font-weight:900;

  color:#fff;

  text-shadow:
    0 4px #e05c00,
    0 8px 15px #000;

  opacity:0;

  pointer-events:none;
}

.combo-popup.show{
  animation:comboPop .8s ease-out;
}

@keyframes comboPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.5);
  }
  25%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.25);
  }
  100%{
    opacity:0;
    transform:translate(-50%,-70%) scale(1);
  }
}

/* =========================
   파티클
========================= */

.particle{
  position:absolute;

  width:9px;
  height:9px;

  border-radius:50%;

  z-index:190;

  pointer-events:none;
}

/* =========================
   화면 흔들림
========================= */

.game.shake{
  animation:screenShake .45s ease-out;
}

@keyframes screenShake{
  0%,100%{transform:translate(0,0)}
  15%{transform:translate(-8px,5px)}
  30%{transform:translate(7px,-5px)}
  45%{transform:translate(-5px,-4px)}
  60%{transform:translate(5px,4px)}
  75%{transform:translate(-2px,2px)}
}

/* =========================
   조작 안내
========================= */

.help{
  position:absolute;
  left:50%;
  bottom:5px;

  transform:translateX(-50%);

  z-index:100;

  font-size:10px;
  color:rgba(255,255,255,.8);

  text-shadow:0 2px 4px #000;

  white-space:nowrap;
}

/* =========================
   모바일
========================= */

@media(max-width:600px){

  .hud{
    left:7px;
    top:7px;
    min-width:130px;
    font-size:11px;
    padding:8px 10px;
  }

  .message{
    top:58px;
    font-size:13px;
  }

  .reset{
    right:7px;
    top:7px;
    padding:8px 10px;
    font-size:11px;
  }

  .goal{
    width:72vw;
    height:30vw;
    min-width:270px;
    min-height:170px;
  }

  .keeper{
    transform:
      translate(-50%,-50%)
      scale(.62);
  }

  .aim{
    width:62px;
    height:62px;
  }

  .legs{
    width:280px;
    height:225px;
  }

  .leg-left,
  .leg-right{
    width:61px;
    height:185px;
  }

  .leg-left{left:52px}
  .leg-right{right:52px}

  .boot-left,
  .boot-right{
    width:102px;
    height:51px;
  }

  .power-panel{
    bottom:16px;
    width:78vw;
  }

  .shot-buttons{
    bottom:70px;
  }

  .shot-btn{
    padding:7px 8px;
    font-size:11px;
  }

  .help{
    display:none;
  }
}
</style>
</head>

<body>

<div class="game" id="game">

  <div class="sky"></div>
  <div class="stands"></div>

  <div class="field">
    <div class="center-line"></div>
    <div class="penalty"></div>
    <div class="goal-area"></div>
  </div>

  <!-- 3D 골대 -->
  <div class="goal" id="goal">
    <div class="goal-net"></div>
    <div class="goal-depth"></div>
    <div class="goal-frame"></div>

    <!-- 골키퍼 -->
    <div class="keeper" id="keeper">
      <div class="keeper-head"></div>
      <div class="keeper-body"></div>

      <div class="keeper-arm left">
        <div class="glove"></div>
      </div>

      <div class="keeper-arm right">
        <div class="glove"></div>
      </div>

      <div class="keeper-leg left">
        <div class="keeper-boot"></div>
      </div>

      <div class="keeper-leg right">
        <div class="keeper-boot"></div>
      </div>
    </div>
  </div>

  <!-- 조준점 -->
  <div class="aim" id="aim">
    <div class="aim-dot"></div>
  </div>

  <!-- 공 -->
  <div class="ball ready" id="ball"></div>

  <!-- 플레이어 -->
  <div class="legs" id="legs">
    <div class="leg-left">
      <div class="boot-left"></div>
    </div>

    <div class="leg-right">
      <div class="boot-right"></div>
    </div>
  </div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-row">
      <span>⚽ 골</span>
      <span class="hud-value" id="score">0</span>
    </div>

    <div class="hud-row">
      <span>🎯 슛</span>
      <span class="hud-value" id="shots">0</span>
    </div>

    <div class="hud-row">
      <span>🧤 선방</span>
      <span class="hud-value" id="saves">0</span>
    </div>

    <div class="hud-row">
      <span>🔥 콤보</span>
      <span class="hud-value" id="combo">0</span>
    </div>

    <div class="hud-row">
      <span>🏆 최고</span>
      <span class="hud-value" id="highScore">0</span>
    </div>

    <div class="hud-row">
      <span>⭐ 레벨</span>
      <span class="hud-value" id="level">1</span>
    </div>
  </div>

  <div class="message" id="message">
    ⚽ 드래그해서 조준하세요!
  </div>

  <button class="reset" id="reset">
    🔄 다시 시작
  </button>

  <!-- 골 -->
  <div class="goal-text" id="goalText">
    GOAL! ⚽
  </div>

  <div class="combo-popup" id="comboPopup"></div>

  <!-- 슛 타입 -->
  <div class="shot-buttons">
    <button class="shot-btn active" data-type="normal">
      🎯 일반
    </button>

    <button class="shot-btn" data-type="curve">
      🌀 곡선
    </button>

    <button class="shot-btn" data-type="power">
      💥 파워
    </button>
  </div>

  <!-- 파워 -->
  <div class="power-panel">
    <div class="power-label">
      슛 파워 <span id="powerText">0%</span>
    </div>

    <div class="power-bar">
      <div class="power-fill" id="powerFill"></div>
    </div>

    <div class="power-mark">
      <span>약</span>
      <span>강</span>
      <span>MAX</span>
    </div>
  </div>

  <div class="help">
    PC: WASD / 방향키로 이동 · 마우스 드래그로 조준 · 클릭으로 슛 · SPACE로 슛
  </div>

</div>

<script>
/* =========================================================
   DOM
========================================================= */

const game = document.getElementById("game");
const ball = document.getElementById("ball");
const keeper = document.getElementById("keeper");
const legs = document.getElementById("legs");
const goal = document.getElementById("goal");
const aim = document.getElementById("aim");

const message = document.getElementById("message");
const goalText = document.getElementById("goalText");
const comboPopup = document.getElementById("comboPopup");

const scoreEl = document.getElementById("score");
const shotsEl = document.getElementById("shots");
const savesEl = document.getElementById("saves");
const comboEl = document.getElementById("combo");
const highScoreEl = document.getElementById("highScore");
const levelEl = document.getElementById("level");

const powerFill = document.getElementById("powerFill");
const powerText = document.getElementById("powerText");

const shotButtons =
  document.querySelectorAll(".shot-btn");

const resetBtn =
  document.getElementById("reset");


/* =========================================================
   상태
========================================================= */

let score = 0;
let shots = 0;
let saves = 0;
let combo = 0;

let level = 1;

let highScore =
  Number(localStorage.getItem("footballHighScore") || 0);

highScoreEl.textContent = highScore;

let shooting = false;

let ballX = 50;
let ballY = 65;

let keeperX = 50;

let playerOffsetX = 0;

let keys = {};

let shotType = "normal";

let aimX = 50;
let aimY = 43;

let power = 0;
let powerDirection = 1;

let charging = false;

let pointerDown = false;

let audioCtx = null;


/* =========================================================
   오디오
========================================================= */

function initAudio(){

  if(audioCtx)
    return;

  try{

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }catch(e){}
}


function tone(
  frequency,
  duration,
  type="sine",
  volume=.06
){

  if(!audioCtx)
    return;

  if(audioCtx.state === "suspended")
    audioCtx.resume();

  const osc =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();

  osc.type = type;
  osc.frequency.value = frequency;

  gain.gain.setValueAtTime(
    volume,
    audioCtx.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    .001,
    audioCtx.currentTime + duration
  );

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();

  osc.stop(
    audioCtx.currentTime + duration
  );
}


function soundKick(){

  tone(120,.08,"square",.09);

  setTimeout(
    ()=>tone(240,.08,"triangle",.06),
    35
  );
}


function soundSave(){

  tone(160,.12,"sawtooth",.08);

  setTimeout(
    ()=>tone(90,.18,"square",.05),
    90
  );
}


function soundGoal(){

  tone(523,.12,"triangle",.08);

  setTimeout(
    ()=>tone(659,.12,"triangle",.08),
    100
  );

  setTimeout(
    ()=>tone(784,.3,"triangle",.1),
    200
  );
}


/* =========================================================
   공
========================================================= */

function updateBall(){

  ball.style.left = ballX + "%";
  ball.style.top = ballY + "%";
}


function resetBall(){

  ballX =
    38 + Math.random() * 24;

  ballY =
    62 + Math.random() * 7;

  ball.style.width = "44px";
  ball.style.height = "44px";

  ball.style.transform =
    "translate(-50%,-50%)";

  ball.classList.add("ready");

  updateBall();
}


/* =========================================================
   레벨 / 난이도
========================================================= */

function updateLevel(){

  level =
    Math.floor(score / 3) + 1;

  levelEl.textContent = level;
}


function difficulty(){

  return Math.min(
    1.55,
    1 + (level - 1) * .07
  );
}


/* =========================================================
   골키퍼 AI
========================================================= */

let keeperDirection = 1;
let keeperTarget = 50;

function chooseKeeperTarget(){

  const reaction =
    Math.random();

  /*
    레벨이 높아질수록
    공의 예상 위치를 더 잘 읽는다.
  */

  if(reaction < .25){

    keeperTarget =
      35 + Math.random() * 30;

  }else{

    keeperTarget =
      20 + Math.random() * 60;
  }
}


function keeperAI(){

  if(!shooting){

    /*
      기본 좌우 순찰
    */

    const speed =
      .20 * difficulty();

    keeperX +=
      keeperDirection * speed;

    if(keeperX > 76){

      keeperX = 76;
      keeperDirection = -1;
    }

    if(keeperX < 24){

      keeperX = 24;
      keeperDirection = 1;
    }

    keeper.style.left =
      keeperX + "%";
  }

  requestAnimationFrame(keeperAI);
}

keeperAI();


/* =========================================================
   플레이어 이동
========================================================= */

document.addEventListener(
  "keydown",
  e=>{

    keys[e.key.toLowerCase()] = true;

    if(
      [
        "ArrowLeft",
        "ArrowRight",
        "ArrowUp",
        "ArrowDown",
        " "
      ].includes(e.key)
    ){
      e.preventDefault();
    }

    initAudio();

    /*
      SPACE:
      파워 게이지 시작/정지
    */

    if(e.code === "Space" && !shooting){

      if(!charging){

        startPower();

      }else{

        shoot();
      }
    }

  }
);


document.addEventListener(
  "keyup",
  e=>{

    keys[e.key.toLowerCase()] = false;

  }
);


function movement(){

  if(!shooting){

    const speed =
      .45 + level * .025;

    if(
      keys["arrowleft"] ||
      keys["a"]
    ){

      playerOffsetX -= speed;
      aimX -= .25;
      ballX -= .18;
    }

    if(
      keys["arrowright"] ||
      keys["d"]
    ){

      playerOffsetX += speed;
      aimX += .25;
      ballX += .18;
    }

    if(
      keys["arrowup"] ||
      keys["w"]
    ){

      aimY -= .18;
    }

    if(
      keys["arrowdown"] ||
      keys["s"]
    ){

      aimY += .18;
    }

    playerOffsetX =
      Math.max(
        -70,
        Math.min(70, playerOffsetX)
      );

    ballX =
      Math.max(
        25,
        Math.min(75, ballX)
      );

    aimX =
      Math.max(
        18,
        Math.min(82, aimX)
      );

    aimY =
      Math.max(
        30,
        Math.min(55, aimY)
      );

    legs.style.transform =
      "translateX(calc(-50% + " +
      playerOffsetX +
      "px))";

    aim.style.left =
      aimX + "%";

    aim.style.top =
      aimY + "%";

    updateBall();
  }

  requestAnimationFrame(movement);
}

movement();


/* =========================================================
   파워 게이지
========================================================= */

function startPower(){

  if(shooting)
    return;

  initAudio();

  charging = true;

  power =
    power > 0 ? power : 5;

  message.textContent =
    "💥 파워를 맞춰서 슛하세요!";

  powerLoop();
}


function powerLoop(){

  if(!charging)
    return;

  power +=
    powerDirection * 1.8;

  if(power >= 100){

    power = 100;
    powerDirection = -1;

  }

  if(power <= 5){

    power = 5;
    powerDirection = 1;
  }

  powerFill.style.width =
    power + "%";

  powerText.textContent =
    Math.round(power) + "%";

  requestAnimationFrame(
    powerLoop
  );
}


function stopPower(){

  charging = false;

  powerDirection = 1;
}


/* =========================================================
   마우스 / 터치 조준
========================================================= */

function setAimFromPointer(
  clientX,
  clientY
){

  const rect =
    game.getBoundingClientRect();

  const x =
    (clientX - rect.left) /
    rect.width *
    100;

  const y =
    (clientY - rect.top) /
    rect.height *
    100;

  /*
    골대 영역에 맞게 조준 제한
  */

  aimX =
    Math.max(
      18,
      Math.min(82,x)
    );

  aimY =
    Math.max(
      28,
      Math.min(56,y)
    );

  aim.style.left =
    aimX + "%";

  aim.style.top =
    aimY + "%";
}


game.addEventListener(
  "pointerdown",
  e=>{

    initAudio();

    pointerDown = true;

    setAimFromPointer(
      e.clientX,
      e.clientY
    );

    /*
      공 근처를 누르면
      파워 게이지 충전
    */

    const ballRect =
      ball.getBoundingClientRect();

    const bx =
      ballRect.left +
      ballRect.width / 2;

    const by =
      ballRect.top +
      ballRect.height / 2;

    const distance =
      Math.hypot(
        e.clientX - bx,
        e.clientY - by
      );

    if(distance < 150){

      startPower();

    }else{

      message.textContent =
        "🎯 드래그해서 골대 방향을 조준하세요!";
    }

  }
);


game.addEventListener(
  "pointermove",
  e=>{

    if(!pointerDown)
      return;

    setAimFromPointer(
      e.clientX,
      e.clientY
    );

  }
);


game.addEventListener(
  "pointerup",
  e=>{

    if(!pointerDown)
      return;

    pointerDown = false;

    /*
      충전 중이었다면
      손을 놓는 순간 슛
    */

    if(charging){

      stopPower();

      if(power < 10)
        power = 65;

      shoot();

    }

  }
);


/* =========================================================
   슛 타입
========================================================= */

shotButtons.forEach(btn=>{

  btn.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      shotType =
        btn.dataset.type;

      shotButtons.forEach(
        b=>b.classList.remove("active")
      );

      btn.classList.add("active");

      if(shotType === "normal"){

        message.textContent =
          "🎯 일반 슛";

      }else if(shotType === "curve"){

        message.textContent =
          "🌀 곡선 슛";

      }else{

        message.textContent =
          "💥 파워 슛";
      }
    }
  );

});


/* =========================================================
   공 클릭
========================================================= */

ball.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    if(shooting)
      return;

    initAudio();

    /*
      클릭만 하면
      기본 75% 파워 슛
    */

    if(!charging)
      power = 75;

    shoot();
  }
);


/* =========================================================
   슛
========================================================= */

function shoot(){

  if(shooting)
    return;

  shooting = true;

  stopPower();

  ball.classList.remove("ready");

  shots++;

  shotsEl.textContent =
    shots;

  legs.classList.add("kick");

  soundKick();

  const startX = ballX;
  const startY = ballY;

  /*
    조준점 -> 공의 최종 목표
  */

  let targetX =
    aimX;

  let targetY =
    aimY;

  /*
    파워 슛은 더 빠르고
    곡선 슛은 횡방향 이동
  */

  let curve = 0;

  if(shotType === "curve"){

    curve =
      aimX < 50
        ? -18
        : 18;

  }else if(shotType === "power"){

    curve = 0;
  }

  const pwr =
    Math.max(
      .2,
      power / 100
    );

  const duration =
    shotType === "power"
      ? 600 - pwr * 120
      : 850 - pwr * 180;

  const start =
    performance.now();

  let blocked = false;

  /*
    골키퍼가 미리 예측
  */

  const prediction =
    targetX +
    curve * .35;

  /*
    AI 오차.
    레벨이 올라갈수록 작아짐.
  */

  const aiError =
    Math.max(
      2.5,
      13 - level * .7
    );

  keeperTarget =
    prediction +
    (Math.random()-.5) *
    aiError;

  keeperTarget =
    Math.max(
      18,
      Math.min(82,keeperTarget)
    );


  function animate(now){

    const p =
      Math.min(
        (now-start) /
        duration,
        1
      );

    /*
      부드러운 진행
    */

    const eased =
      1 -
      Math.pow(1-p,1.7);

    /*
      곡선 궤적
    */

    let currentX =
      startX +
      (targetX-startX) *
      eased;

    if(shotType === "curve"){

      currentX +=
        curve *
        Math.sin(Math.PI * eased);
    }

    /*
      공이 골대로 올라간다.
    */

    const currentY =
      startY -
      (startY-targetY) *
      eased;

    ballX = currentX;
    ballY = currentY;

    /*
      공 크기
    */

    let size;

    if(shotType === "power"){

      size =
        44 +
        eased * 115;

    }else{

      size =
        44 +
        eased * 90;
    }

    ball.style.width =
      size + "px";

    ball.style.height =
      size + "px";

    /*
      회전
    */

    let rotation =
      eased * (
        shotType === "curve"
          ? 1600
          : 1000
      );

    ball.style.transform =
      "translate(-50%,-50%) " +
      "rotate(" +
      rotation +
      "deg)";

    /*
      골키퍼 움직임
    */

    if(p < .75){

      const keeperEase =
        Math.min(
          1,
          Math.max(
            0,
            (p-.15)/.6
          )
        );

      keeperX =
        50 +
        (keeperTarget-50) *
        keeperEase;

      keeper.style.left =
        keeperX + "%";
    }

    /*
      선방 판정
    */

    const verticalDistance =
      Math.abs(
        currentY - 38
      );

    const horizontalDistance =
      Math.abs(
        currentX - keeperX
      );

    /*
      파워 슛은 속도가 빠르므로
      선방 판정 시간이 짧아진다.
    */

    const reactionStart =
      shotType === "power"
        ? .60
        : .48;

    const reactionEnd =
      shotType === "power"
        ? .79
        : .88;

    const keeperReach =
      shotType === "power"
        ? 8.5
        : 12;

    if(
      !blocked &&
      p > reactionStart &&
      p < reactionEnd &&
      horizontalDistance < keeperReach &&
      verticalDistance < 13
    ){

      blocked = true;

      keeperSave(
        currentX < keeperX
      );

      return;
    }

    updateBall();

    if(p < 1){

      requestAnimationFrame(
        animate
      );

    }else{

      /*
        골대 밖으로 벗어났다면 실패
      */

      if(
        targetX < 18 ||
        targetX > 82 ||
        targetY < 27 ||
        targetY > 56
      ){

        missShot();

      }else{

        goalSuccess();
      }
    }
  }

  requestAnimationFrame(
    animate
  );
}


/* =========================================================
   선방
========================================================= */

function keeperSave(
  diveLeft
){

  shooting = false;

  saves++;

  savesEl.textContent =
    saves;

  combo = 0;

  comboEl.textContent =
    combo;

  soundSave();

  keeper.classList.remove(
    "dive-left",
    "dive-right",
    "dive-center"
  );

  void keeper.offsetWidth;

  /*
    중앙/좌/우 다이빙
  */

  if(
    Math.abs(
      keeperX - 50
    ) < 8
  ){

    keeper.classList.add(
      "dive-center"
    );

  }else{

    keeper.classList.add(
      diveLeft
        ? "dive-left"
        : "dive-right"
    );
  }

  message.textContent =
    "🧤 슈퍼 세이브!";

  /*
    공 반동
  */

  ball.style.transform =
    "translate(-50%,-50%) scale(.7)";

  createSaveParticles();

  setTimeout(
    resetRound,
    850
  );
}


/* =========================================================
   실패
========================================================= */

function missShot(){

  shooting = false;

  combo = 0;

  comboEl.textContent =
    combo;

  message.textContent =
    "😅 빗나갔습니다!";

  setTimeout(
    resetRound,
    700
  );
}


/* =========================================================
   골
========================================================= */

function goalSuccess(){

  score++;

  combo++;

  updateLevel();

  /*
    콤보 보너스
  */

  const bonus =
    combo > 1
      ? combo * 25
      : 0;

  const gained =
    100 * level +
    bonus;

  /*
    실제 화면 점수는
    골 개수 기반으로 표시하되
    최고점수는 점수 시스템 사용
  */

  const totalScore =
    score * 100 +
    Math.max(0,combo-1) * 50;

  if(totalScore > highScore){

    highScore = totalScore;

    localStorage.setItem(
      "footballHighScore",
      highScore
    );
  }

  scoreEl.textContent =
    score;

  comboEl.textContent =
    combo;

  highScoreEl.textContent =
    highScore;

  message.textContent =
    combo >= 3
      ? "🔥 연속 골! 대단합니다!"
      : "🎉 GOAL!";

  soundGoal();

  /*
    골 애니메이션
  */

  goalText.classList.remove("show");

  void goalText.offsetWidth;

  goalText.classList.add("show");

  /*
    골망
  */

  goal.classList.remove("hit");

  void goal.offsetWidth;

  goal.classList.add("hit");

  /*
    화면 흔들림
  */

  game.classList.remove("shake");

  void game.offsetWidth;

  game.classList.add("shake");

  /*
    파티클
  */

  createGoalParticles();

  /*
    콤보
  */

  if(combo >= 2){

    comboPopup.textContent =
      "🔥 " +
      combo +
      " COMBO!";

    comboPopup.classList.remove(
      "show"
    );

    void comboPopup.offsetWidth;

    comboPopup.classList.add(
      "show"
    );
  }

  setTimeout(
    resetRound,
    1100
  );
}


/* =========================================================
   골 파티클
========================================================= */

function createGoalParticles(){

  const rect =
    goal.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width/2;

  const centerY =
    rect.top +
    rect.height*.55;

  const colors = [
    "#ffe600",
    "#fff",
    "#32d583",
    "#35a7ff",
    "#ff5b5b"
  ];

  for(
    let i=0;
    i<70;
    i++
  ){

    const particle =
      document.createElement("div");

    particle.className =
      "particle";

    particle.style.background =
      colors[
        Math.floor(
          Math.random() *
          colors.length
        )
      ];

    particle.style.left =
      centerX + "px";

    particle.style.top =
      centerY + "px";

    game.appendChild(
      particle
    );

    const angle =
      Math.random() *
      Math.PI * 2;

    const distance =
      50 +
      Math.random() * 230;

    const dx =
      Math.cos(angle) *
      distance;

    const dy =
      Math.sin(angle) *
      distance;

    const duration =
      500 +
      Math.random() * 650;

    particle.animate(
      [
        {
          transform:
            "translate(-50%,-50%) scale(1)",
          opacity:1
        },
        {
          transform:
            "translate(calc(-50% + " +
            dx +
            "px), calc(-50% + " +
            dy +
            "px)) scale(.1)",
          opacity:0
        }
      ],
      {
        duration,
        easing:"cubic-bezier(.1,.7,.2,1)"
      }
    );

    setTimeout(
      ()=>particle.remove(),
      duration + 50
    );
  }
}


/* =========================================================
   선방 파티클
========================================================= */

function createSaveParticles(){

  const rect =
    keeper.getBoundingClientRect();

  const cx =
    rect.left +
    rect.width/2;

  const cy =
    rect.top +
    rect.height/2;

  for(
    let i=0;
    i<20;
    i++
  ){

    const p =
      document.createElement("div");

    p.className =
      "particle";

    p.style.background =
      i%2
        ? "#f4dc48"
        : "#fff";

    p.style.left =
      cx + "px";

    p.style.top =
      cy + "px";

    game.appendChild(p);

    const dx =
      (Math.random()-.5)*180;

    const dy =
      (Math.random()-.5)*120;

    const duration =
      300 +
      Math.random()*300;

    p.animate(
      [
        {
          transform:
            "translate(-50%,-50%) scale(1)",
          opacity:1
        },
        {
          transform:
            "translate(calc(-50% + " +
            dx +
            "px), calc(-50% + " +
            dy +
            "px)) scale(.1)",
          opacity:0
        }
      ],
      {
        duration,
        easing:"ease-out"
      }
    );

    setTimeout(
      ()=>p.remove(),
      duration+50
    );
  }
}


/* =========================================================
   라운드 리셋
========================================================= */

function resetRound(){

  shooting = false;

  charging = false;

  pointerDown = false;

  power = 0;

  powerDirection = 1;

  powerFill.style.width =
    "0%";

  powerText.textContent =
    "0%";

  legs.classList.remove(
    "kick"
  );

  keeper.classList.remove(
    "dive-left",
    "dive-right",
    "dive-center"
  );

  keeperX =
    25 + Math.random()*50;

  keeperTarget =
    keeperX;

  keeper.style.left =
    keeperX + "%";

  aimX =
    38 + Math.random()*24;

  aimY =
    36 + Math.random()*15;

  aim.style.left =
    aimX + "%";

  aim.style.top =
    aimY + "%";

  resetBall();

  message.textContent =
    "⚽ 드래그해서 조준하세요!";
}


/* =========================================================
   전체 리셋
========================================================= */

resetBtn.addEventListener(
  "click",
  e=>{

    e.stopPropagation();

    score = 0;
    shots = 0;
    saves = 0;
    combo = 0;
    level = 1;

    shooting = false;
    charging = false;
    pointerDown = false;

    power = 0;
    powerDirection = 1;

    playerOffsetX = 0;

    scoreEl.textContent = "0";
    shotsEl.textContent = "0";
    savesEl.textContent = "0";
    comboEl.textContent = "0";
    levelEl.textContent = "1";
    highScoreEl.textContent =
      highScore;

    powerFill.style.width =
      "0%";

    powerText.textContent =
      "0%";

    legs.classList.remove(
      "kick"
    );

    keeper.classList.remove(
      "dive-left",
      "dive-right",
      "dive-center"
    );

    keeperX = 50;

    keeper.style.left =
      "50%";

    legs.style.transform =
      "translateX(-50%)";

    aimX = 50;
    aimY = 43;

    aim.style.left =
      "50%";

    aim.style.top =
      "43%";

    resetBall();

    message.textContent =
      "⚽ 새로운 경기를 시작합니다!";

    initAudio();

    setTimeout(
      ()=>{
        message.textContent =
          "⚽ 드래그해서 조준하세요!";
      },
      1000
    );
  }
);


/* =========================================================
   더블클릭 방지
========================================================= */

game.addEventListener(
  "dblclick",
  e=>{
    e.preventDefault();
  }
);


/* =========================================================
   초기화
========================================================= */

updateLevel();

resetBall();

chooseKeeperTarget();

message.textContent =
  "⚽ 드래그해서 조준하세요!";


/* =========================================================
   게임 시작 시 키보드 포커스 없이도
   SPACE 작동하도록 오디오 초기화
========================================================= */

document.addEventListener(
  "pointerdown",
  initAudio,
  {once:false}
);

</script>
