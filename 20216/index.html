<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 행성 개발자</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: white;
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 20%, #263764 0, transparent 25%),
        radial-gradient(circle at 80% 70%, #432760 0, transparent 25%),
        #070a15;
}

header {
    height: 70px;
    padding: 0 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(8,12,27,.95);
    border-bottom: 1px solid #303858;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

.money {
    color: #ffd84d;
    font-size: 20px;
    font-weight: bold;
}

.game {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 20px;
    max-width: 1500px;
    margin: auto;
    padding: 20px;
}

.panel {
    background: rgba(15,20,40,.94);
    border: 1px solid #303858;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,.3);
}

.planet-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.planet-name {
    color: #7fd7ff;
}

.income {
    color: #9cff9c;
    font-size: 14px;
}

.world {
    height: 560px;
    margin-top: 15px;
    border-radius: 18px;
    overflow: hidden;
    position: relative;
    background:
        radial-gradient(circle at 50% 50%, #1c2541, #080b17);
    border: 1px solid #3a4265;
}

.world::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        radial-gradient(circle, white 1px, transparent 1px),
        radial-gradient(circle, #aab9ff 1px, transparent 1px);
    background-size: 90px 90px, 140px 140px;
    opacity: .35;
}

.camera {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 100%;
    height: 100%;
    transform: translate(-50%,-50%);
}

.planet {
    position: absolute;
    width: 330px;
    height: 330px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    border-radius: 50%;
    cursor: pointer;
    overflow: visible;
    transition: width .15s, height .15s, filter .3s;
}

.planet:hover {
    filter: brightness(1.12);
}

/* 행성 */

.planet-0 {
    background: radial-gradient(circle at 35% 30%,#9a785b,#49372c 55%,#211914);
    box-shadow: 0 0 35px #72503a,inset -35px -25px 60px rgba(0,0,0,.5);
}

.planet-1 {
    background: radial-gradient(circle at 30% 30%,#ff7043,#9d2f20 55%,#3a100d);
    box-shadow: 0 0 45px #ff5a30,inset -35px -25px 60px rgba(0,0,0,.5);
}

.planet-2 {
    background: radial-gradient(circle at 30% 25%,#66d7ff,#1684c2 50%,#064d7d);
    box-shadow: 0 0 45px #22bfff,inset -35px -25px 60px rgba(0,0,0,.5);
}

.planet-3 {
    background: radial-gradient(circle at 35% 25%,#d35cff,#63249b 50%,#24103e);
    box-shadow: 0 0 50px #bd45ff,inset -35px -25px 60px rgba(0,0,0,.5);
}

.planet-4 {
    background: radial-gradient(circle at 30% 25%,#9cff6c,#299348 50%,#0c4121);
    box-shadow: 0 0 50px #54ff72,inset -35px -25px 60px rgba(0,0,0,.5);
}

.planet-5 {
    background: radial-gradient(circle at 30% 25%,#ffe68a,#bd812b 50%,#54330e);
    box-shadow: 0 0 55px #ffbf40,inset -35px -25px 60px rgba(0,0,0,.5);
}

.planet-6 {
    background: radial-gradient(circle at 30% 25%,#ff9ad9,#9d297e 50%,#3b1035);
    box-shadow: 0 0 55px #ff5dc5;
}

.planet-7 {
    background: radial-gradient(circle at 30% 25%,#9affff,#287e92 50%,#10323b);
    box-shadow: 0 0 55px #43eaff;
}

.planet-8 {
    background: radial-gradient(circle at 30% 25%,#fff,#7e82c9 50%,#282952);
    box-shadow: 0 0 60px #a6a9ff;
}

.planet-9 {
    background: radial-gradient(circle at 30% 25%,#ffad6b,#a74322 50%,#35140b);
    box-shadow: 0 0 60px #ff7338;
}

/* =====================================================
   행성 발전 시각 효과
===================================================== */

.planet::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.08);
    pointer-events: none;
}

/* 대기권 */
.atmosphere {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 3px solid rgba(110,200,255,.16);
    pointer-events: none;
    z-index: 20;
}

/* 지형 */

.terrain {
    position: absolute;
    pointer-events: none;
    user-select: none;
    font-size: 30px;
    z-index: 1;
}

/* =====================================================
   도시 시스템
===================================================== */

#cityLayer,
#roadLayer,
#powerLayer,
#buildings,
#advancedLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
}

#roadLayer {
    z-index: 2;
}

#powerLayer {
    z-index: 3;
}

#cityLayer {
    z-index: 4;
}

#buildings {
    z-index: 8;
}

#advancedLayer {
    z-index: 15;
}

/* 도로 */

.road {
    position: absolute;
    height: 8px;
    transform-origin: left center;
    background:
        repeating-linear-gradient(
            90deg,
            #333844 0 20px,
            #505564 20px 28px
        );
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 5px;
    box-shadow: 0 2px 3px rgba(0,0,0,.45);
    opacity: .95;
}

.road::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 3px;
    height: 2px;
    background: #e6c85a;
    opacity: .65;
}

/* 전력선 */

.power-line {
    position: absolute;
    height: 3px;
    transform-origin: left center;
    background: #73e8ff;
    box-shadow: 0 0 6px #4bdfff;
    opacity: .75;
}

/* 도시 건물 */

.city-building {
    position: absolute;
    transform: translate(-50%,-50%);
    border-radius: 3px 3px 1px 1px;
    background: linear-gradient(#8994a8,#303746);
    border: 1px solid #b7c2d5;
    box-shadow: 0 3px 5px rgba(0,0,0,.55);
}

.city-building::before {
    content: "";
    position: absolute;
    left: 5px;
    top: 5px;
    width: 5px;
    height: 5px;
    background: #a8eaff;
    box-shadow:
        9px 0 #a8eaff,
        18px 0 #a8eaff,
        0 9px #a8eaff,
        9px 9px #a8eaff,
        18px 9px #a8eaff;
}

.city-small {
    width: 25px;
    height: 32px;
}

.city-medium {
    width: 32px;
    height: 46px;
}

.city-tall {
    width: 28px;
    height: 65px;
}

.city-tower {
    width: 18px;
    height: 82px;
    border-radius: 8px 8px 2px 2px;
}

/* =====================================================
   돔
===================================================== */

.dome {
    position: absolute;
    transform: translate(-50%,-50%);
    width: 75px;
    height: 48px;
    border-radius: 75px 75px 5px 5px;
    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(255,255,255,.5),
            rgba(70,210,255,.28) 40%,
            rgba(20,100,150,.55)
        );
    border: 2px solid #9cecff;
    box-shadow:
        0 0 15px rgba(83,220,255,.75),
        inset 0 -10px 20px rgba(0,0,0,.3);
}

.dome::after {
    content: "🌱";
    position: absolute;
    left: 50%;
    top: 18px;
    transform: translateX(-50%);
    font-size: 20px;
}

/* =====================================================
   우주선 / 착륙장
===================================================== */

.landing-pad {
    position: absolute;
    transform: translate(-50%,-50%);
    width: 65px;
    height: 65px;
    border-radius: 50%;
    border: 2px solid #cdd8ff;
    background: rgba(20,25,45,.75);
    box-shadow: 0 0 12px rgba(160,180,255,.5);
}

.landing-pad::before {
    content: "H";
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    font-size: 23px;
    color: #dce5ff;
}

.ship {
    position: absolute;
    transform: translate(-50%,-50%);
    font-size: 29px;
    filter: drop-shadow(0 0 7px #7fdfff);
    animation: shipHover 2s ease-in-out infinite;
}

@keyframes shipHover {
    0%,100% {
        margin-top: 0;
    }
    50% {
        margin-top: -7px;
    }
}

/* =====================================================
   궤도 시설
===================================================== */

.orbit {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 390px;
    height: 390px;
    transform: translate(-50%,-50%);
    border: 1px dashed rgba(180,210,255,.35);
    border-radius: 50%;
    pointer-events: none;
}

.satellite {
    position: absolute;
    font-size: 27px;
    filter: drop-shadow(0 0 8px #9eeaff);
    animation: orbitSpin 12s linear infinite;
}

@keyframes orbitSpin {
    from {
        transform: rotate(0deg) translateX(195px) rotate(0deg);
    }
    to {
        transform: rotate(360deg) translateX(195px) rotate(-360deg);
    }
}

/* 우주 엘리베이터 */

.space-elevator {
    position: absolute;
    left: 50%;
    top: 4%;
    transform: translateX(-50%);
    width: 5px;
    height: 92%;
    background: linear-gradient(
        #aef5ff,
        #6d9fff,
        #b76cff
    );
    box-shadow:
        0 0 8px #6eeaff,
        0 0 18px #785cff;
}

.space-elevator::before {
    content: "🛰️";
    position: absolute;
    left: 50%;
    top: 5%;
    transform: translate(-50%,-50%);
    font-size: 22px;
}

.space-elevator::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 25px;
    height: 25px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: #d9f8ff;
    box-shadow: 0 0 15px #7beaff;
}

/* =====================================================
   일반 건물
===================================================== */

.building {
    position: absolute;
    transform: translate(-50%,-50%);
    pointer-events: none;
    animation: buildingAppear .45s ease;
}

.building-body {
    position: relative;
    width: 34px;
    height: 32px;
    border-radius: 5px;
    box-shadow:
        0 5px 8px rgba(0,0,0,.55),
        inset 0 2px rgba(255,255,255,.25);
}

.building-roof {
    position: absolute;
    width: 44px;
    height: 14px;
    left: -5px;
    top: -10px;
    clip-path: polygon(50% 0%,100% 100%,0 100%);
}

.building-window {
    position: absolute;
    width: 7px;
    height: 9px;
    border-radius: 2px;
    background: #c8f5ff;
    left: 7px;
    top: 10px;
    box-shadow: 13px 0 #c8f5ff;
}

.building-sign {
    position: absolute;
    font-size: 15px;
    left: 50%;
    top: -27px;
    transform: translateX(-50%);
    filter: drop-shadow(0 2px 2px black);
    white-space: nowrap;
}

.building-mine .building-body {
    background: linear-gradient(#805c45,#3e2a20);
    border: 2px solid #b89168;
}

.building-mine .building-roof {
    background: #543b2d;
}

.building-mine .building-sign::before {
    content: "⛏️";
}

.building-water .building-body {
    background: linear-gradient(#50bfff,#166caa);
    border: 2px solid #a8e8ff;
    border-radius: 7px;
}

.building-water .building-roof {
    background: #278bc5;
    border-radius: 50%;
    height: 9px;
    top: -6px;
}

.building-water .building-sign::before {
    content: "💧";
}

.building-energy .building-body {
    background: linear-gradient(#666d80,#292d3b);
    border: 2px solid #9ca8c9;
}

.building-energy .building-roof {
    background: #3b4155;
}

.building-energy .building-sign::before {
    content: "⚡";
}

.building-life .building-body {
    background: linear-gradient(#56b95c,#1b6030);
    border: 2px solid #a5f29a;
    border-radius: 8px;
}

.building-life .building-roof {
    background: #37883e;
}

.building-life .building-sign::before {
    content: "🌿";
}

.building-alloy .building-body {
    width: 43px;
    height: 38px;
    background: linear-gradient(#b7beca,#515866);
    border: 2px solid #e4e9f0;
}

.building-alloy .building-roof {
    width: 53px;
    background: #777f8d;
}

.building-alloy .building-sign::before {
    content: "🔩";
}

.building-crystal .building-body {
    width: 38px;
    height: 44px;
    background: linear-gradient(#ae72ff,#4e278d);
    border: 2px solid #e0bfff;
    clip-path: polygon(
        15% 0,85% 0,100% 25%,85% 100%,
        15% 100%,0 25%
    );
    box-shadow: 0 0 14px #c874ff;
}

.building-crystal .building-roof {
    display: none;
}

.building-crystal .building-sign::before {
    content: "💎";
}

.building-nuclear .building-body {
    width: 46px;
    height: 39px;
    background: linear-gradient(#59636f,#222933);
    border: 2px solid #9effb3;
    border-radius: 50% 50% 5px 5px;
    box-shadow: 0 0 13px rgba(100,255,150,.65);
}

.building-nuclear .building-roof {
    width: 35px;
    height: 15px;
    left: 5px;
    background: #879493;
    border-radius: 50%;
    clip-path: none;
    top: -7px;
}

.building-nuclear .building-sign::before {
    content: "☢️";
}

.building-gene .building-body {
    width: 48px;
    height: 44px;
    background: linear-gradient(90deg,#287c69,#55d4a8,#246b59);
    border: 2px solid #a5ffe1;
    border-radius: 12px 12px 5px 5px;
}

.building-gene .building-roof {
    width: 54px;
    background: #3ca786;
    border-radius: 6px;
}

.building-gene .building-sign::before {
    content: "🧬";
}

.building-darkMatter .building-body {
    width: 48px;
    height: 48px;
    background: radial-gradient(circle,#8d61ff,#201047 60%,#090511);
    border: 2px solid #bda3ff;
    border-radius: 50%;
    box-shadow:
        0 0 10px #8c58ff,
        0 0 25px rgba(132,73,255,.55);
}

.building-darkMatter .building-roof {
    display: none;
}

.building-darkMatter .building-sign::before {
    content: "🌌";
}

.building-crystal .building-window,
.building-darkMatter .building-window {
    display: none;
}

@keyframes buildingAppear {
    from {
        opacity: 0;
        transform: translate(-50%,-50%) scale(.2);
    }

    to {
        opacity: 1;
        transform: translate(-50%,-50%) scale(1);
    }
}

/* =====================================================
   UI
===================================================== */

.controls {
    text-align: center;
    margin-top: 10px;
    color: #aab2d0;
    font-size: 13px;
    line-height: 1.7;
}

.zoom-help {
    color: #6fcfff;
}

.click-message {
    text-align: center;
    min-height: 25px;
    margin-top: 5px;
    color: #ffd84d;
    font-weight: bold;
}

.progress-box {
    margin-top: 15px;
}

.progress-bar {
    height: 24px;
    background: #1b2037;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #363e60;
}

.progress {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg,#4dff9a,#39bfff);
    transition: width .3s;
}

.progress-text {
    margin-top: 7px;
    text-align: center;
    font-size: 14px;
    color: #cdd4f4;
}

.bonus-text,
.unlock-text {
    text-align: center;
    font-size: 12px;
    margin-top: 5px;
}

.bonus-text {
    color: #ffdc65;
}

.unlock-text {
    color: #7fd7ff;
}

.resource {
    background: #171d35;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
}

.resource-value {
    color: #ffd84d;
}

.shop {
    margin-top: 20px;
}

.shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #151b31;
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 8px;
}

button {
    border: 0;
    border-radius: 8px;
    padding: 9px 12px;
    background: #3559b8;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #4a6ed0;
}

button:disabled {
    background: #30364d;
    color: #777f99;
    cursor: not-allowed;
}

.development-card {
    background: #151b31;
    border: 1px solid #293354;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 10px;
}

.locked-card {
    opacity: .55;
}

.development-header {
    display: flex;
    justify-content: space-between;
}

.development-name {
    font-weight: bold;
}

.level {
    color: #8da7ff;
    font-size: 13px;
}

.cost {
    margin: 8px 0;
    color: #aeb7d7;
    font-size: 13px;
}

.develop-btn {
    width: 100%;
}

.next-planet {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    font-size: 16px;
    background: linear-gradient(90deg,#6a45d9,#a044ff);
}

.save-panel {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 1px solid #303858;
}

.save-buttons {
    display: flex;
    gap: 7px;
}

.save-buttons button {
    flex: 1;
    font-size: 12px;
}

.save-status {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: #8992b3;
}

@media(max-width:900px) {
    .game {
        grid-template-columns: 1fr;
    }

    .world {
        height: 500px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌌 행성 개발자</h1>

    <div class="money">
        💰 <span id="money">0</span>원
    </div>
</header>

<div class="game">

<div class="panel">

    <div class="planet-title">

        <div>
            <h2 id="planetName" class="planet-name">
                행성
            </h2>

            <div id="income" class="income">
                클릭 수익: +1원
            </div>
        </div>

        <div id="planetNumber">
            행성 1
        </div>

    </div>

    <div class="world">

        <div class="camera" id="camera">

            <div class="planet planet-0" id="planet">

                <div class="atmosphere"></div>

                <div id="roadLayer"></div>

                <div id="powerLayer"></div>

                <div id="cityLayer"></div>

                <div class="terrain" style="left:18%;top:27%">
                    🪨
                </div>

                <div class="terrain" style="left:72%;top:22%">
                    🌋
                </div>

                <div class="terrain" style="left:25%;top:73%">
                    🪨
                </div>

                <div class="terrain" style="left:72%;top:68%">
                    🌿
                </div>

                <div id="buildings"></div>

                <div id="advancedLayer"></div>

            </div>

        </div>

    </div>

    <div class="controls">
        WASD : 행성 주변 이동
        <br>
        <span class="zoom-help">
            Q : 축소　|　E : 확대
        </span>
    </div>

    <div id="clickMessage" class="click-message"></div>

    <div class="progress-box">

        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>

        <div id="progressText" class="progress-text">
            발전도 0 / 20
        </div>

        <div id="bonusText" class="bonus-text"></div>

        <div id="unlockText" class="unlock-text"></div>

    </div>

</div>


<div class="panel">

    <h3>📦 자원</h3>

    <div class="resource">
        <span>⛏️ 광물</span>
        <span id="mineral" class="resource-value">0</span>
    </div>

    <div class="resource">
        <span>💧 물</span>
        <span id="water" class="resource-value">0</span>
    </div>

    <div class="resource">
        <span>⚡ 에너지</span>
        <span id="energy" class="resource-value">0</span>
    </div>

    <div class="resource">
        <span>🌿 생명</span>
        <span id="life" class="resource-value">0</span>
    </div>

    <div id="newResources"></div>

    <div class="shop">

        <h3>🛒 자원 구매</h3>

        <div class="shop-item">
            <span>⛏️ 광물 — 15원</span>
            <button onclick="buyResource('mineral')">구매</button>
        </div>

        <div class="shop-item">
            <span>💧 물 — 25원</span>
            <button onclick="buyResource('water')">구매</button>
        </div>

        <div class="shop-item">
            <span>⚡ 에너지 — 40원</span>
            <button onclick="buyResource('energy')">구매</button>
        </div>

        <div class="shop-item">
            <span>🌿 생명 — 60원</span>
            <button onclick="buyResource('life')">구매</button>
        </div>

        <div id="newShop"></div>

    </div>

function generatePlanetName() {

    const a =
        nameA[Math.floor(Math.random()*nameA.length)];

    const b =
        nameB[Math.floor(Math.random()*nameB.length)];

    if(Math.random() < .35) {

        return a+b+"-"+(
            Math.floor(Math.random()*900)+100

    return a+b;
}


/* =====================================================

}

/* =====================================================
   클릭 수익
===================================================== */

function getClickIncome() {
    return state.planetIndex + 1;
}


/* =====================================================
   자원 해금
===================================================== */

function isResourceUnlocked(id) {

    const r =
        newResources.find(x => x.id === id);

    if(!r) return true;

    return state.development >= r.unlock;
}


function checkResourceUnlocks() {

    for(let i=0;i<newResources.length;i++) {

        const resource =
            newResources[i];

        if(
            state.development >= resource.unlock &&
            state.unlockedResources < i+1
        ) {

            state.unlockedResources = i+1;

            state.resources[resource.id]++;

            clickMessageEl.textContent =
                `🎉 ${resource.name} 해금! +1`;

            setTimeout(()=>{
                clickMessageEl.textContent="";
            },1800);
        }
    }
}


/* =====================================================
   개발 비용
===================================================== */

function getDevelopmentCost(type) {

    const data =
        developmentTypes[type];

    const level =
        state.levels[type];

    const cost = {};

    for(const resource in data.base) {

        cost[resource] =
            data.base[resource] +
            data.increase[resource]*level;
    }

    return cost;
}


function getResourceIcon(resource) {

    const icons = {
        mineral:"⛏️",
        water:"💧",
        energy:"⚡",
        life:"🌿",
        alloy:"🔩",
        crystal:"💎",
        nuclear:"☢️",
        gene:"🧬",
        darkMatter:"🌌"
    };

    return icons[resource] || "";
}


function formatCost(cost) {

    return Object.entries(cost)
        .map(
            ([r,n]) =>
                `${getResourceIcon(r)} ${n}`
        )
        .join(" / ");
}


function canDevelop(type) {

    const data =
        developmentTypes[type];

    if(state.development < data.unlock)
        return false;

    const cost =
        getDevelopmentCost(type);

    for(const resource in cost) {

        if(
            state.resources[resource] <
            cost[resource]
        ) return false;
    }

    return true;
}


/* =====================================================
   개발
===================================================== */

function develop(type) {

    if(
        state.development >=
        state.developmentMax
    ) return;

    const data =
        developmentTypes[type];

    if(
        state.development <
        data.unlock
    ) return;

    if(!canDevelop(type)) {

        clickMessageEl.textContent =
            "❌ 필요한 자원이 부족합니다.";

        setTimeout(()=>{
            clickMessageEl.textContent="";
        },900);

        return;
    }

    const cost =
        getDevelopmentCost(type);

    for(const resource in cost) {

        state.resources[resource] -=
            cost[resource];
    }

    state.levels[type]++;

    state.production[data.resource]++;

    state.development++;

    /* 건물 추가 */
    addBuilding(type);

    /* 도시 시스템 업데이트 */
    updateCivilization();

    checkResourceUnlocks();

    updateUI();

    saveGame();
}


/* =====================================================
   행성 클릭
===================================================== */

planetEl.addEventListener("click",e=>{

    if(e.target.closest(".building"))
        return;

    const income =
        getClickIncome();

    state.money += income;

    for(const resource in state.production) {

        state.resources[resource] +=
            state.production[resource];
    }

    clickMessageEl.textContent =
        `+${income}원`;

    updateUI();

    setTimeout(()=>{
        clickMessageEl.textContent="";
    },500);
});


/* =====================================================
   상점
===================================================== */

function buyResource(resource) {

    const price =
        shopPrices[resource];

    if(state.money < price) {

        clickMessageEl.textContent =
            "❌ 돈이 부족합니다.";

        setTimeout(()=>{
            clickMessageEl.textContent="";
        },800);

        return;
    }

    if(!isResourceUnlocked(resource)) {

        clickMessageEl.textContent =
            "🔒 아직 해금되지 않은 자원입니다.";

        return;
    }

    state.money -= price;
    state.resources[resource]++;

    updateUI();
    saveGame();
}

   건물 위치
===================================================== */

const buildingPositions = [

    [72,42],

    [27,64],
    [45,58],
    [64,68],
    [77,57],

    [59,80]
];


/* =====================================================
   건물 생성
===================================================== */

function addBuilding(type) {

    const building =
        document.createElement("div");

    building.className =
        `building building-${type}`;

    building.innerHTML = `
        <div class="building-sign"></div>
        <div class="building-body">
            <div class="building-roof"></div>
            <div class="building-window"></div>
        </div>
    `;

    const index =
        buildingsEl.children.length %
        buildingPositions.length;

    const pos =
        buildingPositions[index];

    building.style.left =
        pos[0]+"%";

    building.style.top =
        pos[1]+"%";

    buildingsEl.appendChild(building);
}


/* =====================================================
   건물 전체 복구
===================================================== */

function rebuildBuildings() {

    buildingsEl.innerHTML="";

    for(const type in state.levels) {

        for(
            let i=0;
            i<state.levels[type];
            i++
        ) {

            addBuilding(type);
        }
    }
}


/* =====================================================
   도로 생성
===================================================== */

function createRoad(x1,y1,x2,y2) {

    const road =
        document.createElement("div");

    road.className="road";

    const dx=x2-x1;
    const dy=y2-y1;

    const length =
        Math.sqrt(dx*dx+dy*dy);

    const angle =
        Math.atan2(dy,dx)*180/Math.PI;

    road.style.left=x1+"%";
    road.style.top=y1+"%";
    road.style.width=length+"%";
    road.style.transform=
        `rotate(${angle}deg)`;

    roadLayer.appendChild(road);
}


/* =====================================================
   도시화
===================================================== */

function createCityBuilding(x,y,size) {

    const building =
        document.createElement("div");

    building.className =
        "city-building "+size;

    building.style.left=x+"%";
    building.style.top=y+"%";

    cityLayer.appendChild(building);
}


function updateCity() {

    cityLayer.innerHTML="";
    roadLayer.innerHTML="";

    /*
        발전도에 따라 도시 규모 증가
    */

    const cityCount =
        Math.min(
            18,
            Math.floor(
                state.development / 3
            )
        );

    const cityPositions = [

        [32,36],
        [39,39],
        [47,36],
        [54,39],
        [62,35],

        [35,48],
        [43,49],
        [51,47],
        [59,49],
        [67,46],

        [30,58],
        [38,59],
        [47,57],
        [56,60],
        [65,57],

        [42,68],
        [52,68],
        [61,67]
    ];

    for(
        let i=0;
        i<cityCount;
        i++
    ) {

        let size="city-small";

        if(i%5===0)
            size="city-tall";

        else if(i%3===0)
            size="city-medium";

        createCityBuilding(
            cityPositions[i][0],
            cityPositions[i][1],
            size
        );
    }

    /*
        도로망
    */

    if(state.development >= 8) {

        createRoad(30,48,68,48);
        createRoad(47,32,47,69);
    }

    if(state.development >= 14) {

        createRoad(34,37,61,68);
        createRoad(65,37,38,67);
    }

    if(state.development >= 20) {

        createRoad(25,58,74,58);
        createRoad(58,27,58,76);
    }
}


/* =====================================================
   전력선
===================================================== */

function createPowerLine(x1,y1,x2,y2) {

    const line =
        document.createElement("div");

    line.className="power-line";

    const dx=x2-x1;
    const dy=y2-y1;

    const length =
        Math.sqrt(dx*dx+dy*dy);

    const angle =
        Math.atan2(dy,dx)*180/Math.PI;

    line.style.left=x1+"%";
    line.style.top=y1+"%";
    line.style.width=length+"%";
    line.style.transform=
        `rotate(${angle}deg)`;

    powerLayer.appendChild(line);
}


function updatePowerNetwork() {

    powerLayer.innerHTML="";

    if(state.levels.energy <= 0)
        return;

    const powerPlants =
        Math.min(
            4,
            state.levels.energy
        );

    const plantPositions = [
        [55,25],
        [72,42],
        [27,64],
        [64,68]
    ];

    for(
        let i=0;
        i<powerPlants;
        i++
    ) {

        const p =
            plantPositions[i];

        createPowerLine(
            p[0],
            p[1],
            47,
            48
        );

        if(state.development >= 12) {

            createPowerLine(
                p[0],
                p[1],
                65,
                58
            );
        }

        if(state.development >= 20) {

            createPowerLine(
                p[0],
                p[1],
                38,
                59
            );
        }
    }
}

/* =====================================================
   전체 문명 발전
===================================================== */

function updateCivilization() {

    advancedLayer.innerHTML="";

    /*
        1단계
        작은 도시
    */

    updateCity();

    updatePowerNetwork();


    /*
        2단계
        생명 연구가 발전하면 돔
    */

    if(
        state.development >= 16 ||
        state.levels.life >= 3
    ) {

        createDome(34,40);
        createDome(65,62);
    }


    /*
        3단계
        고도 도시
    */

    if(state.development >= 22) {

        createDome(47,65);
        createDome(67,40);
    }


    /*
        4단계
        우주항
    */

    if(
        state.development >= 28 ||
        state.levels.nuclear >= 2
    ) {

        createLandingPad(25,43);
        createShip(25,39);

        createLandingPad(75,65);
        createShip(75,60);
    }


    /*
        5단계
        궤도 시설
    */

    if(
        state.development >= 35 ||
        state.levels.crystal >= 4
    ) {

        createOrbitSystem();
    }


    /*
        6단계
        우주 엘리베이터
    */

    if(
        state.development >= 45 ||
        state.levels.darkMatter >= 2
    ) {

        createSpaceElevator();
    }
}


/* =====================================================
   행성 외형
===================================================== */

function updatePlanetAppearance() {

    for(let i=0;i<10;i++) {

        planetEl.classList.remove(
            `planet-${i}`
        );
    }

    planetEl.classList.add(
        `planet-${state.planetIndex%10}`
    );

    const terrain =
        planetEl.querySelectorAll(".terrain");

    const type =
        state.planetIndex%6;

    const patterns = [

        ["🪨","🪨","🌋","🪨"],
        ["⛏️","💎","🪨","⛏️"],
        ["🌊","🌴","🌊","🌴"],
        ["⚡","🔋","⚡","🔋"],
        ["🌳","🌿","🌲","🌱"],
        ["🏙️","🏢","🛰️","🏙️"]
    ];

    terrain.forEach((el,i)=>{
        el.textContent =
            patterns[type][i];
    });
}


/* =====================================================
   줌
===================================================== */

function updatePlanetScale() {

    planetEl.style.width =
        330*state.planetScale+"px";

    planetEl.style.height =
        330*state.planetScale+"px";
}


document.addEventListener("keydown",e=>{

    const key=e.key.toLowerCase();

    if(key==="q") {

        state.planetScale =
            Math.max(
                .55,
                state.planetScale-.1
            );

        updatePlanetScale();
    }

    if(key==="e") {

        state.planetScale =
            Math.min(
                1.8,
                state.planetScale+.1
            );

        updatePlanetScale();
    }
});

   새 자원 UI
===================================================== */

function updateNewResources() {

    newResourcesEl.innerHTML="";

    newResources.forEach(resource=>{

        if(
            state.development <
            resource.unlock
        ) return;

        const div =
            document.createElement("div");

        div.className="resource";

        div.innerHTML=`
            <span>${resource.name}</span>
            <span class="resource-value">
                ${state.resources[resource.id]}
            </span>
        `;

        newResourcesEl.appendChild(div);
    });
}


function updateNewShop() {

    newShopEl.innerHTML="";

    newResources.forEach(resource=>{

        if(
            state.development <
            resource.unlock
        ) return;

        const div =
            document.createElement("div");

        div.className="shop-item";

        div.innerHTML=`
            <span>
                ${resource.name} — ${resource.price}원
            </span>

            <button
                onclick="buyResource('${resource.id}')"
            >
                구매
            </button>
        `;

        newShopEl.appendChild(div);
    });
}

   UI

    moneyEl.textContent =
        state.money.toLocaleString();

    planetNameEl.textContent =
        state.planetName;

    planetNumberEl.textContent =
        `행성 ${state.planetIndex+1}`;

    incomeEl.textContent =
        `클릭 수익: +${getClickIncome()}원`;

    document.getElementById("mineral").textContent =
        state.resources.mineral;

    document.getElementById("water").textContent =
        state.resources.water;

    document.getElementById("energy").textContent =
        state.resources.energy;

    document.getElementById("life").textContent =
        state.resources.life;

    const percent =
        Math.min(
            100,
            state.development /
            state.developmentMax*100
        );

    progressEl.style.width =
        percent+"%";

    progressTextEl.textContent =
        `발전도 ${state.development} / ${state.developmentMax}`;


    const next =
        newResources.find(
            r =>
                state.development <
                r.unlock
        );

    if(next) {

        bonusTextEl.textContent =
            `다음 자원 해금까지 발전도 ${
                next.unlock-state.development
            }`;

        unlockTextEl.textContent =
            `🔒 다음 자원: ${next.name}`;

    } else {

        bonusTextEl.textContent =
            "🎉 모든 새로운 자원을 해금했습니다!";

        unlockTextEl.textContent =
            "🌌 최종 자원까지 해금 완료";
    }


    updateNewResources();
    updateNewShop();


    developmentListEl.innerHTML="";


    for(const type in developmentTypes) {

        const data =
            developmentTypes[type];

        if(
            state.development <
            data.unlock
        ) {

            const card =
                document.createElement("div");

            card.className=
                "development-card locked-card";

            card.innerHTML=`
                <div class="development-header">
                    <div class="development-name">
                        ${data.name}
                    </div>
                    <div class="level">🔒</div>
                </div>

                <div class="cost">
                    🔒 발전도 ${data.unlock}에서 해금
                </div>

                <div style="
                    font-size:12px;
                    color:#8992b3;
                ">
                    ${data.description}
                </div>
            `;

            developmentListEl.appendChild(card);

            continue;
        }


        const cost =
            getDevelopmentCost(type);

        const card =
            document.createElement("div");

        card.className=
            "development-card";

        card.innerHTML=`
            <div class="development-header">

                <div class="development-name">
                    ${data.name}
                </div>

                <div class="level">
                    Lv.${state.levels[type]}
                </div>

            </div>

            <div class="cost">
                비용: ${formatCost(cost)}
            </div>

            <div style="
                font-size:12px;
                color:#8992b3;
                margin-bottom:8px;
            ">
                ${data.description}
            </div>

            <button
                class="develop-btn"
                onclick="develop('${type}')"
                ${
                    !canDevelop(type) ||
                    state.development >= state.developmentMax
                    ? "disabled"
                    : ""
                }
            >
                개발하기
            </button>
        `;

        developmentListEl.appendChild(card);
    }


    if(
        state.development >=
        state.developmentMax
    ) {

        nextPlanetBtn.style.display="block";

    } else {

        nextPlanetBtn.style.display="none";
    }


    cameraEl.style.transform =
        `translate(
            calc(-50% + ${state.cameraX}px),
            calc(-50% + ${state.cameraY}px)
        )`;

    updatePlanetAppearance();
    updatePlanetScale();

    /*
        중요:
        저장된 상태에서도 도시가 보이도록 갱신
    */

    updateCivilization();
}


/* =====================================================
   다음 행성
===================================================== */

function nextPlanet() {

    if(
        state.development <
        state.developmentMax
    ) return;


    state.planetIndex++;

    state.planetName =
        generatePlanetName();

    state.development=0;

    state.developmentMax =
        getDevelopmentMax();

    state.unlockedResources=0;

    state.production = {
        mineral:0,
        water:0,
        energy:0,
        life:0,
        alloy:0,
        crystal:0,
        nuclear:0,
        gene:0,
        darkMatter:0
    };

    state.levels = {
        mine:0,
        water:0,
        energy:0,
        life:0,
        alloy:0,
        crystal:0,
        nuclear:0,
        gene:0,
        darkMatter:0
    };

    state.cameraX=0;
    state.cameraY=0;
    state.planetScale=1;

    buildingsEl.innerHTML="";
    roadLayer.innerHTML="";
    powerLayer.innerHTML="";
    cityLayer.innerHTML="";
    advancedLayer.innerHTML="";

    updatePlanetAppearance();
    updateUI();
    saveGame();

    clickMessageEl.textContent =
        `🚀 ${state.planetName}에 도착했습니다!`;

    setTimeout(()=>{
        clickMessageEl.textContent="";
    },1500);
}


/* =====================================================
   WASD
===================================================== */

const keys={};

document.addEventListener("keydown",e=>{

    const key=e.key.toLowerCase();

    if(["w","a","s","d"].includes(key)) {

        keys[key]=true;

        e.preventDefault();
    }
});

document.addEventListener("keyup",e=>{

    const key=e.key.toLowerCase();

    if(["w","a","s","d"].includes(key)) {

        keys[key]=false;

        e.preventDefault();
    }
});


function moveCamera() {

    const speed=8;

    if(keys.w)
        state.cameraY+=speed;

    if(keys.s)
        state.cameraY-=speed;

    if(keys.a)
        state.cameraX+=speed;

    if(keys.d)
        state.cameraX-=speed;

    state.cameraX =
        Math.max(
            -150,
            Math.min(150,state.cameraX)
        );

    state.cameraY =
        Math.max(
            -110,
            Math.min(110,state.cameraY)
        );

    cameraEl.style.transform =
        `translate(
            calc(-50% + ${state.cameraX}px),
            calc(-50% + ${state.cameraY}px)
        )`;

    requestAnimationFrame(moveCamera);
}


/* =====================================================
   저장
===================================================== */

function saveGame() {

    localStorage.setItem(
        SAVE_KEY,
        JSON.stringify(state)
    );

    saveStatusEl.textContent =
        "저장 완료 · "+
        new Date().toLocaleTimeString();
}


/* =====================================================
   불러오기
===================================================== */

function loadGame() {

    const saved =
        localStorage.getItem(SAVE_KEY);

    if(!saved) {

        saveStatusEl.textContent =
            "저장된 게임이 없습니다.";

        return;
    }

    try {

        const data =
            JSON.parse(saved);

        Object.assign(state,data);

        const ids=[
            "alloy",
            "crystal",
            "nuclear",
            "gene",
            "darkMatter"
        ];

        ids.forEach(id=>{

            if(typeof state.resources[id]!=="number")
                state.resources[id]=0;

            if(typeof state.production[id]!=="number")
                state.production[id]=0;

            if(typeof state.levels[id]!=="number")
                state.levels[id]=0;
        });

        state.developmentMax =
            getDevelopmentMax();

        if(!state.planetName)
            state.planetName =
                generatePlanetName();

        rebuildBuildings();

        updateUI();

        saveStatusEl.textContent =
            "불러오기 완료";

    } catch {

        saveStatusEl.textContent =
            "저장 데이터를 불러올 수 없습니다.";
    }
}


/* =====================================================
   초기화
===================================================== */

function resetGame() {

    if(
        !confirm(
            "정말 모든 진행 상황을 초기화할까요?"
        )
    ) return;

    localStorage.removeItem(SAVE_KEY);

    state.money=0;
    state.planetIndex=0;
    state.planetName=
        generatePlanetName();

    state.development=0;
    state.developmentMax=20;
    state.unlockedResources=0;

    state.resources={
        mineral:0,
        water:0,
        energy:0,
        life:0,
        alloy:0,
        crystal:0,
        nuclear:0,
        gene:0,
        darkMatter:0
    };

    state.production={
        mineral:0,
        water:0,
        energy:0,
        life:0,
        alloy:0,
        crystal:0,
        nuclear:0,
        gene:0,
        darkMatter:0
    };

    state.levels={
        mine:0,
        water:0,
        energy:0,
        life:0,
        alloy:0,
        crystal:0,
        nuclear:0,
        gene:0,
        darkMatter:0
    };

    state.cameraX=0;
    state.cameraY=0;
    state.planetScale=1;

    buildingsEl.innerHTML="";
    roadLayer.innerHTML="";
    powerLayer.innerHTML="";
    cityLayer.innerHTML="";
    advancedLayer.innerHTML="";

    updateUI();

    saveStatusEl.textContent =
        "게임이 초기화되었습니다.";
}


/* =====================================================
   초기 실행
===================================================== */

function init() {

    const saved =
        localStorage.getItem(SAVE_KEY);

    if(saved) {

        try {

            Object.assign(
                state,
                JSON.parse(saved)
            );

        } catch {}
    }

    if(!state.planetName) {

        state.planetName =
            generatePlanetName();
    }

    state.developmentMax =
        getDevelopmentMax();

    rebuildBuildings();

    updateUI();

    moveCamera();
}

init();

setInterval(
    saveGame,
    5000
);

</script>

</body>
