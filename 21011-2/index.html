
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DreamSpace Arcade</title>
<style>
body{margin:0;background:#080b18;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:20px;background:#121a38;color:#62f5ff}
nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:15px}
button{padding:12px 18px;border:1px solid #4e82aa;border-radius:9px;background:#172747;color:white;cursor:pointer}
button:hover{background:#087e91}
canvas{width:min(94vw,800px);background:#050916;border:1px solid #345b80;border-radius:12px}
#info{padding:15px}
</style>
</head>
<body>
<header><h1>✦ DreamSpace Arcade ✦</h1><p>NEON TARGET · MISSILE DODGE · JUMPMAP</p></header>
<nav>
<button onclick="start('target')">🎯 Neon Target</button>
<button onclick="start('missile')">🚀 미사일 피하기</button>
<button onclick="start('jump')">🪐 점프맵</button>
</nav>
<div id="info">게임을 선택하세요</div>
<canvas id="c" width="800" height="450"></canvas>
<p>이동 WASD / 방향키 · 점프 Space · 대시 Shift · 타깃 마우스 클릭</p>
<p><button onclick="restart()">다시 시작</button> <button onclick="togglePause()">일시정지</button></p>
<p id="multi">로컬 1인 모드</p><button onclick="two=!two;restart();document.getElementById('multi').textContent=two?'로컬 2인 모드: WASD와 방향키':'로컬 1인 모드'">2인 모드 전환</button>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let game='target',run=false,pause=false,two=false,score=0,level=1,tick=0,keys={},shots=[],targets=[],plats=[],players=[];
onkeydown=e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()};
onkeyup=e=>keys[e.code]=false;
function player(x,y,color,left,right,jump,dash){return{x,y,vx:0,vy:0,color,left,right,jump,dash,cd:0,dt:0,ground:false}}
function start(g){game=g;restart()}
function restart(){score=0;level=1;tick=0;shots=[];targets=[];plats=[];players=[player(100,300,'#65f7ff','KeyA','KeyD','Space','ShiftLeft')];if(two)players.push(player(180,300,'#ff6fd8','ArrowLeft','ArrowRight','ArrowUp','ShiftRight'));if(game==='target')makeTargets();if(game==='jump')for(let i=0;i<14;i++)plats.push({x:(i*137)%740,y:420-i*28,w:100});run=true;pause=false;document.getElementById('info').textContent=({target:'Neon Target: 빛나는 원을 클릭하세요',missile:'미사일 피하기: 미사일을 피하고 대시하세요',jump:'점프맵: 발판을 밟고 대시로 이동하세요'})[game]}
function makeTargets(){targets=[];for(let i=0;i<5+level;i++)targets.push({x:40+Math.random()*720,y:40+Math.random()*350,r:15,dx:Math.random()*3-1.5,dy:Math.random()*3-1.5})}
c.onclick=e=>{if(game!=='target')return;let r=c.getBoundingClientRect(),mx=(e.clientX-r.left)*800/r.width,my=(e.clientY-r.top)*450/r.height;let i=targets.findIndex(t=>Math.hypot(t.x-mx,t.y-my)<t.r+8);if(i>=0){targets.splice(i,1);score+=10;if(!targets.length){level++;makeTargets()}}}
function togglePause(){pause=!pause}
function update(){tick++;for(let p of players){let dx=(keys[p.right]?1:0)-(keys[p.left]?1:0);p.vx+=dx*.6;p.vx*=.88;if(keys[p.dash]&&p.cd<=0){p.vx=(dx||1)*12;p.vy=game==='jump'?-7:0;p.dt=10;p.cd=90}if(p.dt>0)p.dt--;else p.cd=Math.max(0,p.cd-1);
if(game==='jump'){if(keys[p.jump]&&p.ground){p.vy=-11;p.ground=false}p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.ground=false;for(let a of plats)if(p.vy>=0&&p.x+10>a.x&&p.x-10<a.x+a.w&&p.y+12>=a.y&&p.y+12-p.vy<=a.y){p.y=a.y-12;p.vy=0;p.ground=true}if(p.y>460){p.x=70;p.y=250;p.vy=0;score=Math.max(0,score-5)}if(p.y<30){level++;score+=20;p.y=100;plats.forEach(a=>a.y+=80)}}else{p.x+=p.vx;p.y+=p.vy;p.vy=keys[p.jump]?-3:0;p.x=Math.max(10,Math.min(790,p.x));p.y=Math.max(10,Math.min(440,p.y))}}
if(game==='target'){for(let t of targets){t.x+=t.dx;t.y+=t.dy;if(t.x<15||t.x>785)t.dx*=-1;if(t.y<15||t.y>435)t.dy*=-1}}
if(game==='missile'){if(tick%Math.max(12,42-level*3)===0)shots.push({x:Math.random()*800,y:-10,vx:(Math.random()-.5)*2,vy:3+level*.4});for(let b of shots){b.x+=b.vx;b.y+=b.vy;for(let p of players)if(Math.hypot(p.x-b.x,p.y-b.y)<18&&p.dt===0){score=Math.max(0,score-2);p.x=70;p.y=300}}shots=shots.filter(b=>b.y<460);if(tick%500===0)level++}
}
function draw(){x.clearRect(0,0,800,450);x.strokeStyle='#172743';for(let i=0;i<800;i+=40){x.beginPath();x.moveTo(i,0);x.lineTo(i,450);x.stroke()}if(game==='target')for(let t of targets){x.fillStyle='#5af6ff';x.shadowBlur=20;x.shadowColor=x.fillStyle;x.beginPath();x.arc(t.x,t.y,t.r,0,7);x.fill()}x.shadowBlur=0;if(game==='missile')for(let b of shots){x.fillStyle='#ff477e';x.beginPath();x.arc(b.x,b.y,9,0,7);x.fill()}if(game==='jump')for(let a of plats){x.fillStyle='#4defff';x.fillRect(a.x,a.y,a.w,12)}for(let p of players){x.fillStyle=p.color;x.shadowBlur=p.dt?24:10;x.shadowColor=p.color;x.fillRect(p.x-10,p.y-12,20,24)}x.shadowBlur=0;x.fillStyle='white';x.font='18px Arial';x.fillText('LEVEL '+level+'   SCORE '+score,20,28);x.fillText('DASH '+(players[0]?.cd<=0?'READY':'COOLDOWN'),600,28);if(!run){x.textAlign='center';x.fillText('게임을 선택하세요',400,220);x.textAlign='left'}}
function loop(){if(run&&!pause)update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
