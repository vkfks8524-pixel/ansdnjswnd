const roleIcons={"돌격":"🛡️","공격":"⚔️","지원":"💚"};
const selected=[];
const heroSections=document.getElementById('heroSections');
const limitMessage=document.getElementById('limitMessage');
function renderSections(){heroSections.innerHTML='';const grouped={};heroes.forEach(h=>(grouped[h.role]??=[]).push(h));Object.entries(grouped).forEach(([role,list])=>{const section=document.createElement('section');section.className='role-section';const title=document.createElement('div');title.className='role-title';title.innerHTML='<span>'+roleIcons[role]+'</span><h2>'+role+'</h2><span class="count">'+list.length+'명</span>';const grid=document.createElement('div');grid.className='hero-grid';list.forEach(hero=>{const button=document.createElement('button');button.className='hero';button.type='button';button.dataset.name=hero.name;button.innerHTML='<div class="portrait-wrap"><img class="portrait" src="'+hero.image+'" alt="'+hero.name+' 프로필 사진"><div class="selection-badge">✓</div></div><div class="hero-name">'+hero.name+'</div>';button.addEventListener('click',()=>toggleHero(button,hero));grid.appendChild(button)});section.append(title,grid);heroSections.appendChild(section)})}
function toggleHero(button,hero){const index=selected.findIndex(x=>x.name===hero.name);if(index!==-1){selected.splice(index,1);button.classList.remove('selected')}else{if(selected.length>=2){limitMessage.textContent='이미 2명의 영웅을 선택했습니다. 먼저 선택을 해제하세요.';clearTimeout(window.limitTimer);window.limitTimer=setTimeout(()=>limitMessage.textContent='',1800);return}selected.push(hero);button.classList.add('selected')}updateSlots()}
function updateSlots(){for(let i=1;i<=2;i++){const slot=document.getElementById('slot'+i),img=document.getElementById('slotImg'+i),name=document.getElementById('slotName'+i),hero=selected[i-1];if(hero){slot.classList.add('has-hero');img.src=hero.image;img.alt=hero.name+' 프로필 사진';name.textContent=hero.name}else{slot.classList.remove('has-hero');img.removeAttribute('src');img.alt='';name.textContent='선택되지 않음'}}}
document.getElementById('resetBtn').addEventListener('click',()=>{selected.length=0;document.querySelectorAll('.hero.selected').forEach(x=>x.classList.remove('selected'));limitMessage.textContent='';updateSlots()});
renderSections();updateSlots();
</script>
