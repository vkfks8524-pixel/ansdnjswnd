<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RUSH.io</title>
<link href="https://fonts.googleapis.com/css2?family=Cal+Sans&family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #bfe3ff;
    font-family: 'Cal Sans', 'Jua', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    color: #6b4b8a;
  }
  #renderCanvas { width: 100%; height: 100%; display: block; outline: none; }

  .pill {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    box-shadow: 0 6px 0 rgba(160, 120, 200, 0.25), 0 10px 24px rgba(120, 90, 170, 0.15);
    padding: 8px 18px;
  }

  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud.show { display: block; }

  #rankBox { position: fixed; top: 16px; left: 16px; text-align: center; }
  #rankBox .label { font-size: 14px; opacity: 0.7; }
  #rankBox .value { font-size: 34px; line-height: 1.1; }
  #rankBox .value small { font-size: 18px; opacity: 0.6; }

  #timeBox { position: fixed; top: 16px; right: 16px; font-size: 24px; }

  #progressWrap {
    position: fixed; top: 22px; left: 50%; transform: translateX(-50%);
    width: min(44vw, 420px); height: 18px;
    background: rgba(255, 255, 255, 0.7); border-radius: 999px;
    box-shadow: inset 0 2px 4px rgba(120, 90, 170, 0.2);
  }
  #progressWrap .flag { position: absolute; right: -14px; top: -8px; font-size: 24px; }
  .dot {
    position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%;
    transform: translate(-50%, -50%); border: 2px solid #fff;
  }
  .dot.me { width: 22px; height: 22px; border: 3px solid #fff; z-index: 2; box-shadow: 0 0 0 3px #ffd84d; }

  #countdown {
    position: fixed; top: 38%; left: 50%; transform: translate(-50%, -50%);
    font-size: 120px; color: #fff;
    text-shadow: 0 6px 0 #ff8fc4, 0 12px 30px rgba(200, 80, 160, 0.4);
    pointer-events: none; display: none;
  }
  #countdown.pop { animation: pop 0.5s ease-out; }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(1.8); opacity: 0; }
    60% { transform: translate(-50%, -50%) scale(0.9); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  #help { position: fixed; bottom: 16px; left: 16px; font-size: 15px; }
  body.touch #help { display: none; }

  #touchControls { display: none; }
  body.touch #touchControls { display: block; }
  .tbtn {
    position: fixed; pointer-events: auto;
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.8); border: none;
    font-size: 26px; color: #8a63b8; font-family: inherit;
    box-shadow: 0 5px 0 rgba(160, 120, 200, 0.35);
    touch-action: none;
  }
  .tbtn.on { transform: translateY(3px); box-shadow: 0 2px 0 rgba(160, 120, 200, 0.35); background: #ffe3f1; }
  .tbtn[data-key="left"]  { left: 22px;  bottom: 40px; width: 84px; height: 84px; }
  .tbtn[data-key="right"] { left: 122px; bottom: 40px; width: 84px; height: 84px; }
  .tbtn[data-key="jump"]  { right: 30px; bottom: 40px; width: 110px; height: 110px; font-size: 26px; background: #ffd1e8; color: #c2477f; }

  #errBox {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #fff0f3; color: #c2477f; border-radius: 14px;
    padding: 10px 16px; font-size: 14px; max-width: 90vw;
    box-shadow: 0 6px 20px rgba(194, 71, 127, 0.25);
    display: none; z-index: 50; text-align: center;
  }

  .overlay {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(200, 180, 255, 0.35);
    backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }
  .card {
    background: #fff; border-radius: 32px; padding: 32px 40px;
    text-align: center; max-width: 90vw;
    box-shadow: 0 10px 0 rgba(160, 120, 200, 0.3), 0 20px 50px rgba(120, 90, 170, 0.25);
    animation: bounceIn 0.6s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes bounceIn { from { transform: scale(0.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h1 { font-size: 46px; color: #ff7eb6; text-shadow: 0 4px 0 #ffe0ef; margin-bottom: 8px; }
  .card p { font-size: 18px; margin: 6px 0; line-height: 1.5; }
  .card .big { font-size: 64px; color: #ff7eb6; margin: 6px 0; }
  .btn {
    margin-top: 20px; border: none; cursor: pointer;
    font-family: inherit; font-size: 24px; color: #fff;
    background: linear-gradient(180deg, #ff9ecb, #ff7eb6);
    padding: 14px 44px; border-radius: 999px;
    box-shadow: 0 6px 0 #d95c98;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #d95c98; }
  .btn.sub {
    background: linear-gradient(180deg, #c9b3ff, #a98bf0);
    box-shadow: 0 6px 0 #7f63c9; font-size: 20px; padding: 12px 30px; margin-left: 8px;
  }
  .btn.sub:active { box-shadow: 0 2px 0 #7f63c9; }
  .card { max-height: 94vh; overflow-y: auto; }
  .card h1.logo {
    font-family: 'Cal Sans', 'Jua', sans-serif;
    font-size: 72px; letter-spacing: 1px; margin-bottom: 4px;
    background: linear-gradient(90deg, #ff7eb6, #a98bf0, #7fd3ff);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; text-shadow: none;
  }

  /* 동물 고르기 */
  .pick-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
  .pick {
    border: 3px solid transparent; background: #f6efff; border-radius: 18px;
    padding: 6px 10px; min-width: 70px; cursor: pointer;
    font-family: inherit; font-size: 15px; color: #6b4b8a;
    transition: transform 0.15s, background 0.15s;
  }
  .pick .emo { font-size: 32px; display: block; line-height: 1.2; }
  .pick:hover { transform: translateY(-2px); }
  .pick.sel { border-color: #ff7eb6; background: #ffe3f1; transform: scale(1.1); }
</style>
</head>
<body>

<canvas id="renderCanvas"></canvas>

<div id="hud">
  <div id="rankBox" class="pill">
    <div class="label">현재 순위</div>
    <div class="value"><span id="rankNum">1</span><small> / 7</small></div>
  </div>
  <div id="progressWrap"><div class="flag">🏁</div></div>
  <div id="timeBox" class="pill">⏱ <span id="timeNum">0.0</span>초</div>
  <div id="help" class="pill">← → / A D 좌우 이동 · 스페이스 점프 · 몸으로 부딪혀 밀기!</div>
  <div id="touchControls">
    <button class="tbtn" data-key="left">◀</button>
    <button class="tbtn" data-key="right">▶</button>
    <button class="tbtn" data-key="jump">점프</button>
  </div>
</div>

<div id="countdown">3</div>
<div id="errBox"></div>

<div id="startScreen" class="overlay show">
  <div class="card">
    <h1 class="logo">RUSH.io</h1>
    <div id="pickRow" class="pick-row"></div>
    <p id="loadMsg" style="opacity:0.7; font-size:15px">🍡 게임을 불러오는 중이에요...</p>
    <button class="btn" id="startBtn" disabled style="opacity:0.5">시작하기</button>
  </div>
</div>

<div id="resultScreen" class="overlay">
  <div class="card">
    <h1 id="resultTitle">골인!</h1>
    <div class="big" id="resultPlace">1등</div>
    <p id="resultTime">기록 0.0초</p>
    <p id="resultMsg"></p>
    <button class="btn" id="retryBtn">다시 달리기</button>
    <button class="btn sub" id="changeBtn">동물 바꾸기</button>
  </div>
</div>

<script>
function startGame() {
  // =====================================================
  //  기본 설정값
  // =====================================================
  const TRACK_HALF = 7;        // 트랙 절반 너비
  const TRACK_START = -10;     // 트랙 시작 위치
  const TRACK_END = 480;       // 트랙 끝 위치
  const FINISH_Z = 470;        // 결승선 위치
  const CHECKPOINTS = [0, 50, 102, 150, 193, 232, 255, 326, 352, 388, 436];
  const GAPS = [[80, 100], [330, 350]];          // 떨어지는 발판 구간들 [시작, 끝]
  const BALL_ZONES = [                           // 공이 굴러오는 구간들
    { start: 190, end: 152, timer: 0 },
    { start: 432, end: 392, timer: 0 }
  ];
  const LOG_START = 322;       // 통나무가 나오는 곳
  const LOG_END = 258;         // 통나무가 사라지는 곳
  const SPEED = 9;             // 달리기 속도
  const JUMP = 9;              // 점프 힘
  const GRAVITY = 25;          // 중력
  const CHAR_R = 0.6;          // 캐릭터 몸 반지름(부딪힘 계산용)
  const RIG_S = 0.85;          // 캐릭터 크기
  const BODY_R = 0.7;          // 공 몸의 반지름
  const BODY_Y = 0.88;         // 공 몸의 중심 높이 (발 위)

  // 동물 친구들 (시작 화면에서 내 동물을 골라요)
  const ANIMALS = [
    { type: 'bunny',  name: '토끼',   emoji: '🐰', color: '#FBEFF5' },
    { type: 'bear',   name: '곰',     emoji: '🐻', color: '#C8A07A' },
    { type: 'chick',  name: '병아리', emoji: '🐥', color: '#FFE36B' },
    { type: 'turtle', name: '거북이', emoji: '🐢', color: '#D6E59B', shell: '#5FA36A' },
    { type: 'cat',    name: '고양이', emoji: '🐱', color: '#FFC27A' },
    { type: 'bird',   name: '새',     emoji: '🐦', color: '#8EC9FF' },
    { type: 'frog',   name: '개구리', emoji: '🐸', color: '#93DB8E' }
  ];

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const inGap = (z) => GAPS.some(([a, b]) => z >= a && z < b);   // 발판 구간인가요?
  const lerp = (a, b, t) => a + (b - a) * t;
  function lerpAngle(a, b, t) {
    let d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return a + d * t;
  }

  // =====================================================
  //  화면(엔진, 장면) 준비
  // =====================================================
  const canvas = document.getElementById('renderCanvas');
  const engine = new BABYLON.Engine(canvas, true, { stencil: true, preserveDrawingBuffer: false });
  const scene = new BABYLON.Scene(engine);
  scene.clearColor = new BABYLON.Color4(0.55, 0.75, 0.98, 1);
  scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
  scene.fogDensity = 0.004;
  scene.fogColor = new BABYLON.Color3(0.62, 0.74, 0.96);

  // 카메라
  const camera = new BABYLON.FreeCamera('cam', new BABYLON.Vector3(0, 6, -10), scene);
  camera.minZ = 0.1;
  camera.maxZ = 500;
  const camTarget = new BABYLON.Vector3(0, 2, 4);
  camera.setTarget(camTarget);

  function updateFov() {
    if (window.innerWidth < window.innerHeight) {
      camera.fovMode = BABYLON.Camera.FOVMODE_HORIZONTAL_FIXED;
      camera.fov = 1.25;
    } else {
      camera.fovMode = BABYLON.Camera.FOVMODE_VERTICAL_FIXED;
      camera.fov = 0.85;
    }
  }
  updateFov();

  // 빛
  const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
  hemi.intensity = 0.55;
  hemi.diffuse = new BABYLON.Color3(1, 0.97, 1);
  hemi.groundColor = new BABYLON.Color3(0.55, 0.48, 0.75);

  const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.35, -1, 0.5).normalize(), scene);
  sun.intensity = 0.75;
  sun.position = new BABYLON.Vector3(20, 40, -20);
  sun.autoUpdateExtends = false;
  sun.shadowFrustumSize = 50;
  sun.shadowMinZ = 1;
  sun.shadowMaxZ = 100;

  // 그림자
  const shadowGen = new BABYLON.ShadowGenerator(2048, sun);
  shadowGen.usePercentageCloserFiltering = true;
  shadowGen.filteringQuality = BABYLON.ShadowGenerator.QUALITY_MEDIUM;
  shadowGen.setDarkness(0.25);
  shadowGen.bias = 0.0008;

  // 글로우(반짝이는 효과) - 지정한 물체만 빛나게
  const glow = new BABYLON.GlowLayer('glow', scene, { mainTextureSamples: 2 });
  glow.intensity = 0.4;

  // =====================================================
  //  포스트 프로세싱 (화면 전체에 입히는 효과)
  // =====================================================
  const pipeline = new BABYLON.DefaultRenderingPipeline('pp', true, scene, [camera]);
  pipeline.samples = 4;                 // 계단 현상 줄이기
  pipeline.fxaaEnabled = true;

  pipeline.bloomEnabled = true;          // 밝은 곳 빛 번짐
  pipeline.bloomThreshold = 0.95;
  pipeline.bloomWeight = 0.15;
  pipeline.bloomKernel = 64;
  pipeline.bloomScale = 0.5;

  pipeline.imageProcessingEnabled = true; // 색감 보정
  pipeline.imageProcessing.contrast = 1.3;
  pipeline.imageProcessing.exposure = 0.85;
  pipeline.imageProcessing.colorCurvesEnabled = true;
  const curves = new BABYLON.ColorCurves();
  curves.globalSaturation = 35;
  pipeline.imageProcessing.colorCurves = curves;

  pipeline.imageProcessing.vignetteEnabled = true; // 가장자리 은은하게
  pipeline.imageProcessing.vignetteWeight = 1.6;
  pipeline.imageProcessing.vignetteStretch = 0.4;
  pipeline.imageProcessing.vignetteColor = new BABYLON.Color4(0.55, 0.35, 0.7, 0);
  pipeline.imageProcessing.vignetteBlendMode = BABYLON.ImageProcessingConfiguration.VIGNETTEMODE_MULTIPLY;

  pipeline.chromaticAberrationEnabled = true; // 살짝 무지갯빛 번짐
  pipeline.chromaticAberration.aberrationAmount = 6;
  pipeline.chromaticAberration.radialIntensity = 0.8;

  pipeline.sharpenEnabled = true;
  pipeline.sharpen.edgeAmount = 0.15;

  // =====================================================
  //  재질(색) 만들기
  // =====================================================
  const C3 = (h) => BABYLON.Color3.FromHexString(h);
  function makeMat(name, hex, spec = 0.15, power = 32, emissive = 0) {
    const m = new BABYLON.StandardMaterial(name, scene);
    m.diffuseColor = C3(hex);
    m.specularColor = new BABYLON.Color3(spec, spec, spec);
    m.specularPower = power;
    if (emissive) m.emissiveColor = C3(hex).scale(emissive);
    return m;
  }

  // =====================================================
  //  트랙 만들기 (발판 구간은 비워둠)
  // =====================================================
  const trackMatA = makeMat('trackA', '#F5B3D2', 0.1, 16, 0);
  const trackMatB = makeMat('trackB', '#C9B8F2', 0.1, 16, 0);
  const edgeMat = makeMat('edge', '#FFF4FA', 0.3, 32, 0.05);

  for (let z = TRACK_START; z < TRACK_END; z += 10) {
    if (inGap(z + 5)) continue;
    const seg = BABYLON.MeshBuilder.CreateBox('seg', { width: TRACK_HALF * 2, height: 1.5, depth: 10 }, scene);
    seg.position.set(0, -0.75, z + 5);
    seg.material = ((z / 10) % 2 === 0) ? trackMatA : trackMatB;
    seg.receiveShadows = true;
    for (const sx of [-TRACK_HALF, TRACK_HALF]) {
      const edge = BABYLON.MeshBuilder.CreateCylinder('edge', { height: 10, diameter: 0.6, tessellation: 16 }, scene);
      edge.rotation.x = Math.PI / 2;
      edge.position.set(sx, -0.05, z + 5);
      edge.material = edgeMat;
      edge.receiveShadows = true;
    }
  }

  // 결승선 바닥 체크무늬
  const finWhite = makeMat('finW', '#FFFFFF', 0.2, 32, 0.1);
  const finPink = makeMat('finP', '#FF7EB6', 0.2, 32, 0.2);
  for (let i = 0; i < 14; i++) {
    for (let r = 0; r < 2; r++) {
      const tile = BABYLON.MeshBuilder.CreateBox('finTile', { width: 1, height: 0.04, depth: 0.8 }, scene);
      tile.position.set(-6.5 + i, 0.02, FINISH_Z - 0.4 + r * 0.8);
      tile.material = ((i + r) % 2 === 0) ? finWhite : finPink;
      tile.receiveShadows = true;
    }
  }

  // 결승선 아치
  const archMat = makeMat('arch', '#FFD84D', 0.5, 48, 0.2);
  for (const sx of [-7.6, 7.6]) {
    const p = BABYLON.MeshBuilder.CreateCylinder('pillar', { height: 6.5, diameter: 0.9 }, scene);
    p.position.set(sx, 3.25, FINISH_Z);
    p.material = archMat;
    shadowGen.addShadowCaster(p);
    glow.addIncludedOnlyMesh(p);
  }
  const archTop = BABYLON.MeshBuilder.CreateBox('archTop', { width: 16.5, height: 1.6, depth: 0.8 }, scene);
  archTop.position.set(0, 6.6, FINISH_Z);
  archTop.material = archMat;
  glow.addIncludedOnlyMesh(archTop);

  const signTex = new BABYLON.DynamicTexture('signTex', { width: 1024, height: 128 }, scene, true);
  signTex.drawText('★ FINISH ★', null, 100, 'bold 96px sans-serif', '#FFFFFF', '#FF7EB6', true);
  const signMat = new BABYLON.StandardMaterial('signMat', scene);
  signMat.diffuseTexture = signTex;
  signMat.emissiveTexture = signTex;
  signMat.disableLighting = true;
  const sign = BABYLON.MeshBuilder.CreatePlane('sign', { width: 15, height: 1.3 }, scene);
  sign.position.set(0, 6.6, FINISH_Z - 0.45);
  sign.material = signMat;

  // 🌈 결승선 뒤 무지개
  const rainbowColors = ['#FF8FA3', '#FFB86B', '#FFE680', '#9BE59B', '#7FD3FF', '#9FA8FF', '#D3A1FF'];
  rainbowColors.forEach((hex, i) => {
    const r = 11 - i * 0.7;
    const path = [];
    for (let k = 0; k <= 48; k++) {
      const t = Math.PI * k / 48;
      path.push(new BABYLON.Vector3(Math.cos(t) * r, Math.sin(t) * r - 1, FINISH_Z + 8));
    }
    const arc = BABYLON.MeshBuilder.CreateTube('rainbow', { path, radius: 0.36, tessellation: 12, cap: BABYLON.Mesh.CAP_ALL }, scene);
    arc.material = makeMat('rainbow' + i, hex, 0.3, 32, 0.55);
  });
  // 무지개 양쪽 끝 구름
  const rbCloudMat = makeMat('rbCloud', '#FFFFFF', 0, 1, 0.4);
  for (const sx of [-1, 1]) {
    for (let j = 0; j < 4; j++) {
      const c = BABYLON.MeshBuilder.CreateSphere('rbCloud', { diameter: 2.4 + Math.random() * 1.4, segments: 14 }, scene);
      c.position.set(sx * (8.8 + j * 0.8 - 1.2), -0.6 + Math.random() * 0.6, FINISH_Z + 8 + (Math.random() - 0.5) * 1.5);
      c.scaling.y = 0.75;
      c.material = rbCloudMat;
    }
  }

  // 🎊 색종이
  const confettiMats = ['#FF8FA3', '#FFD86B', '#7FD3FF', '#9BE59B', '#D3A1FF', '#FFB86B'].map((h, i) => {
    const m = new BABYLON.StandardMaterial('conf' + i, scene);
    m.diffuseColor = C3(h);
    m.emissiveColor = C3(h).scale(0.6);
    m.backFaceCulling = false;
    return m;
  });
  const confetti = [];
  for (let i = 0; i < 200; i++) {
    const m = BABYLON.MeshBuilder.CreatePlane('conf', { width: 0.28, height: 0.16 }, scene);
    m.material = confettiMats[i % confettiMats.length];
    m.isVisible = false;
    confetti.push({ mesh: m, life: 0, vel: new BABYLON.Vector3(0, 0, 0), spin: new BABYLON.Vector3(0, 0, 0) });
  }
  let confIdx = 0;
  function spawnConfetti(n) {
    for (let i = 0; i < n; i++) {
      const p = confetti[confIdx];
      confIdx = (confIdx + 1) % confetti.length;
      p.life = 3 + Math.random() * 1.5;
      p.mesh.isVisible = true;
      p.mesh.position.set((Math.random() * 2 - 1) * 7, 6.6 + Math.random(), FINISH_Z);
      p.vel.set((Math.random() * 2 - 1) * 4, 3 + Math.random() * 5, (Math.random() * 2 - 1) * 4 - 2);
      p.spin.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
    }
  }
  function updateConfetti(dt) {
    for (const p of confetti) {
      if (p.life <= 0) continue;
      p.life -= dt;
      p.vel.y -= 5 * dt;
      p.vel.scaleInPlace(1 - 0.8 * dt);
      p.mesh.position.addInPlace(p.vel.scale(dt));
      p.mesh.rotation.addInPlace(p.spin.scale(dt));
      if (p.life <= 0 || p.mesh.position.y < -5) { p.life = 0; p.mesh.isVisible = false; }
    }
  }
  function clearConfetti() {
    for (const p of confetti) { p.life = 0; p.mesh.isVisible = false; }
  }

  // =====================================================
  //  하늘 장식 (구름, 도넛, 아래 바다)
  // =====================================================
  const cloudMat = makeMat('cloud', '#FFFFFF', 0, 1, 0.25);
  cloudMat.alpha = 0.95;
  for (let i = 0; i < 64; i++) {
    const side = Math.random() < 0.5 ? -1 : 1;
    const cx = side * (16 + Math.random() * 40);

  const donutColors = ['#FFB3D9', '#B3E5FF', '#C8F7C5', '#FFE7A3', '#D9C2FF'];

  // =====================================================

  const spinnerPostMat = makeMat('spPost', '#FF8FC4', 0.5, 48, 0.1);

  function addSpinner(z, speed) {

    const bar = BABYLON.MeshBuilder.CreateCylinder('bar', { height: len, diameter: 0.8, tessellation: 24 }, scene);
    bar.parent = pivot; bar.rotation.z = Math.PI / 2; bar.position.y = 0.6; bar.material = spinnerBarMat;

  addSpinner(40, 1.6);

  // 막대와의 거리 계산
  function barInfo(s, x, z) {
    const px = x, pz = z - s.z;
    let t = px * s.dir.x + pz * s.dir.z;
    t = clamp(t, -s.half, s.half);
    const cx = s.dir.x * t, cz = s.dir.z * t;
    const nx = px - cx, nz = pz - cz;
    return { d: Math.hypot(nx, nz), cx, cz, nx, nz };
  }

  // =====================================================
  //  장애물 2: 좌우로 움직이는 벽
  // =====================================================
  const wallMats = [makeMat('w1', '#C9A8FF', 0.4, 32, 0.1), makeMat('w2', '#9EE6C9', 0.4, 32, 0.1), makeMat('w3', '#FFC59E', 0.4, 32, 0.1)];
  const walls = [];
  function addWall(z, amp, speed, phase, matIndex) {

    mesh.receiveShadows = true;

  }
  addWall(63, 4.5, 1.5, 0, 0);
  addWall(67, 4.5, 1.5, Math.PI, 1);
  addWall(135, 4.8, 1.8, 0.5, 2);

  // =====================================================

  const bumperMat = makeMat('bumper', '#FFB3D9', 0.7, 64, 0.15);

  [[-3.5, 22], [3, 25], [0, 29], [-4, 196], [2, 199], [-1, 203], [4.5, 206], [-3, 455], [3, 458], [0, 462]].forEach(([x, z]) => addBumper(x, z));

  // =====================================================
  //  장애물 4: 밟으면 떨어지는 발판
  // =====================================================
  const tileMats = [makeMat('tileA', '#A8EBD6', 0.3, 32, 0.05), makeMat('tileB', '#FFE59A', 0.3, 32, 0.05)];
  const tileWarnMat = makeMat('tileWarn', '#FF7F9A', 0.3, 32, 0.3);
  const tiles = [];
  const TILE_COLS = 4, TILE_ROWS = 6;
  const tileW = (TRACK_HALF * 2) / TILE_COLS;
  for (const [gapStart, gapEnd] of GAPS) {
  const tileD = (gapEnd - gapStart) / TILE_ROWS;
  for (let r = 0; r < TILE_ROWS; r++) {
    for (let col = 0; col < TILE_COLS; col++) {
      const x = -TRACK_HALF + tileW * (col + 0.5);
      const z = gapStart + tileD * (r + 0.5);
      const mesh = BABYLON.MeshBuilder.CreateBox('tile', { width: tileW - 0.15, height: 0.6, depth: tileD - 0.15 }, scene);
      mesh.position.set(x, -0.3, z);
      const baseMat = tileMats[(r + col) % 2];
      mesh.material = baseMat;
      mesh.receiveShadows = true;
      shadowGen.addShadowCaster(mesh);
      tiles.push({ mesh, x, z, hw: (tileW - 0.15) / 2, hd: (tileD - 0.15) / 2, state: 'idle', timer: 0, y: 0, vy: 0, baseMat });
    }
  }
  }

  function findTile(x, z) {
    for (const t of tiles) {
      if (t.state === 'falling') continue;
      if (Math.abs(x - t.x) <= t.hw + 0.1 && Math.abs(z - t.z) <= t.hd + 0.1) return t;
    }
    return null;
  }

  // 그 자리에 밟을 수 있는 바닥이 있나요?
  function isSolid(x, z) {
    if (Math.abs(x) > TRACK_HALF || z < TRACK_START || z > TRACK_END) return false;
    if (inGap(z)) return !!findTile(x, z);
    return true;
  }

  function resetTiles() {
    for (const t of tiles) {
      t.state = 'idle'; t.timer = 0; t.y = 0; t.vy = 0;
      t.mesh.position.set(t.x, -0.3, t.z);
      t.mesh.material = t.baseMat;
      t.mesh.isVisible = true;
    }
  }

  // =====================================================

  const ballColors = ['#7FC8FF', '#FF9EC7', '#FFD86B', '#A8E6A1', '#C9A8FF'];

  function resetBalls() {

  // =====================================================

  const logMat = makeMat('logM', '#E0B486', 0.2, 16, 0.08);

  const LOG_R = 0.5;
  const logs = [];

  let logTimer = 0;

  function spawnLog() {

  // =====================================================
  //  캐릭터 (동그란 공 모양 동물 친구들)
  //  - 몸 전체가 동그란 공 + 작은 손발 + 동물마다 다른 귀·코·꼬리
  // =====================================================
  const markerMat = makeMat('marker', '#FFD84D', 0.5, 32, 0.8);
  const eyeMat = makeMat('eye', '#3A2B4A', 0.8, 64);
  const shineMat = makeMat('shine', '#FFFFFF', 0, 1, 1);
  const cheekMat = makeMat('cheek', '#FF7FA8', 0, 1, 0.3);
  cheekMat.alpha = 0.7;
  const whiteMat = makeMat('white', '#FFFFFF', 0.3, 32, 0.15);
  const darkNoseMat = makeMat('darkNose', '#4A3442', 0.6, 48);
  const pinkNoseMat = makeMat('pinkNose', '#FF8FAF', 0.4, 32, 0.1);
  const orangeMat = makeMat('orange', '#FF9F43', 0.4, 32, 0.1);

  // 색을 흰색 쪽으로 섞어서 밝은 색 재질 만들기
  function tintMat(name, hex, t) {
    const m = new BABYLON.StandardMaterial(name, scene);
    m.diffuseColor = BABYLON.Color3.Lerp(C3(hex), new BABYLON.Color3(1, 1, 1), t);
    m.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
    m.specularPower = 16;
    m.emissiveColor = m.diffuseColor.scale(0.1);
    return m;
  }
  function shadeMat(name, hex, t) {
    const m = new BABYLON.StandardMaterial(name, scene);
    m.diffuseColor = C3(hex).scale(t);
    m.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
    m.specularPower = 16;
    return m;
  }

  function createRunner(spec) {
    const hex = spec.color;
    const type = spec.type;
    const root = new BABYLON.TransformNode('runner', scene);
    const rig = new BABYLON.TransformNode('rig', scene);
    rig.parent = root;
    rig.scaling.set(RIG_S, RIG_S, RIG_S);

    const mat = makeMat('bodyM', hex, 0.25, 16, 0.1);         // 몸 색
    const lightMat = tintMat('lightM', hex, 0.6);             // 배·주둥이 같은 밝은 부분
    const pawMat = (type === 'chick' || type === 'bird') ? orangeMat : shadeMat('pawM', hex, 0.82);   // 손발

    function node(name, parent, y, x = 0, z = 0) {
      const n = new BABYLON.TransformNode(name, scene);
      n.parent = parent;
      n.position.set(x, y, z);
      return n;
    }
    // 얼굴·귀 같은 부품 붙이기
    function feat(mesh, parent, x, y, z, m) {
      mesh.parent = parent;
      mesh.position.set(x, y, z);
      mesh.material = m;
      return mesh;
    }
    const ball = (d, seg = 24) => BABYLON.MeshBuilder.CreateSphere('ball', { diameter: d, segments: seg }, scene);
    const cone = (h, d) => BABYLON.MeshBuilder.CreateCylinder('cone', { height: h, diameterTop: 0, diameterBottom: d, tessellation: 16 }, scene);
    const R = BODY_R;
    // 공 표면의 앞쪽 위치(z) 계산
    const surf = (x, y, out = 0) => Math.sqrt(Math.max(0, R * R - x * x - y * y)) + out;

    // 동그란 공 몸 (머리와 몸이 하나!)
    const body = feat(ball(R * 2, 32), rig, 0, BODY_Y, 0, mat);
    shadowGen.addShadowCaster(body);
    if (type === 'frog') body.scaling.set(1.08, 0.88, 1);

    // 밝은 배
    const belly = feat(ball(0.72), body, 0, -0.3, surf(0, -0.3) - 0.08, lightMat);
    belly.scaling.set(1, 0.8, 0.35);

    // 눈 (개구리는 위로 툭 튀어나온 눈)
    if (type === 'frog') {
      for (const sx of [-0.27, 0.27]) {
        feat(ball(0.36, 16), body, sx, 0.52, 0.28, mat);
        feat(ball(0.26, 16), body, sx, 0.54, 0.38, whiteMat);
        feat(ball(0.14, 12), body, sx, 0.55, 0.49, eyeMat);
        feat(ball(0.05, 8), body, sx + 0.03, 0.59, 0.55, shineMat);
      }
    } else {
      for (const sx of [-0.22, 0.22]) {
        const eye = feat(ball(0.17, 14), body, sx, 0.14, surf(sx, 0.14, -0.02), eyeMat);
        eye.scaling.y = 1.25;
        feat(ball(0.055, 8), body, sx + 0.035, 0.2, surf(sx + 0.035, 0.2, 0.05), shineMat);
      }
    }
    // 볼터치
    for (const sx of [-0.4, 0.4]) {
      const ck = feat(ball(0.2, 12), body, sx, -0.05, surf(sx, -0.05, -0.03), cheekMat);
      ck.scaling.z = 0.3;
      ck.rotation.y = Math.sign(sx) * 0.6;
    }

    // 동물마다 다른 귀·코·꼬리
    let tail = null;
    const ears = [];      // 흐물흐물 흔들릴 귀·깃털
    const addEar = (m) => ears.push({ mesh: m, bx: m.rotation.x, bz: m.rotation.z });
    if (type === 'bunny') {
      for (const sx of [-0.2, 0.2]) {
        const ear = feat(ball(0.3, 16), body, sx, 0.88, -0.05, mat);
        ear.scaling.set(1, 2.4, 0.6);
        ear.rotation.z = -Math.sign(sx) * 0.2;
        const inner = feat(ball(0.3, 12), ear, 0, 0.02, 0.18, pinkNoseMat);
        inner.scaling.set(0.55, 0.8, 0.4);
        shadowGen.addShadowCaster(ear);
        addEar(ear);
      }
      feat(ball(0.1, 10), body, 0, -0.02, surf(0, -0.02, 0.01), pinkNoseMat);
      tail = node('tail', rig, BODY_Y - 0.15, 0, -R + 0.02);
      feat(ball(0.34, 14), tail, 0, 0, 0, whiteMat);
    } else if (type === 'bear') {
      for (const sx of [-0.45, 0.45]) {
        const ear = feat(ball(0.34, 16), body, sx, 0.48, 0.05, mat);
        const inner = feat(ball(0.2, 12), ear, 0, 0, 0.09, lightMat);
        inner.scaling.z = 0.4;
        shadowGen.addShadowCaster(ear);
        addEar(ear);
      }
      const snout = feat(ball(0.42, 16), body, 0, -0.14, surf(0, -0.14) - 0.08, lightMat);
      snout.scaling.set(1.1, 0.8, 0.5);
      feat(ball(0.14, 12), body, 0, -0.06, surf(0, -0.06, 0.07), darkNoseMat);
      tail = node('tail', rig, BODY_Y - 0.2, 0, -R + 0.02);
      feat(ball(0.24, 12), tail, 0, 0, 0, mat);
    } else if (type === 'cat') {
      for (const sx of [-0.36, 0.36]) {
        const ear = feat(cone(0.4, 0.36), body, sx, 0.56, 0, mat);
        ear.rotation.z = -Math.sign(sx) * 0.4;
        const inner = feat(cone(0.26, 0.2), ear, 0, -0.03, 0.07, pinkNoseMat);
        inner.scaling.z = 0.5;
        shadowGen.addShadowCaster(ear);
        addEar(ear);
      }
      feat(ball(0.1, 10), body, 0, -0.04, surf(0, -0.04, 0.01), pinkNoseMat);
      tail = node('tail', rig, BODY_Y - 0.3, 0, -R + 0.05);
      const tailStick = feat(BABYLON.MeshBuilder.CreateCylinder('tailStick', { height: 0.8, diameter: 0.14, tessellation: 12 }, scene), tail, 0, 0.38, -0.15, mat);
      tailStick.rotation.x = -0.4;
      feat(ball(0.14, 10), tailStick, 0, 0.4, 0, mat);
      feat(ball(0.14, 10), tailStick, 0, -0.4, 0, mat);
      shadowGen.addShadowCaster(tailStick);
    } else if (type === 'chick') {
      const beak = feat(cone(0.28, 0.24), body, 0, -0.04, surf(0, -0.04, 0.08), orangeMat);
      beak.rotation.x = Math.PI / 2;
      for (const [x, z, r] of [[0, 0, 0], [-0.08, -0.04, 0.4], [0.08, -0.04, -0.4]]) {
        const tuft = feat(ball(0.16, 10), body, x, 0.74, z, mat);
        tuft.scaling.set(0.6, 1.5, 0.6);
        tuft.rotation.z = r;
        addEar(tuft);
      }
    } else if (type === 'frog') {
      // 개구리는 귀 대신 눈이 포인트!
    } else if (type === 'turtle') {
      // 등에 동그란 등껍질 + 무늬 + 테두리
      const shellMat = makeMat('shellM', spec.shell, 0.4, 32, 0.08);
      const shellLightMat = tintMat('shellL', spec.shell, 0.45);
      const shell = feat(ball(1.36, 32), body, 0, 0.05, -0.28, shellMat);
      shell.scaling.set(1.04, 0.98, 0.72);
      shadowGen.addShadowCaster(shell);
      for (const [x, y] of [[0, 0.14], [-0.31, -0.08], [0.31, -0.08], [-0.21, 0.42], [0.21, 0.42], [0, -0.36]]) {
        const zz = -Math.sqrt(Math.max(0.0001, 0.455 - x * x - y * y));
        const spot = feat(ball(0.24, 12), shell, x, y, zz, shellLightMat);
        spot.scaling.z = 0.35;
      }
      const rim = feat(BABYLON.MeshBuilder.CreateTorus('rim', { diameter: 1.32, thickness: 0.1, tessellation: 40 }, scene), shell, 0, 0, 0, shellLightMat);
      rim.rotation.x = Math.PI / 2;
      tail = node('tail', rig, BODY_Y - 0.4, 0, -0.72);
      const tailTip = feat(cone(0.22, 0.16), tail, 0, 0, 0, mat);
      tailTip.rotation.x = -Math.PI / 2;
    } else if (type === 'bird') {
      const crestMat = shadeMat('crestM', hex, 0.78);
      const beak = feat(cone(0.24, 0.2), body, 0, -0.03, surf(0, -0.03, 0.07), orangeMat);
      beak.rotation.x = Math.PI / 2;
      // 머리 위 볏 깃털
      for (const [x, r, h] of [[-0.1, 0.35, 1.6], [0, 0, 2.1], [0.1, -0.35, 1.6]]) {
        const crest = feat(ball(0.16, 10), body, x, 0.72, -0.04, crestMat);
        crest.scaling.set(0.5, h, 0.5);
        crest.rotation.z = r;
        crest.rotation.x = -0.3;
        addEar(crest);
      }
      // 부채꼴 꼬리 깃털
      tail = node('tail', rig, BODY_Y - 0.05, 0, -R + 0.05);
      for (const r of [-0.45, 0, 0.45]) {
        const f = feat(ball(0.22, 12), tail, Math.sin(r) * 0.14, 0.05, -0.14, crestMat);
        f.scaling.set(0.45, 0.3, 1.7);
        f.rotation.y = r;
        f.rotation.x = -0.5;
      }
    }

    // 작은 발 2개 + 작은 손 2개
    const feet = [], hands = [];
    for (const sx of [-0.27, 0.27]) {
      const f = feat(ball(0.36, 16), rig, sx, 0.11, 0.05, pawMat);
      f.scaling.set(1, 0.6, 1.35);
      shadowGen.addShadowCaster(f);
      feet.push(f);
      const h = feat(ball(0.28, 14), body, sx * 2.55, -0.02, 0.05, pawMat);
      h.scaling.set(0.8, 1, 0.9);
      hands.push(h);
    }

    // 내 캐릭터 표시 화살표 (고른 동물만 보여요)
    const marker = BABYLON.MeshBuilder.CreateCylinder('marker', { height: 0.6, diameterTop: 0, diameterBottom: 0.5, tessellation: 4 }, scene);
    marker.parent = root;
    marker.rotation.x = Math.PI;
    marker.position.y = 2.5;
    marker.material = markerMat;
    glow.addIncludedOnlyMesh(marker);
    marker.setEnabled(false);

    return {
      root, marker, isPlayer: false, color: hex, type,
      rig, body, feet, hands, tail, ears,
      jx: 0, jxV: 0, jz: 0, jzV: 0, prevVx: 0, prevVz: 0,
      pos: new BABYLON.Vector3(0, 0, 0),
      vel: new BABYLON.Vector3(0, 0, 0),
      onGround: true, stun: 0, hitCd: 0,
      squash: 0, sqV: 0, facing: 0, runPhase: 0,
      air: 0, stunAmt: 0,
      finished: false, place: 0, finishTime: 0,
      checkpoint: 0, jumpBuffer: 0,
      bumpT: 0, logImmune: 0,
      speedMul: 1,
      ai: { targetX: 0, retarget: 0, jumpCd: 0, dodgeCd: 0, skill: 0.5 + Math.random() * 0.35, aggro: Math.random() }
    };
  }

  const chars = ANIMALS.map(a => createRunner(a));
  let player = chars[0];

  // 진행 막대 점
  const progressWrap = document.getElementById('progressWrap');
  chars.forEach(c => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dot.style.background = c.color;
    progressWrap.appendChild(dot);
    c.dot = dot;
  });

  // 내 동물 정하기 (나머지는 컴퓨터가 움직여요)
  function setPlayer(type) {
    chars.forEach(c => {
      c.isPlayer = (c.type === type);
      c.marker.setEnabled(c.isPlayer);
      c.speedMul = c.isPlayer ? 1 : 0.82 + Math.random() * 0.12;
      c.dot.className = 'dot' + (c.isPlayer ? ' me' : '');
    });
    player = chars.find(c => c.isPlayer);
  }

  // 시작 화면의 동물 고르기 버튼
  const pickRow = document.getElementById('pickRow');
  ANIMALS.forEach(a => {
    const b = document.createElement('button');
    b.className = 'pick' + (a.type === 'bunny' ? ' sel' : '');
    b.innerHTML = '<span class="emo">' + a.emoji + '</span>' + a.name;
    b.addEventListener('click', () => {
      pickRow.querySelectorAll('.pick').forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      setPlayer(a.type);
      resetRace();
    });
    pickRow.appendChild(b);
  });
  setPlayer('bunny');

  // =====================================================
  //  입력 (키보드 + 터치 버튼)
  // =====================================================
  const keys = {};
  const touch = { left: false, right: false };

  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'Space' && !e.repeat) player.jumpBuffer = 0.15;
  });
  window.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

  if (window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) {
    document.body.classList.add('touch');
  }
  document.querySelectorAll('.tbtn').forEach(btn => {
    const k = btn.dataset.key;
    const on = e => {
      e.preventDefault();
      btn.classList.add('on');
      if (k === 'jump') player.jumpBuffer = 0.15;
      else touch[k] = true;
    };
    const off = e => {
      e.preventDefault();
      btn.classList.remove('on');
      if (k === 'left' || k === 'right') touch[k] = false;
    };
    btn.addEventListener('pointerdown', on);
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => btn.addEventListener(t, off));
  });

  // 앞으로는 무조건 달리고, 좌우만 조절해요
  function getPlayerInput() {
    const right = keys.ArrowRight || keys.KeyD || touch.right;
    const left = keys.ArrowLeft || keys.KeyA || touch.left;
    return { ix: (right ? 1 : 0) - (left ? 1 : 0), iz: 1 };
  }

  // =====================================================
  //  컴퓨터 캐릭터 생각하기
  // =====================================================
  function botThink(c, dt) {
    const ai = c.ai;
    ai.retarget -= dt;
    ai.jumpCd -= dt;
    ai.dodgeCd -= dt;
    if (ai.retarget <= 0) {
      ai.targetX = (Math.random() * 2 - 1) * 5;
      ai.retarget = 0.8 + Math.random() * 1.8;
      // 장난꾸러기 봇은 가까운 러너에게 몸통 박치기하러 가요
      if (Math.random() < ai.aggro * 0.5) {
        for (const o of chars) {
          if (o === c || o.finished) continue;
          if (Math.abs(o.pos.z - c.pos.z) < 2.5 && Math.abs(o.pos.x - c.pos.x) < 4) {
            ai.targetX = clamp(o.pos.x, -6, 6);
            ai.retarget = 0.7;
            break;
          }
        }
      }
    }
    // 굴러오는 공 피하기
    for (const b of balls) {
      if (!b.active || ai.dodgeCd > 0) continue;
      const ahead = b.z - c.pos.z;
      if (ahead > 0 && ahead < 8 && Math.abs(b.x - c.pos.x) < 2.2) {
        ai.dodgeCd = 0.7;
        if (Math.random() < ai.skill + 0.1) {
          ai.targetX = clamp(b.x > c.pos.x ? b.x - 3.4 : b.x + 3.4, -5.5, 5.5);
          ai.retarget = 0.8;
        }
      }
    }
    let ix = clamp((ai.targetX - c.pos.x) * 0.4, -1, 1);
    if (Math.abs(c.pos.x) > 5.8) ix = -Math.sign(c.pos.x);
    let jump = false;
    for (const s of spinners) {
      if (Math.abs(c.pos.z - s.z) > s.half + 2) continue;
      const info = barInfo(s, c.pos.x, c.pos.z);
      if (info.d < 2.0 && ai.jumpCd <= 0) {
        ai.jumpCd = 0.8;
        if (Math.random() < ai.skill) jump = true;
      }
    }
    // 통나무가 다가오면 점프!
    for (const l of logs) {
      if (!l.active) continue;
      const ahead = l.z - c.pos.z;
      if (ahead > 1.5 && ahead < 3.6 && ai.jumpCd <= 0) {
        ai.jumpCd = 0.6;
        if (Math.random() < ai.skill + 0.15) jump = true;
      }
    }
    if (Math.random() < dt * 0.2) jump = true;
    return { ix, iz: 1, jump };
  }

  // =====================================================
  //  부딪힘 처리
  // =====================================================
  function knock(c, nx, nz, power, stunTime) {
    if (c.hitCd > 0) return;
    c.vel.x = nx * power;
    c.vel.z = nz * power;
    c.vel.y = Math.max(c.vel.y, 6);
    c.onGround = false;
    c.stun = stunTime;
    c.hitCd = 0.35;
    c.squash = 0.45;
  }

  function collideObstacles(c) {
    // 회전 막대
    for (const s of spinners) {
      if (Math.abs(c.pos.z - s.z) > s.half + 2) continue;
      // 가운데 기둥
      if (c.pos.y < 1.6) {
        const dx = c.pos.x, dz = c.pos.z - s.z;
        const d = Math.hypot(dx, dz), minD = 0.6 + CHAR_R;
        if (d < minD && d > 0.0001) {
          c.pos.x = dx / d * minD;
          c.pos.z = s.z + dz / d * minD;
        }
      }
      // 막대
      if (c.pos.y < 1.0) {
        const info = barInfo(s, c.pos.x, c.pos.z);
        const minD = CHAR_R + 0.45;
        if (info.d < minD) {
          let nx = info.nx, nz = info.nz, d = info.d;
          if (d < 0.0001) { nx = -s.dir.z; nz = s.dir.x; d = 1; }
          nx /= d; nz /= d;
          c.pos.x = info.cx + nx * minD;
          c.pos.z = s.z + info.cz + nz * minD;
          knock(c, nx, nz, 11, 0.6);
        }
      }
    }
    // 움직이는 벽
    for (const w of walls) {
      if (c.pos.y >= w.h) continue;
      if (Math.abs(c.pos.z - w.z) > 3) continue;
      const qx = clamp(c.pos.x, w.x - w.w / 2, w.x + w.w / 2);
      const qz = clamp(c.pos.z, w.z - w.d / 2, w.z + w.d / 2);
      let dx = c.pos.x - qx, dz = c.pos.z - qz;
      let d = Math.hypot(dx, dz);
      if (d < CHAR_R) {
        let nx, nz;
        if (d < 0.0001) {
          const penX = w.w / 2 - Math.abs(c.pos.x - w.x);
          const penZ = w.d / 2 - Math.abs(c.pos.z - w.z);
          if (penX < penZ) { nx = Math.sign(c.pos.x - w.x) || 1; nz = 0; c.pos.x = w.x + nx * (w.w / 2 + CHAR_R); }
          else { nx = 0; nz = Math.sign(c.pos.z - w.z) || -1; c.pos.z = w.z + nz * (w.d / 2 + CHAR_R); }
        } else {
          nx = dx / d; nz = dz / d;
          c.pos.x = qx + nx * CHAR_R;
          c.pos.z = qz + nz * CHAR_R;
        }
        if (nx * w.vx > 1) knock(c, nx, nz * 0.3, 7 + Math.abs(w.vx), 0.4);
        else {
          // 벽에 막히면 그 방향 속도 줄이기
          const vn = c.vel.x * nx + c.vel.z * nz;
          if (vn < 0) { c.vel.x -= vn * nx; c.vel.z -= vn * nz; }
        }
      }
    }
    // 범퍼
    for (const b of bumpers) {
      if (c.pos.y > 1.6) continue;
      const dx = c.pos.x - b.x, dz = c.pos.z - b.z;
      const d = Math.hypot(dx, dz), minD = b.r + CHAR_R;
      if (d < minD && d > 0.0001) {
        const nx = dx / d, nz = dz / d;
        c.pos.x = b.x + nx * minD;
        c.pos.z = b.z + nz * minD;
        if (c.hitCd <= 0) b.pulse = 1;
        knock(c, nx, nz, 10, 0.25);
      }
    }
    // 굴러오는 공
    for (const b of balls) {
      if (!b.active || c.pos.y > b.r * 2) continue;
      const dx = c.pos.x - b.x, dz = c.pos.z - b.z;
      const d = Math.hypot(dx, dz), minD = b.r + CHAR_R;
      if (d < minD && d > 0.0001) {
        const nx = dx / d, nz = dz / d;
        c.pos.x = b.x + nx * minD;
        c.pos.z = b.z + nz * minD;
        const kx = nx, kz = nz - 1;
        const kl = Math.hypot(kx, kz) || 1;
        knock(c, kx / kl, kz / kl, 12, 0.6);
      }
    }
  }

  // 통나무에 부딪히면 위로 붕~ 튕겨서 빙글빙글 (그동안 통나무는 아래로 지나가요)
  function collideLogs(c) {
    if (c.logImmune > 0) return;
    for (const l of logs) {
      if (!l.active || c.pos.y > LOG_R * 2 - 0.15) continue;
      const dz = c.pos.z - l.z;
      const minD = LOG_R + CHAR_R * 0.7;
      if (Math.abs(dz) < minD) {
        c.logImmune = 0.7;
        c.hitCd = 0;
        knock(c, (Math.random() - 0.5) * 0.4, -0.15, 10, 0.5);
        c.vel.y = 10;
        break;
      }
    }
  }

  // 러너끼리 몸으로 쿵! 부딪히면 서로 튕겨나가요
  const BUMP_POWER = 4;        // 부딪힐 때 기본으로 튕기는 힘
  const BUMP_BOUNCE = 1.6;     // 달려오던 속도를 얼마나 세게 돌려주는지
  function collideChars() {
    for (let i = 0; i < chars.length; i++) {
      for (let j = i + 1; j < chars.length; j++) {
        const a = chars[i], b = chars[j];
        if (Math.abs(a.pos.y - b.pos.y) > 1.4) continue;
        const dx = b.pos.x - a.pos.x, dz = b.pos.z - a.pos.z;
        const d = Math.hypot(dx, dz), minD = CHAR_R * 2;
        if (d < minD && d > 0.0001) {
          const nx = dx / d, nz = dz / d, overlap = (minD - d) / 2;
          a.pos.x -= nx * overlap; a.pos.z -= nz * overlap;
          b.pos.x += nx * overlap; b.pos.z += nz * overlap;

          // 서로 가까워지는 중일 때만 튕기기
          const approach = (a.vel.x - b.vel.x) * nx + (a.vel.z - b.vel.z) * nz;
          if (approach > 0.3) {
            // 더 세게 달려든 쪽이 상대를 더 많이 밀어내요
            const aRush = Math.max(0, a.vel.x * nx + a.vel.z * nz);
            const bRush = Math.max(0, -(b.vel.x * nx + b.vel.z * nz));
            const toB = BUMP_POWER + aRush * BUMP_BOUNCE;
            const toA = BUMP_POWER + bRush * BUMP_BOUNCE;
            b.vel.x += nx * toB; b.vel.z += nz * toB * 0.4;
            a.vel.x -= nx * toA; a.vel.z -= nz * toA * 0.4;
            if (a.onGround) a.vel.y = Math.max(a.vel.y, 2.5);
            if (b.onGround) b.vel.y = Math.max(b.vel.y, 2.5);
            a.onGround = false; b.onGround = false;
            a.bumpT = 0.35; b.bumpT = 0.35;
            a.squash = 0.3; b.squash = 0.3;
          }
        }
      }
    }
  }

  // =====================================================
  //  게임 진행 상태
  // =====================================================
  let gameState = 'title';   // title, countdown, racing, result
  let raceTime = 0;
  let countdown = 3;
  let lastCountText = '';
  let goTimer = 0;
  let finishOrder = [];
  let worldTime = 0;

  const hud = document.getElementById('hud');
  const countEl = document.getElementById('countdown');
  const rankNum = document.getElementById('rankNum');
  const timeNum = document.getElementById('timeNum');
  const startScreen = document.getElementById('startScreen');
  const resultScreen = document.getElementById('resultScreen');

  function respawn(c) {
    c.pos.set((Math.random() * 2 - 1) * 3, 4, c.checkpoint + 1);
    c.vel.set(0, 0, 0);
    c.stun = 0;
    c.onGround = false;
    c.squash = -0.3;
  }

  function resetRace() {
    finishOrder = [];
    raceTime = 0;
    const slots = [-6, -4, -2, 0, 2, 4, 6].sort(() => Math.random() - 0.5);
    chars.forEach((c, i) => {
      c.pos.set(slots[i], 0, 2);
      c.vel.set(0, 0, 0);
      c.onGround = true;
      c.finished = false;
      c.place = 0;
      c.finishTime = 0;
      c.stun = 0; c.hitCd = 0;
      c.squash = 0; c.sqV = 0;
      c.air = 0; c.stunAmt = 0;
      c.facing = 0;
      c.checkpoint = 0;
      c.jumpBuffer = 0;
      c.bumpT = 0; c.logImmune = 0;
      c.jx = 0; c.jxV = 0; c.jz = 0; c.jzV = 0; c.prevVx = 0; c.prevVz = 0;
      c.ai.retarget = 0;
      c.ai.jumpCd = 0;
      c.ai.dodgeCd = 0;
    });
    spinners.forEach(s => s.angle = Math.random() * Math.PI);
    resetTiles();
    resetBalls();
    resetLogs();
    clearConfetti();
    camera.position.set(player.pos.x * 0.6, 6, player.pos.z - 11);
    camTarget.set(camera.position.x, 2, camera.position.z + 15);
    camera.setTarget(camTarget);
  }

  function startCountdown() {
    gameState = 'countdown';
    countdown = 3;
    lastCountText = '';
    hud.classList.add('show');
    resultScreen.classList.remove('show');
  }

  function showCount(text) {
    countEl.textContent = text;
    countEl.style.display = 'block';
    countEl.classList.remove('pop');
    void countEl.offsetWidth;
    countEl.classList.add('pop');
  }

  function onPlayerFinish() {
    gameState = 'result';
    const place = player.place;
    setTimeout(() => {
      document.getElementById('resultTitle').textContent = place === 1 ? '🏆 우승!' : '🎉 골인!';
      document.getElementById('resultPlace').textContent = place + '등';
      document.getElementById('resultTime').textContent = '기록 ' + player.finishTime.toFixed(1) + '초';
      const msgs = ['최고의 동물 러너예요!', '아깝다! 거의 1등이었어요', '잘 달렸어요!', '다음엔 더 빠르게!', '포기하지 않은 게 멋져요', '끝까지 달렸어요, 대단해요!'];
      document.getElementById('resultMsg').textContent = msgs[place - 1] || msgs[5];
      resultScreen.classList.add('show');
    }, 1500);
  }

  document.getElementById('startBtn').addEventListener('click', () => {
    startScreen.classList.remove('show');
    resetRace();
    startCountdown();
  });
  document.getElementById('retryBtn').addEventListener('click', () => {
    resetRace();
    startCountdown();
  });
  document.getElementById('changeBtn').addEventListener('click', () => {
    resultScreen.classList.remove('show');
    hud.classList.remove('show');
    countEl.style.display = 'none';
    gameState = 'title';
    resetRace();
    startScreen.classList.add('show');
  });

  // =====================================================
  //  캐릭터 한 명 움직이기
  // =====================================================
  function updateChar(c, dt) {
    let ix = 0, iz = 0, jump = false;
    const canMove = (gameState === 'racing' || gameState === 'result') && !c.finished;

    if (canMove) {
      if (c.isPlayer) {
        const inp = getPlayerInput();
        ix = inp.ix; iz = inp.iz;
        jump = c.jumpBuffer > 0;
      } else {
        const inp = botThink(c, dt);
        ix = inp.ix; iz = inp.iz; jump = inp.jump;
      }
    } else if (c.onGround && (!c.isPlayer || c.finished) && Math.random() < dt * (c.finished ? 1.5 : 0.4)) {
      jump = true; // 기다리거나 골인하면 신나서 콩콩
    }
    if (c.jumpBuffer > 0) c.jumpBuffer -= dt;

    const len = Math.hypot(ix, iz);
    if (len > 1) { ix /= len; iz /= len; }
    const maxSpeed = SPEED * c.speedMul;
    let accel = c.onGround ? 12 : 4;
    if (c.stun > 0) { accel = 1.2; c.stun -= dt; }
    if (c.bumpT > 0) { accel = Math.min(accel, 2.5); c.bumpT -= dt; }   // 부딪힌 직후엔 잠깐 미끄러져요
    if (c.hitCd > 0) c.hitCd -= dt;
    if (c.logImmune > 0) c.logImmune -= dt;
    const k = 1 - Math.exp(-accel * dt);
    c.vel.x += (ix * maxSpeed - c.vel.x) * k;
    c.vel.z += (iz * maxSpeed - c.vel.z) * k;

    if (jump && c.onGround) {
      c.vel.y = JUMP;
      c.onGround = false;
      c.squash = -0.3;
      c.jumpBuffer = 0;
    }

    c.vel.y -= GRAVITY * dt;
    c.pos.x += c.vel.x * dt;
    c.pos.y += c.vel.y * dt;
    c.pos.z += c.vel.z * dt;

    // 바닥 확인
    const solid = isSolid(c.pos.x, c.pos.z);
    if (solid && c.pos.y <= 0 && c.pos.y > -0.8) {
      if (!c.onGround && c.vel.y < -3) c.squash = Math.min(0.55, -c.vel.y * 0.045);
      c.pos.y = 0;
      c.vel.y = 0;
      c.onGround = true;
    } else if (c.pos.y > 0.001 || !solid) {
      c.onGround = false;
    }

    // 발판을 밟으면 흔들리기 시작
    if (c.onGround && inGap(c.pos.z)) {
      const t = findTile(c.pos.x, c.pos.z);
      if (t && t.state === 'idle') {
        t.state = 'shaking';
        t.timer = 0.55;
        t.mesh.material = tileWarnMat;
      }
    }

    collideObstacles(c);
    collideLogs(c);

    // 체크포인트
    if (c.onGround) {
      for (const cp of CHECKPOINTS) if (c.pos.z >= cp && cp > c.checkpoint) c.checkpoint = cp;
    }
    // 떨어지면 다시 시작
    if (c.pos.y < -18) respawn(c);

    // 결승선
    if (!c.finished && c.pos.z >= FINISH_Z && (gameState === 'racing' || gameState === 'result')) {
      c.finished = true;
      c.finishTime = raceTime;
      finishOrder.push(c);
      c.place = finishOrder.length;
      spawnConfetti(c.isPlayer ? 160 : 20);
      if (c.isPlayer) onPlayerFinish();
    }
  }

  // 캐릭터 몸 움직이기 (흐물흐물 뒤뚱뒤뚱, 점프, 맞기, 만세)
  function animateChar(c, dt) {
    c.root.position.copyFrom(c.pos);
    const hs = Math.hypot(c.vel.x, c.vel.z);
    if (c.stun > 0) {
      c.facing += dt * 14; // 맞으면 빙글빙글
    } else if (hs > 0.6) {
      c.facing = lerpAngle(c.facing, Math.atan2(c.vel.x, c.vel.z), 1 - Math.exp(-10 * dt));
    }
    c.root.rotation.y = c.facing;

    const a = Math.min(hs / SPEED, 1);              // 얼마나 빨리 달리는지 (0~1)
    if (c.onGround) c.runPhase += dt * hs * 1.25;
    const p = c.runPhase;
    c.air += ((c.onGround ? 0 : 1) - c.air) * (1 - Math.exp(-12 * dt));
    c.stunAmt += ((c.stun > 0 ? 1 : 0) - c.stunAmt) * (1 - Math.exp(-10 * dt));
    const air = c.air;
    const cheer = c.finished && c.stun <= 0;

    // 흐물흐물: 속도가 바뀌면 몸이 젤리처럼 한 박자 늦게 출렁출렁
    const sdt = Math.max(dt, 0.001);
    const ax = (c.vel.x - c.prevVx) / sdt, az = (c.vel.z - c.prevVz) / sdt;
    c.prevVx = c.vel.x; c.prevVz = c.vel.z;
    const cf = Math.cos(c.facing), sf = Math.sin(c.facing);
    const sideAcc = ax * cf - az * sf;        // 옆으로 얼마나 확 움직였는지
    const fwdAcc = ax * sf + az * cf;         // 앞뒤로 얼마나 확 움직였는지
    c.jzV += ((clamp(sideAcc * 0.012, -0.45, 0.45) - c.jz) * 90 - c.jzV * 4.5) * dt;
    c.jz += c.jzV * dt;
    c.jxV += ((clamp(-fwdAcc * 0.01, -0.35, 0.35) - c.jx) * 90 - c.jxV * 4.5) * dt;
    c.jx += c.jxV * dt;

    // 뒤뚱뒤뚱: 좌우로 크게 기우뚱 + 엉덩이 실룩
    const waddle = Math.sin(p);
    c.rig.position.x = waddle * 0.07 * a;
    c.rig.position.y = c.onGround ? Math.abs(Math.sin(p)) * a * 0.1 : 0;
    c.body.rotation.z = waddle * 0.3 * a + c.jz + c.stunAmt * Math.sin(worldTime * 20) * 0.2;
    c.body.rotation.x = 0.1 * a * (1 - air) - air * 0.1 + c.jx;
    c.body.rotation.y = waddle * 0.12 * a;

    for (let i = 0; i < 2; i++) {
      const side = i === 0 ? -1 : 1;
      const ph = p + i * Math.PI;

      // 발: 종종종 번갈아 앞뒤로 (살짝 바깥으로 벌리며 뒤뚱)
      const f = c.feet[i];
      f.position.z = 0.05 + Math.sin(ph) * 0.24 * a * (1 - air);
      f.position.y = 0.11 + Math.max(0, Math.cos(ph)) * 0.14 * a * (1 - air) + air * 0.06;
      f.position.x = side * (0.27 + Math.max(0, Math.cos(ph)) * 0.05 * a);
      f.rotation.y = side * 0.25;

      // 손: 흐느적흐느적 흔들기, 점프하면 번쩍, 골인하면 만세
      let hy = lerp(-0.02 + Math.sin(ph * 2) * 0.05 * a, 0.45, air) - c.jz * side * 0.4;
      let hz = 0.05 - Math.sin(ph) * 0.2 * a * (1 - air) - c.jx * 0.4;
      if (cheer) {
        hy = 0.55 + Math.sin(worldTime * 12 + i * 2) * 0.12;
        hz = 0.1;
      }
      if (c.stunAmt > 0.05) hy += Math.sin(worldTime * 25 + i * 3) * 0.2 * c.stunAmt;   // 허우적허우적
      hy = clamp(hy, -0.5, 0.62);
      const hx = Math.sqrt(Math.max(0.02, BODY_R * BODY_R - hy * hy - hz * hz)) + 0.02;  // 공 표면에 붙어있게
      c.hands[i].position.set(side * hx, hy, hz);
    }

    // 귀·깃털도 한 박자 늦게 흐물흐물
    for (const e of c.ears) {
      e.mesh.rotation.x = e.bx - c.jx * 1.4 - c.jxV * 0.04 + Math.sin(p * 2) * 0.06 * a;
      e.mesh.rotation.z = e.bz - c.jz * 1.6 - c.jzV * 0.05;
    }

    // 말랑한 스프링 (걸음마다 말랑, 착지할 때 납작, 점프할 때 길쭉)
    c.sqV += (-c.squash * 150 - c.sqV * 5) * dt;
    c.squash += c.sqV * dt;
    c.squash = clamp(c.squash, -0.4, 0.6);
    let s = c.squash + Math.cos(p * 2) * 0.07 * a * (1 - air);
    if (!c.onGround) s += clamp(-c.vel.y * 0.012, -0.12, 0.1);
    c.rig.scaling.y = RIG_S * (1 - s * 0.8);
    c.rig.scaling.x = RIG_S * (1 + s * 0.5);
    c.rig.scaling.z = RIG_S * (1 + s * 0.5);

    if (c.marker) c.marker.position.y = 2.5 + Math.sin(worldTime * 4) * 0.15;
    if (c.tail) c.tail.rotation.z = Math.sin(worldTime * 9 + c.runPhase) * 0.35 - c.jz;   // 꼬리 살랑살랑
  }

  // =====================================================
  //  매 순간 실행되는 게임 진행
  // =====================================================
  function update(dt) {
    worldTime += dt;

    // 카운트다운
    if (gameState === 'countdown') {
      countdown -= dt;
      const text = countdown > 0 ? String(Math.ceil(countdown)) : '출발!';
      if (text !== lastCountText) { showCount(text); lastCountText = text; }
      if (countdown <= 0) { gameState = 'racing'; goTimer = 0.8; }
    }
    if (goTimer > 0) {
      goTimer -= dt;
      if (goTimer <= 0) countEl.style.display = 'none';
    }
    if (gameState === 'racing' || gameState === 'result') raceTime += dt;

    // 장애물 움직이기
    for (const s of spinners) {
      s.angle += s.speed * dt;
      s.pivot.rotation.y = s.angle;
      s.pivot.computeWorldMatrix(true);
      s.dir = s.pivot.getDirection(BABYLON.Axis.X);
    }
    for (const w of walls) {
      const nx = Math.sin(worldTime * w.speed + w.phase) * w.amp;
      w.vx = dt > 0 ? (nx - w.x) / dt : 0;
      w.x = nx;
      w.mesh.position.x = nx;
    }
    for (const b of bumpers) {
      b.pulse = Math.max(0, b.pulse - dt * 3);
      const sc = 1 + Math.sin(b.pulse * Math.PI * 3) * b.pulse * 0.2;
      b.mesh.scaling.set(sc, 1 / sc, sc);
    }
    for (const d of donuts) d.mesh.rotation.y += d.spin * dt;
    updateConfetti(dt);

    // 떨어지는 발판
    for (const t of tiles) {
      if (t.state === 'shaking') {
        t.timer -= dt;
        t.mesh.position.x = t.x + Math.sin(worldTime * 60) * 0.06;
        if (t.timer <= 0) {
          t.state = 'falling';
          t.vy = 0;
          t.timer = 3.5;           // 다시 올라오기까지 걸리는 시간
          t.mesh.position.x = t.x;
        }
      } else if (t.state === 'falling') {
        t.vy += GRAVITY * dt;
        t.y -= t.vy * dt;
        t.mesh.position.y = -0.3 + t.y;
        t.mesh.isVisible = t.y > -40;
        t.timer -= dt;
        if (t.timer <= 0) {
          t.state = 'idle'; t.y = 0; t.vy = 0;
          t.mesh.position.y = -0.3;
          t.mesh.material = t.baseMat;
          t.mesh.isVisible = true;
        }
      }
    }

    // 굴러오는 공
    for (const zone of BALL_ZONES) {
      zone.timer -= dt;
      if (zone.timer <= 0) {
        spawnBall(zone);
        zone.timer = 0.9 + Math.random() * 0.6;
      }
    }
    for (const b of balls) {
      if (!b.active) continue;
      b.z -= b.speed * dt;
      b.mesh.position.z = b.z;
      b.mesh.rotation.x -= (b.speed / b.r) * dt;
      const sc = clamp(Math.min((b.z - b.end) / 2, (b.start - b.z) / 1.5 + 0.2), 0, 1);
      const bs = Math.max(sc, 0.01);
      b.mesh.scaling.set(bs, bs, bs);
      if (b.z < b.end) { b.active = false; b.mesh.isVisible = false; }
    }

    // 굴러오는 통나무
    logTimer -= dt;
    if (logTimer <= 0) {
      spawnLog();
      logTimer = 2.0 + Math.random() * 0.9;
    }
    for (const l of logs) {
      if (!l.active) continue;
      l.z -= l.speed * dt;
      l.pivot.position.z = l.z;
      l.pivot.rotation.x -= (l.speed / LOG_R) * dt;
      const sc = clamp(Math.min((l.z - LOG_END) / 2, (LOG_START - l.z) / 1.5 + 0.2), 0, 1);
      const ls = Math.max(sc, 0.01);
      l.pivot.scaling.set(1, ls, ls);
      if (l.z < LOG_END) { l.active = false; l.pivot.setEnabled(false); }
    }

    // 캐릭터
    for (const c of chars) updateChar(c, dt);
    collideChars();
    for (const c of chars) animateChar(c, dt);

    // 카메라 따라가기
    const ck = 1 - Math.exp(-5 * dt);
    const desired = new BABYLON.Vector3(player.pos.x * 0.6, Math.max(player.pos.y, -4) + 6, player.pos.z - 11);
    BABYLON.Vector3.LerpToRef(camera.position, desired, ck, camera.position);
    // 시선은 항상 트랙 앞쪽(정면)을 바라봐요
    camTarget.set(camera.position.x, camera.position.y - 4, camera.position.z + 15);
    camera.setTarget(camTarget);

    // 그림자가 플레이어 주변을 비추도록
    sun.position = new BABYLON.Vector3(player.pos.x, 0, player.pos.z + 8).subtract(sun.direction.scale(45));

    // 화면 표시 (순위, 시간, 진행 막대)
    if (gameState !== 'title') {
      const sorted = chars.slice().sort((a, b) => {
        if (a.finished && b.finished) return a.place - b.place;
        if (a.finished) return -1;
        if (b.finished) return 1;
        return b.pos.z - a.pos.z;
      });
      rankNum.textContent = sorted.indexOf(player) + 1;
      const shownTime = player.finished ? player.finishTime : raceTime;
      timeNum.textContent = shownTime.toFixed(1);
      for (const c of chars) {
        const p = clamp(c.pos.z / FINISH_Z, 0, 1);
        c.dot.style.left = (p * 100) + '%';
      }
    }
  }

  resetRace();

  engine.runRenderLoop(() => {
    const dt = Math.min(engine.getDeltaTime() / 1000, 0.05);
    update(dt);
    scene.render();
  });

  window.addEventListener('resize', () => {
    engine.resize();
    updateFov();
  });
}

// =====================================================
//  Babylon.js 불러오기 (여러 주소를 차례로 시도)
// =====================================================
const BABYLON_URLS = [
  'https://cdn.jsdelivr.net/npm/babylonjs@7/babylon.js',
  'https://unpkg.com/babylonjs@7/babylon.js',
  'https://cdn.babylonjs.com/babylon.js'
];

function loadBabylon(i) {
  if (window.BABYLON) { onBabylonReady(); return; }
  if (i >= BABYLON_URLS.length) { onBabylonFail(); return; }
  const tag = document.createElement('script');
  tag.src = BABYLON_URLS[i];
  tag.onload = () => { if (window.BABYLON) onBabylonReady(); else loadBabylon(i + 1); };
  tag.onerror = () => loadBabylon(i + 1);
  document.head.appendChild(tag);
}

// 오류가 생기면 화면에 보여주기
function showError(msg) {
  const box = document.getElementById('errBox');
  box.textContent = '⚠️ 오류: ' + msg + ' (이 문장을 복사해서 알려주세요)';
  box.style.display = 'block';
}
window.addEventListener('error', e => showError(e.message || String(e)));

let babylonReady = false;
setTimeout(() => {
  if (!babylonReady) {
    document.getElementById('loadMsg').textContent = '⏳ 아직 불러오는 중이에요... 인터넷이 느리거나 막혀 있을 수 있어요';
  }
}, 15000);

function onBabylonReady() {
  babylonReady = true;
  try {
    startGame();
    const btn = document.getElementById('startBtn');
    btn.disabled = false;
    btn.style.opacity = 1;
    document.getElementById('loadMsg').textContent = '';
  } catch (err) {
    document.getElementById('loadMsg').textContent = '게임을 시작하지 못했어요: ' + err.message;
    showError(err.message);
  }
}

function onBabylonFail() {
  babylonReady = true;
  document.getElementById('loadMsg').innerHTML =
    '😢 3D 프로그램(Babylon.js)을 불러오지 못했어요.<br>인터넷 연결을 확인하고, 파일을 내려받아 Chrome에서 직접 열어주세요.';
}

loadBabylon(0);
</script>
