<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TOGETHER - Co-op Tower</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#7ed8ff;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    display:block;
    width:100vw;
    height:100vh;
}

#ui{
    position:fixed;
    top:14px;
    left:14px;
    right:14px;
    z-index:20;

    display:flex;
    justify-content:space-between;

    pointer-events:none;
}

.panel{
    padding:11px 15px;
    border-radius:15px;

    background:rgba(255,255,255,.92);

    color:#263847;

    box-shadow:
        0 7px 25px rgba(30,100,140,.18);
}

.title{
    font-size:20px;
    font-weight:900;
}

.sub{
    margin-top:4px;
    color:#678094;
    font-size:12px;
}

#height{
    text-align:right;
    font-size:11px;
    font-weight:900;
}

#heightValue{
    color:#328ddd;
    font-size:21px;
}

#message{
    position:fixed;
    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:50;

    min-width:260px;
    padding:22px 28px;

    border-radius:20px;

    background:rgba(255,255,255,.96);

    color:#263847;

    text-align:center;

    font-size:21px;
    font-weight:900;

    box-shadow:
        0 15px 50px rgba(20,80,120,.25);

    opacity:0;

    pointer-events:none;

    white-space:pre-line;

    transition:opacity .2s;
}

#info{
    position:fixed;

    left:50%;
    bottom:18px;

    transform:translateX(-50%);

    z-index:20;

    padding:8px 14px;

    border-radius:12px;

    background:rgba(255,255,255,.76);

    color:#587187;

    font-size:12px;
    font-weight:800;

    pointer-events:none;
}

#controls{
    position:fixed;

    left:0;
    right:0;
    bottom:16px;

    z-index:30;

    display:flex;
    justify-content:space-between;

    padding:0 15px;

    pointer-events:none;
}

.controlGroup{
    display:flex;
    gap:6px;

    pointer-events:auto;
}

.key{
    width:53px;
    height:53px;

    border:2px solid rgba(255,255,255,.85);

    border-radius:15px;

    background:rgba(255,255,255,.82);

    color:#40596d;

    font-size:18px;
    font-weight:900;

    box-shadow:
        0 5px 14px rgba(30,90,130,.2);

    touch-action:none;
}

.key.active{
    transform:scale(.92);
    background:#65b8eb;
    color:white;
}

@media(max-width:700px){

    .title{
        font-size:16px;
    }

    .sub{
        font-size:10px;
    }

    .panel{
        padding:8px 11px;
    }

    .key{
        width:49px;
        height:49px;
    }

    #info{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">

    <div class="panel">
        <div class="title">🌤️ TOGETHER</div>

        <div class="sub">
            서로 떨어지지 않게 협동해서 올라가세요!
        </div>
    </div>

    <div class="panel" id="height">
        HEIGHT<br>
        <span id="heightValue">0m</span>
    </div>

</div>

<div id="message"></div>

<div id="info">
    P1 WASD　•　P2 방향키　•　함께 움직이세요!
</div>

<div id="controls">

    <div class="controlGroup">

        <button class="key" data-key="a">◀</button>
        <button class="key" data-key="d">▶</button>
        <button class="key" data-key="w">▲</button>

    </div>

    <div class="controlGroup">

        <button class="key" data-key="ArrowLeft">◀</button>
        <button class="key" data-key="ArrowRight">▶</button>
        <button class="key" data-key="ArrowUp">▲</button>

    </div>

</div>

<script>

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const heightValue =
    document.getElementById("heightValue");

const message =
    document.getElementById("message");


/* =====================================================
   CANVAS
===================================================== */

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   INPUT
===================================================== */

const keys = {};

addEventListener(
    "keydown",
    e=>{

        keys[e.key] = true;

        if([
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
            " "
        ].includes(e.key)){

            e.preventDefault();
        }
    }
);

addEventListener(
    "keyup",
    e=>{

        keys[e.key] = false;
    }
);


/* MOBILE BUTTONS */

document
.querySelectorAll(".key")
.forEach(button=>{

    const key =
        button.dataset.key;

    function down(e){

        e.preventDefault();

        keys[key] = true;

        button.classList.add(
            "active"
        );
    }

    function up(e){

        e.preventDefault();

        keys[key] = false;

        button.classList.remove(
            "active"
        );
    }

    button.addEventListener(
        "pointerdown",
        down
    );

    button.addEventListener(
        "pointerup",
        up
    );

    button.addEventListener(
        "pointercancel",
        up
    );

    button.addEventListener(
        "pointerleave",
        up
    );
});


/* =====================================================
   GAME SETTINGS
===================================================== */

const GRAVITY = 0.52;

const ACCELERATION = 0.62;

const MAX_SPEED = 5.3;

const JUMP_POWER = 12.2;

const ROPE_LENGTH = 145;

const ROPE_STIFFNESS = 0.45;


/* =====================================================
   PLAYERS
===================================================== */

const players = [

    {
        x:170,
        y:520,

        vx:0,
        vy:0,

        radius:17,

        color:"#ff5363",

        name:"P1",

        left:"a",
        right:"d",
        jump:"w",

        grounded:false
    },

    {
        x:230,
        y:520,

        vx:0,
        vy:0,

        radius:17,

        color:"#438fe0",

        name:"P2",

        left:"ArrowLeft",
        right:"ArrowRight",
        jump:"ArrowUp",

        grounded:false
    }

];


const startPositions = [

    {
        x:170,
        y:520
    },

    {
        x:230,
        y:520
    }

];


/* =====================================================
   MAP
=====================================================

   중요한 부분:

   발판 간 높이 차이를 약 55~75px 정도로 유지해서
   일반 점프로 충분히 이동할 수 있게 만들었습니다.
===================================================== */

const platforms = [

    /* START */

    {
        x:50,
        y:575,
        w:360,
        h:25
    },

    /* 1 */

    {
        x:450,
        y:520,
        w:190,
        h:25
    },

    /* 2 */

    {
        x:680,
        y:455,
        w:170,
        h:25
    },

    /* 3 */

    {
        x:500,
        y:390,
        w:180,
        h:25
    },

    /* 4 */

    {
        x:285,
        y:325,
        w:180,
        h:25
    },

    /* 5 */

    {
        x:90,
        y:260,
        w:170,
        h:25
    },

    /* 6 */

    {
        x:330,
        y:195,
        w:175,
        h:25
    },

    /* 7 */

    {
        x:570,
        y:130,
        w:190,
        h:25
    },

    /* 8 */

    {
        x:760,
        y:65,
        w:160,
        h:25
    },

    /* 9 */

    {
        x:535,
        y:0,
        w:180,
        h:25
    },

    /* 10 */

    {
        x:300,
        y:-65,
        w:175,
        h:25
    },

    /* 11 */

    {
        x:75,
        y:-130,
        w:175,
        h:25
    },

    /* 12 */

    {
        x:320,
        y:-195,
        w:180,
        h:25
    },

    /* 13 */

    {
        x:580,
        y:-260,
        w:180,
        h:25
    },

    /* 14 */

    {
        x:765,
        y:-325,
        w:155,
        h:25
    },

    /* 15 */

    {
        x:525,
        y:-390,
        w:180,
        h:25
    },

    /* 16 */

    {
        x:275,
        y:-455,
        w:190,
        h:25
    },

    /* 17 */

    {
        x:70,
        y:-520,
        w:170,
        h:25
    },

    /* 18 */

    {
        x:315,
        y:-585,
        w:185,
        h:25
    },

    /* 19 */

    {
        x:565,
        y:-650,
        w:190,
        h:25
    },

    /* FINAL */

    {
        x:390,
        y:-735,
        w:230,
        h:30,
        final:true
    }

];


/* =====================================================
   CAMERA
===================================================== */

let cameraY = 0;


/* =====================================================
   GAME STATE
===================================================== */

let resetting = false;

let gameWon = false;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    duration=1200
){

    message.textContent =
        text;

    message.style.opacity =
        "1";

    clearTimeout(
        showMessage.timer
    );

    showMessage.timer =
        setTimeout(
            ()=>{
                message.style.opacity =
                    "0";
            },
            duration
        );
}


/* =====================================================
   RESET
===================================================== */

function resetGame(){

    if(resetttingFix()) return;

    resetting = true;

    gameWon = false;

    players.forEach(
        (p,i)=>{

            p.x =
                startPositions[i].x;

            p.y =
                startPositions[i].y;

            p.vx = 0;
            p.vy = 0;

            p.grounded = true;
        }
    );

    cameraY = 0;

    showMessage(
        "💥 둘 다 떨어졌어요!\n다시 올라가보세요!",
        1300
    );

    setTimeout(
        ()=>{
            resetting = false;
        },
        650
    );
}


/*
   리셋 중 중복 호출 방지
*/
function resetttingFix(){

    return resetting;
}


/* =====================================================
   PLAYER PHYSICS
===================================================== */

function updatePlayer(p){

    /* MOVE */

    if(keys[p.left]){

        p.vx -=
            ACCELERATION;
    }

    if(keys[p.right]){

        p.vx +=
            ACCELERATION;
    }


    /* FRICTION */

    p.vx *= 0.84;


    /* SPEED LIMIT */

    p.vx =
        Math.max(
            -MAX_SPEED,
            Math.min(
                MAX_SPEED,
                p.vx
            )
        );


    /* JUMP */

    if(
        keys[p.jump] &&
        p.grounded
    ){

        p.vy =
            -JUMP_POWER;

        p.grounded =
            false;
    }


    /* GRAVITY */

    p.vy +=
        GRAVITY;

    p.vy =
        Math.min(
            p.vy,
            14
        );


    const oldY =
        p.y;


    p.x +=
        p.vx;

    p.y +=
        p.vy;


    p.grounded =
        false;


    /* PLATFORM COLLISION */

    for(
        const platform
        of platforms
    ){

        const horizontal =
            p.x+p.radius >
            platform.x &&
            p.x-p.radius <
            platform.x+
            platform.w;

        const crossing =
            oldY+p.radius <=
            platform.y &&
            p.y+p.radius >=
            platform.y;

        if(
            horizontal &&
            crossing &&
            p.vy >= 0
        ){

            p.y =
                platform.y-
                p.radius;

            p.vy = 0;

            p.grounded =
                true;
        }
    }


    /* WORLD WALLS */

    if(
        p.x <
        p.radius
    ){

        p.x =
            p.radius;

        p.vx *= -.35;
    }

    if(
        p.x >
        1000-p.radius
    ){

        p.x =
            1000-p.radius;

        p.vx *= -.35;
    }
}


/* =====================================================
   ROPE PHYSICS
===================================================== */

function updateRope(){

    const a =
        players[0];

    const b =
        players[1];


    const dx =
        b.x-a.x;

    const dy =
        b.y-a.y;

    const distance =
        Math.hypot(
            dx,
            dy
        );


    if(
        distance <=
        ROPE_LENGTH ||
        distance === 0
    ){

        return;
    }


    const nx =
        dx/distance;

    const ny =
        dy/distance;


    const excess =
        distance-
        ROPE_LENGTH;


    /*
       둘을 동시에 조금씩 당깁니다.
    */

    a.x +=
        nx*
        excess*
        0.5*
        ROPE_STIFFNESS;

    a.y +=
        ny*
        excess*
        0.5*
        ROPE_STIFFNESS;

    b.x -=
        nx*
        excess*
        0.5*
        ROPE_STIFFNESS;

    b.y -=
        ny*
        excess*
        0.5*
        ROPE_STIFFNESS;


    /*
       서로 멀어지는 속도를 줄입니다.
    */

    const relativeVelocity =
        (b.vx-a.vx)*nx+
        (b.vy-a.vy)*ny;


    if(
        relativeVelocity > 0
    ){

        const impulse =
            relativeVelocity*
            0.45;

        a.vx +=
            nx*impulse;

        a.vy +=
            ny*impulse;

        b.vx -=
            nx*impulse;

        b.vy -=
            ny*impulse;
    }
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    const averageY =
        (
            players[0].y+
            players[1].y
        )/2;


    const target =
        H*.58-
        averageY;


    cameraY +=
        (
            target-
            cameraY
        )*.075;
}


/* =====================================================
   FALL DETECTION
=====================================================

   이번 버전에서 가장 중요한 부분.

   화면 아래로 조금만 나가도 죽는 게 아니라
   카메라 기준으로 화면보다 훨씬 아래,
   즉 실제로 상당히 떨어진 뒤에만 탈락합니다.
===================================================== */

function checkFall(){

    /*
       현재 화면 아래에서 추가로 280px 떨어져야
       탈락하도록 합니다.
    */

    const fallLimit =
        H-
        cameraY+
        280;


    for(
        const p
        of players
    ){

        if(
            p.y >
            fallLimit
        ){

            resetGame();

            return;
        }
    }
}


/* =====================================================
   WIN
===================================================== */

function checkWin(){

    const finalPlatform =
        platforms[
            platforms.length-1
        ];


    /*
       두 명 모두 마지막 발판 위에
       올라와야 클리어.
    */

    const bothOnFinal =
        players.every(
            p =>
                p.y+p.radius <=
                finalPlatform.y+5 &&
                p.x >
                finalPlatform.x-
                15 &&
                p.x <
                finalPlatform.x+
                finalPlatform.w+
                15
        );


    if(
        bothOnFinal &&
        !gameWon
    ){

        gameWon = true;

        showMessage(
            "🎉 TOGETHER!\n둘이 힘을 합쳐 정상에 도착했습니다!",
            4000
        );
    }
}


/* =====================================================
   HEIGHT
===================================================== */

function updateHeight(){

    const highest =
        Math.min(
            players[0].y,
            players[1].y
        );


    const height =
        Math.max(
            0,
            Math.floor(
                (575-highest)/10
            )
        );


    heightValue.textContent =
        height+"m";
}


/* =====================================================
   SKY
===================================================== */

function drawSky(){

    const gradient =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        "#49c5ff"
    );

    gradient.addColorStop(
        .5,
        "#91ddff"
    );

    gradient.addColorStop(
        1,
        "#e8f8ff"
    );


    ctx.fillStyle =
        gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       해
    */

    const sunX =
        W*.82;

    const sunY =
        H*.16;


    const glow =
        ctx.createRadialGradient(
            sunX,
            sunY,
            5,
            sunX,
            sunY,
            120
        );


    glow.addColorStop(
        0,
        "rgba(255,247,170,.75)"
    );

    glow.addColorStop(
        1,
        "rgba(255,247,170,0)"
    );


    ctx.fillStyle =
        glow;

    ctx.beginPath();

    ctx.arc(
        sunX,
        sunY,
        120,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#fff5b0";

    ctx.beginPath();

    ctx.arc(
        sunX,
        sunY,
        35,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =====================================================
   CLOUDS
===================================================== */

const clouds = [];


for(
    let i=0;
    i<28;
    i++
){

    clouds.push({

        x:
            (i*270)%1500-
            250,

        y:
            (i*143)%1200,

        scale:
            .6+
            (i%4)*.2
    });
}


function drawCloud(
    x,
    y,
    scale
){

    ctx.save();

    ctx.fillStyle =
        "rgba(255,255,255,.82)";


    const parts = [

        [-45,10,25],
        [-18,-5,33],
        [18,-9,40],
        [50,7,28]

    ];


    parts.forEach(
        v=>{

            ctx.beginPath();

            ctx.arc(
                x+
                v[0]*scale,
                y+
                v[1]*scale,
                v[2]*scale,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    );


    ctx.restore();
}


function drawClouds(){

    clouds.forEach(
        c=>{

            const y =
                c.y+
                cameraY*.025;

            if(
                y < -150 ||
                y > H+150
            ){

                return;
            }

            drawCloud(
                c.x,
                y,
                c.scale
            );
        }
    );
}


/* =====================================================
   DISTANT MOUNTAINS
===================================================== */

function drawMountains(){

    const base =
        H*.82;


    ctx.fillStyle =
        "rgba(80,160,190,.18)";


    ctx.beginPath();

    ctx.moveTo(
        0,
        base
    );


    for(
        let x=0;
        x<=W;
        x+=100
    ){

        const peak =
            base-
            80-
            Math.sin(x*.018)*
            45;

        ctx.lineTo(
            x,
            peak
        );
    }


    ctx.lineTo(
        W,
        H
    );

    ctx.lineTo(
        0,
        H
    );

    ctx.closePath();

    ctx.fill();
}


/* =====================================================
   PLATFORM
===================================================== */

function drawPlatform(p){

    const y =
        p.y+
        cameraY;


    if(
        y < -100 ||
        y > H+120
    ){

        return;
    }


    /*
       그림자
    */

    ctx.fillStyle =
        "rgba(25,70,75,.22)";


    roundRect(
        ctx,
        p.x+5,
        y+8,
        p.w,
        p.h+10,
        7
    );

    ctx.fill();


    /*
       흙
    */

    ctx.fillStyle =
        p.final
            ? "#9b7147"
            : "#966b45";


    roundRect(
        ctx,
        p.x,
        y,
        p.w,
        p.h+12,
        7
    );

    ctx.fill();


    /*
       잔디
    */

    ctx.fillStyle =
        p.final
            ? "#f1c94b"
            : "#61bd52";


    roundRect(
        ctx,
        p.x,
        y,
        p.w,
        12,
        5
    );

    ctx.fill();


    /*
       밝은 윗부분
    */

    ctx.fillStyle =
        "rgba(255,255,255,.28)";


    ctx.fillRect(
        p.x+8,
        y+3,
        p.w-16,
        3
    );


    /*
       흙 점
    */

    ctx.fillStyle =
        "rgba(80,55,35,.25)";


    const dots =
        Math.floor(
            p.w/60
        );


    for(
        let i=0;
        i<dots;
        i++
    ){

        ctx.beginPath();

        ctx.arc(
            p.x+
            25+
            i*58,
            y+22,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /*
       마지막 발판
    */

    if(p.final){

        ctx.fillStyle =
            "#fff5a8";

        ctx.font =
            "900 13px Arial";

        ctx.textAlign =
            "center";

        ctx.fillText(
            "★ TOGETHER ★",
            p.x+p.w/2,
            y-10
        );
    }
}


/* =====================================================
   ROPE
===================================================== */

function drawRope(){

    const a =
        players[0];

    const b =
        players[1];


    const x1 =
        a.x;

    const y1 =
        a.y+
        cameraY;


    const x2 =
        b.x;

    const y2 =
        b.y+
        cameraY;


    const distance =
        Math.hypot(
            x2-x1,
            y2-y1
        );


    /*
       그림자 줄
    */

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );

    ctx.strokeStyle =
        "rgba(40,55,65,.25)";

    ctx.lineWidth = 9;

    ctx.lineCap =
        "round";

    ctx.stroke();


    /*
       실제 줄
    */

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );


    if(
        distance >
        ROPE_LENGTH*.9
    ){

        ctx.strokeStyle =
            "#ff9d4a";

    }else{

        ctx.strokeStyle =
            "#e3c27d";
    }


    ctx.lineWidth = 6;

    ctx.stroke();


    /*
       줄 하이라이트
    */

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1-1
    );

    ctx.lineTo(
        x2,
        y2-1
    );

    ctx.strokeStyle =
        "rgba(255,255,255,.55)";

    ctx.lineWidth = 1.5;

    ctx.stroke();
}


/* =====================================================
   PLAYER
===================================================== */

function drawPlayer(p){

    const x =
        p.x;

    const y =
        p.y+
        cameraY;


    /*
       그림자
    */

    ctx.fillStyle =
        "rgba(20,70,90,.22)";


    ctx.beginPath();

    ctx.ellipse(
        x,
        y+28,
        19,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       다리
    */

    ctx.fillStyle =
        "#344d62";


    ctx.fillRect(
        x-10,
        y+23,
        8,
        14
    );

    ctx.fillRect(
        x+2,
        y+23,
        8,
        14
    );


    /*
       몸
    */

    ctx.fillStyle =
        p.color;


    roundRect(
        ctx,
        x-13,
        y,
        26,
        25,
        5
    );

    ctx.fill();


    /*
       팔
    */

    ctx.fillStyle =
        "#ffd1a5";


    ctx.fillRect(
        x-19,
        y+4,
        7,
        17
    );

    ctx.fillRect(
        x+12,
        y+4,
        7,
        17
    );


    /*
       머리
    */

    ctx.fillStyle =
        "#ffd1a5";


    roundRect(
        ctx,
        x-14,
        y-26,
        28,
        28,
        6
    );

    ctx.fill();


    /*
       머리카락
    */

    ctx.fillStyle =
        p===players[0]
            ? "#593c2b"
            : "#303238";


    ctx.fillRect(
        x-14,
        y-26,
        28,
        8
    );


    /*
       눈
    */

    ctx.fillStyle =
        "#25323c";


    ctx.beginPath();

    ctx.arc(
        x-5,
        y-11,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x+5,
        y-11,
        2,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       이름
    */

    ctx.fillStyle =
        p.color;

    ctx.font =
        "900 12px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        p.name,
        x,
        y-35
    );
}


/* =====================================================
   ROUND RECT
===================================================== */

function roundRect(
    ctx,
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.lineTo(
        x+w-r,
        y
    );

    ctx.quadraticCurveTo(
        x+w,
        y,
        x+w,
        y+r
    );

    ctx.lineTo(
        x+w,
        y+h-r
    );

    ctx.quadraticCurveTo(
        x+w,
        y+h,
        x+w-r,
        y+h
    );

    ctx.lineTo(
        x+r,
        y+h
    );

    ctx.quadraticCurveTo(
        x,
        y+h,
        x,
        y+h-r
    );

    ctx.lineTo(
        x,
        y+r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x+r,
        y
    );

    ctx.closePath();
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    drawSky();

    drawClouds();

    drawMountains();


    /*
       발판
    */

    platforms.forEach(
        drawPlatform
    );


    /*
       연결 줄
    */

    drawRope();


    /*
       플레이어
    */

    players.forEach(
        drawPlayer
    );
}


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime =
    performance.now();


function loop(now){

    const dt =
        Math.min(
            now-lastTime,
            40
        );

    lastTime =
        now;


    if(
        !resetting &&
        !gameWon
    ){

        updatePlayer(
            players[0]
        );

        updatePlayer(
            players[1]
        );


        /*
           줄 물리
        */

        updateRope();


        /*
           줄 때문에 밀려난 뒤
           다시 발판 위치 보정
        */

        for(
            const p
            of players
        ){

            for(
                const platform
                of platforms
            ){

                const horizontal =
                    p.x+p.radius >
                    platform.x &&
                    p.x-p.radius <
                    platform.x+
                    platform.w;

                if(
                    horizontal &&
                    p.y+p.radius >
                    platform.y &&
                    p.y+p.radius <
                    platform.y+18 &&
                    p.vy>=0
                ){

                    p.y =
                        platform.y-
                        p.radius;

                    p.vy = 0;

                    p.grounded = true;
                }
            }
        }


        updateCamera();

        updateHeight();

        checkFall();

        checkWin();
    }


    draw();


    requestAnimationFrame(
        loop
    );
}


/* =====================================================
   START
===================================================== */

showMessage(
    "🌤️ TOGETHER\n서로 떨어지지 않게 정상까지!",
    1800
);


requestAnimationFrame(
    loop
);

</script>
