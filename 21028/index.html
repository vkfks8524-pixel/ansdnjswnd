
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animal Dash 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;font-family:Arial,"Malgun Gothic",sans-serif;background:#8bdcf7}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:white;text-shadow:0 2px 5px #34415c}
.panel{background:#202746dc;border:2px solid #ffffff40;border-radius:15px;padding:12px 16px}
#top{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:10px}
#progressWrap{width:min(300px,40vw);height:12px;background:#ffffff55;border-radius:20px;margin-top:8px;overflow:hidden}
#progress{height:100%;width:0;background:linear-gradient(90deg,#ffe45e,#ff8b66)}
#message{position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:clamp(25px,5vw,48px);font-weight:1000;text-align:center;white-space:nowrap}
#controls{position:absolute;bottom:15px;left:15px;font-size:13px;line-height:1.8}
#status{position:absolute;bottom:15px;right:15px;font-size:13px;text-align:right}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#182039b8;z-index:5}
#card{width:min(490px,92vw);padding:25px;background:white;color:#252c48;border-radius:24px;text-align:center}
h1{font-size:clamp(28px,5vw,42px);margin:0 0 8px}
#animals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}
.animal{border:2px solid #e4e7f0;border-radius:12px;padding:10px 2px;cursor:pointer;background:#f8f9ff;font-weight:bold}
.animal.selected{border-color:#735bff;background:#eeebff}
.face{display:block;width:34px;height:38px;border-radius:42%;margin:0 auto 7px;position:relative}
.face:before,.face:after{content:"";position:absolute;top:14px;width:5px;height:7px;border-radius:50%;background:#202746}
.face:before{left:8px}.face:after{right:8px}
button{border:0;border-radius:13px;background:#735bff;color:white;font-size:18px;font-weight:bold;padding:14px;width:100%;cursor:pointer}
small{color:#73788a;line-height:1.6}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="hud">
  <div id="top">
    <div class="panel">
      <b>🏁 ANIMAL DASH 3D</b>
      <div id="progressWrap"><div id="progress"></div></div>
      <small id="progressText">출발 준비!</small>
    </div>
    <div class="panel" style="text-align:right">
      <b id="rank">🏆 순위 1위</b><br>
      <small id="timer">00:00</small>
    </div>
  </div>
  <div id="message"></div>
  <div class="panel" id="controls">
    <b>조작 방법</b><br>
    ← → : 좌우 이동<br>
    ↑ 또는 Space : 점프<br>
    <small>점프는 한 번 눌러서 실행!</small>
  </div>
  <div class="panel" id="status">
    체크포인트 <b id="cp">1</b><br>
    낙하 횟수 <b id="falls">0</b>
  </div>
</div>

<div id="overlay">
  <div id="card">
    <h1>ANIMAL DASH</h1>
    <p>장애물을 피하고 결승선까지 달려 봐!</p>
    <small>높은 발판, 점프 구간, 가시 함정과 회전 장애물을 돌파해!</small>
    <div id="animals"></div>
    <button id="start">레이스 시작!</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(() => {
"use strict";

// ==================================================
// 1. THREE.JS 기본 설정
// ==================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8bdcf7);
scene.fog = new THREE.Fog(0x8bdcf7, 75, 190);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x6377a4, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.position.set(-15, 35, -5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -45;
sun.shadow.camera.right = 45;
sun.shadow.camera.top = 90;
sun.shadow.camera.bottom = -30;
scene.add(sun);

const material = color =>
  new THREE.MeshStandardMaterial({color, roughness:0.72});

const M = {
  grass:material(0x64dc9b),
  side:material(0x34b97e),
  pink:material(0xff6fae),
  yellow:material(0xffd94f),
  blue:material(0x62b7ff),
  purple:material(0x9872ff),
  orange:material(0xff974e),
  white:material(0xffffff),
  dark:material(0x3b4164),
  spike:material(0xf4f5ff),
  red:material(0xff465d),
  cyan:material(0x55f0e0)
};

// ==================================================
// 2. 캐릭터 데이터와 3D 동물 생성
// ==================================================
const animals = [
  {name:"곰",color:0xb77a50,ears:"round"},
  {name:"토끼",color:0xf3a5ce,ears:"long"},
  {name:"개구리",color:0x68d982,ears:"frog"},
  {name:"고양이",color:0xffb34d,ears:"cat"},
  {name:"펭귄",color:0x465878,ears:"round"},
  {name:"여우",color:0xff7d43,ears:"cat"},
  {name:"판다",color:0xf4f4f4,ears:"round"},
  {name:"공룡",color:0x55b6a3,ears:"dino"}
];

function makeAnimal(data) {
  const g = new THREE.Group();
  const bodyMat = material(data.color);
  const bellyMat = material(
    data.name === "펭귄" ? 0xffffff : 0xffdfbf
  );
  const black = material(0x20243a);
  const pink = material(0xff9dbd);

  function ball(x,y,z,sx,sy,sz,mat) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(1,18,14), mat
    );
    mesh.position.set(x,y,z);
    mesh.scale.set(sx,sy,sz);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    g.add(mesh);
    return mesh;
  }

  ball(0,.85,0,.53,.66,.43,bodyMat);
  ball(0,.8,.385,.34,.43,.1,bellyMat);
  ball(0,1.58,.02,.53,.52,.48,bodyMat);

  if(data.ears === "long") {
    ball(-.31,2.05,0,.15,.43,.14,bodyMat);
    ball(.31,2.05,0,.15,.43,.14,bodyMat);
    ball(-.31,2.06,.11,.07,.29,.07,pink);
    ball(.31,2.06,.11,.07,.29,.07,pink);
  } else if(data.ears === "frog") {
    ball(-.34,2.02,0,.22,.22,.22,bodyMat);
    ball(.34,2.02,0,.22,.22,.22,bodyMat);
  } else if(data.ears === "cat" || data.ears === "dino") {
    for(const s of [-1,1]) {
      const ear = new THREE.Mesh(
        new THREE.ConeGeometry(.18,.4,4),bodyMat
      );
      ear.position.set(s*.34,2,0);
      ear.rotation.z = -s*.18;
      ear.castShadow = true;
      g.add(ear);
    }
  } else {
    ball(-.35,1.96,0,.19,.19,.16,black);
    ball(.35,1.96,0,.19,.19,.16,black);
  }

  ball(-.19,1.65,.435,.055,.075,.035,black);
  ball(.19,1.65,.435,.055,.075,.035,black);
  ball(0,1.49,.48,.105,.07,.05,black);

  const limbs = [];
  for(const s of [-1,1]) {
    const arm = ball(s*.52,1,.02,.17,.34,.18,bodyMat);
    arm.rotation.z = -s*.25;
    const leg = ball(s*.25,.34,0,.18,.30,.20,bodyMat);
    limbs.push(arm,leg);
  }

  if(data.name === "판다") {
    ball(-.22,1.65,.46,.12,.14,.04,black);
    ball(.22,1.65,.46,.12,.14,.04,black);
  }

  if(data.name === "여우") {
    ball(0,1.28,.48,.25,.17,.07,material(0xffffff));
  }

  g.userData.limbs = limbs;
  return g;
}

const playerGroup = new THREE.Group();
scene.add(playerGroup);

let selectedAnimal = 0;
let player = makeAnimal(animals[selectedAnimal]);
playerGroup.add(player);

function changeAnimal(index) {
  selectedAnimal = index;
  playerGroup.remove(player);
  player = makeAnimal(animals[index]);
  playerGroup.add(player);
}

// ==================================================
// 3. 코스와 장애물
// ==================================================
const platforms = [];
const obstacles = [];
const movingObjects = [];
const checkpoints = [];
const bots = [];

function box(w,h,d,mat,x,y,z,parent=scene) {
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(w,h,d),mat
  );
  mesh.position.set(x,y,z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function platform(x,z,w,d,top,mat=M.grass) {
  const mesh = box(w,.7,d,mat,x,top-.35,z);
  box(w+.2,.22,d+.2,M.side,x,top-.81,z);
  platforms.push({x,z,w,d,top,mesh,ramp:false});
  return mesh;
}

function stairs(x,z,count,length,rise,width,startY,mat) {
  for(let i=0;i<count;i++) {
    platform(
      x,z+i*length,width,length+.25,
      startY+i*rise,mat
    );
  }
}

function ramp(x,z,length,width,yStart,yEnd,mat) {
  const rise = yEnd-yStart;
  const angle = -Math.atan2(rise,length);
  const centerY = (yStart+yEnd)/2-.35;
  const mesh = box(
    width,.7,Math.sqrt(length*length+rise*rise),
    mat,x,centerY,z+length/2
  );
  mesh.rotation.x = angle;

  platforms.push({
    x,z:z+length/2,w:width,d:length,
    top:yStart,ramp:true,yStart,yEnd,
    zStart:z,zEnd:z+length,mesh
  });

  for(const s of [-1,1]) {
    const rail = box(
      .22,.55,length,M.pink,
      x+s*width/2,centerY+.25,z+length/2
    );
    rail.rotation.x = angle;
  }
}

function spikes(x,z,count=5,spacing=1.1,y=0) {
  const width = count*spacing;
  box(width,.18,1.7,M.red,x,y-.09,z);

  for(let i=0;i<count;i++) {
    const cone = new THREE.Mesh(
      new THREE.ConeGeometry(.38,.95,5),M.spike
    );
    cone.position.set(
      x-width/2+spacing*(i+.5),y+.48,z
    );
    cone.castShadow = true;
    scene.add(cone);
    obstacles.push({
      type:"spike",x:cone.position.x,z,
      y,radius:.55,mesh:cone
    });
  }
}

function spinner(x,z,y=0,length=4.5,speed=2.5) {
  const pivot = new THREE.Group();
  pivot.position.set(x,y+1.1,z);
  scene.add(pivot);

  box(.55,.55,.55,M.dark,0,0,0,pivot);
  box(length*2,.34,.6,M.pink,0,0,0,pivot);
  box(.9,.5,.8,M.yellow,0,.1,0,pivot);

  for(const s of [-1,1]) {
    box(.8,.6,.9,M.orange,s*length,0,0,pivot);
  }

  movingObjects.push({type:"spinner",mesh:pivot,speed});
  obstacles.push({type:"spinner",x,z,y,radius:length+1,mesh:pivot});
}

function movingWall(x,z,y=0,range=4,width=2.2) {
  const wall = box(width,2.4,.9,M.purple,x,y+1.2,z);
  movingObjects.push({
    type:"wall",mesh:wall,baseX:x,range,
    speed:1.6,phase:Math.random()*Math.PI*2
  });
  obstacles.push({type:"wall",x,z,y,radius:width/2+.65,mesh:wall});
}

function hammer(x,z,y=0) {
  const pivot = new THREE.Group();
  pivot.position.set(x,y+2,z);
  scene.add(pivot);

  box(.35,.35,.35,M.dark,0,0,0,pivot);
  box(.35,.35,4.5,M.yellow,0,0,2,pivot);
  box(1.5,1.3,1.1,M.pink,0,0,4.3,pivot);

  movingObjects.push({type:"hammer",mesh:pivot,speed:2.2});
  obstacles.push({type:"hammer",x,z,y,radius:4.4,mesh:pivot});
}

function checkpoint(z,x=0,y=0) {
  const g = new THREE.Group();
  scene.add(g);

  box(.35,3.8,.35,M.cyan,-2,1.9,0,g);
  box(.35,3.8,.35,M.cyan,2,1.9,0,g);
  box(4.3,.35,.35,M.yellow,0,3.8,0,g);

  g.position.set(x,y,z);
  checkpoints.push({z,x,y,group:g,active:false});
}

function arch(x,z,y=0,color=0xffffff) {
  const m = material(color);
  box(.35,3.2,.35,m,x-6,y+1.6,z);
  box(.35,3.2,.35,m,x+6,y+1.6,z);
  box(12,.35,.35,m,x,y+3.2,z);
}

function makeCourse() {
  // 출발
  platform(0,5,15,25,0,M.grass);
  arch(0,14,0,0xffd94f);
  checkpoint(12);

  // 회전 장애물과 가시
  platform(0,25,15,15,0,M.blue);
  spinner(0,28,0,4.6,2.3);

  platform(0,40,15,13,0,M.grass);
  spikes(0,40,7,1.3,0);

  platform(0,50,15,10,0,M.yellow);
  movingWall(0,50,0,4,2.5);

  // 높은 계단 오르막
  platform(0,59,14,8,0,M.pink);
  stairs(0,65,7,2.5,.7,11,0,M.purple);
  platform(0,84,13,9,4.2,M.blue);
  checkpoint(84,0,4.2);

  // 높은 플랫폼과 점프 틈
  platform(0,94,12,9,4.2,M.yellow);
  spinner(0,94,4.2,4.3,2.8);
  platform(0,105,12,7,4.2,M.pink);
  platform(0,116,10,7,2.5,M.grass);
  platform(0,126,12,10,1.2,M.blue);
  movingWall(0,126,1.2,3.5,2.2);
  spikes(0,132,5,1.5,1.2);

  // 좁은 다리
  platform(0,140,12,8,1.2,M.orange);
  platform(0,150,4.2,16,1.2,M.purple);

  for(let z=145;z<=156;z+=4) {
    box(.35,3,.35,M.yellow,-2.35,2.7,z);
    box(.35,3,.35,M.yellow,2.35,2.7,z);
  }

  platform(0,162,12,9,1.2,M.grass);
  hammer(0,162,1.2);
  checkpoint(165,0,1.2);

  // 연속 점프 플랫폼
  platform(-3,174,6,8,1.2,M.pink);
  platform(3,184,6,8,2.1,M.yellow);
  platform(-2,194,6,8,3,M.blue);
  platform(2,204,7,9,2,M.purple);

  // 마지막 장애물과 결승선
  platform(0,214,13,9,2,M.grass);
  movingWall(-3,214,2,2.8,2.2);
  movingWall(3,220,2,2.8,2.2);
  spinner(0,225,2,4.6,3);

  platform(0,232,14,12,2,M.yellow);
  arch(0,238,2,0xff5b88);
  platform(0,245,16,15,2,M.grass);

  // 장식 기둥
  for(let i=0;i<32;i++) {
    const z=8+i*7;
    for(const s of [-1,1]) {
      box(1.2,5,1.2,i%2?M.pink:M.blue,s*10,1.5,z);
    }
  }

  // 아래쪽 구름
  const cloudMat=material(0xffffff);
  for(let i=0;i<24;i++) {
    const cloud=new THREE.Mesh(
      new THREE.SphereGeometry(2,12,10),cloudMat
    );
    cloud.position.set(
      (Math.random()-.5)*48,-9-Math.random()*5,
      20+Math.random()*220
    );
    cloud.scale.y=.45;
    scene.add(cloud);
  }
}

// ==================================================
// 4. 입력 처리 - 방향과 점프를 별도로 관리
// ==================================================
const keys = Object.create(null);
let jumpRequested = false;

function normalizeKey(key) {
  return key.toLowerCase();
}

addEventListener("keydown", e => {
  const k=normalizeKey(e.key);

  if(["arrowleft","arrowright","arrowup"," ","arrowdown"].includes(k)) {
    e.preventDefault();
  }

  // 키를 누르기 시작한 순간에만 점프 요청
  if(!keys[k] && ["arrowup","w"," "].includes(k)) {
    jumpRequested=true;
  }

  keys[k]=true;
});

addEventListener("keyup", e => {
  keys[normalizeKey(e.key)]=false;
});

addEventListener("blur", () => {
  for(const k in keys) keys[k]=false;
  jumpRequested=false;
});

// ==================================================
// 5. 게임 상태
// ==================================================
let running=false;
let finished=false;
let playerX=0;
let playerZ=4;
let playerY=0;
let verticalSpeed=0;
let grounded=true;
let checkpointZ=4;
let checkpointX=0;
let checkpointY=0;
let falls=0;
let startTime=0;
let elapsed=0;
let invincible=0;
const finishZ=245;
const clock=new THREE.Clock();

function resetPlayer(z=4,x=0,y=0) {
  playerZ=z;
  playerX=x;
  playerY=y;
  verticalSpeed=0;
  grounded=true;
  invincible=1.2;
  jumpRequested=false;

  playerGroup.position.set(x,y,z);
}

function startGame() {
  document.getElementById("overlay").classList.add("hidden");

  running=true;
  finished=false;
  falls=0;
  elapsed=0;
  checkpointZ=4;
  checkpointX=0;
  checkpointY=0;

  checkpoints.forEach(c=>c.active=false);
  document.getElementById("falls").textContent="0";
  document.getElementById("cp").textContent="1";
  document.getElementById("message").textContent="GO!";

  startTime=performance.now();
  resetPlayer(4,0,0);

  setTimeout(()=>{
    if(running) document.getElementById("message").textContent="";
  },900);
}

document.getElementById("start").onclick=startGame;

// 동물 선택 메뉴
const animalContainer=document.getElementById("animals");

animals.forEach((a,i)=>{
  const el=document.createElement("div");
  el.className="animal"+(i===0?" selected":"");
  el.innerHTML=
    `<span class="face" style="background:#${a.color.toString(16).padStart(6,"0")}"></span>${a.name}`;

  el.onclick=()=>{
    changeAnimal(i);
    [...animalContainer.children].forEach((c,j)=>{
      c.classList.toggle("selected",i===j);
    });
  };

  animalContainer.appendChild(el);
});

// ==================================================
// 6. 발판 높이와 착지 판정
// ==================================================
function platformHeightAt(p,z) {
  if(!p.ramp) return p.top;

  const t=THREE.MathUtils.clamp(
    (z-p.zStart)/(p.zEnd-p.zStart),0,1
  );
  return p.yStart+(p.yEnd-p.yStart)*t;
}

function findGround(x,z) {
  let best=null;

  for(const p of platforms) {
    if(Math.abs(x-p.x)>p.w/2-.12) continue;
    if(Math.abs(z-p.z)>p.d/2-.12) continue;

    const top=platformHeightAt(p,z);
    if(!best || top>best.top) best={top,p};
  }

  return best;
}

function respawn() {
  falls++;
  document.getElementById("falls").textContent=falls;
  resetPlayer(checkpointZ,checkpointX,checkpointY);

  document.getElementById("message").textContent="다시 도전!";
  setTimeout(()=>{
    if(running) document.getElementById("message").textContent="";
  },850);
}

// ==================================================
// 7. 충돌 판정
// ==================================================
function hitObstacle() {
  if(invincible>0) return false;

  for(const o of obstacles) {
    if(Math.abs(playerZ-o.z)>1.2) continue;

    if(o.type==="spike") {
      if(Math.abs(playerX-o.x)<.62 &&
         Math.abs(playerY-o.y)<1.1) return true;
    }

    if(o.type==="wall") {
      if(Math.abs(playerX-o.mesh.position.x)<1.45 &&
         Math.abs(playerY-o.y)<2.25) return true;
    }

    if(o.type==="spinner") {
      const dx=playerX-o.mesh.position.x;
      const dz=playerZ-o.mesh.position.z;

      if(Math.hypot(dx,dz)<2.5 &&
         Math.abs(playerY-o.y)<1.5) return true;
    }

    if(o.type==="hammer") {
      if(Math.abs(playerX-o.mesh.position.x)<1.3 &&
         Math.abs(playerZ-o.mesh.position.z)<1.6 &&
         Math.abs(playerY-o.y)<2.8) return true;
    }
  }

  return false;
}

// ==================================================
// 8. 장애물 움직임과 체크포인트
// ==================================================
function updateMoving(dt) {
  for(const o of movingObjects) {
    if(o.type==="spinner") {
      o.mesh.rotation.y+=dt*o.speed;
    } else if(o.type==="hammer") {
      o.mesh.rotation.x=Math.sin(elapsed*o.speed)*.95;
    } else if(o.type==="wall") {
      o.mesh.position.x=
        o.baseX+Math.sin(elapsed*o.speed+o.phase)*o.range;
    }
  }
}

function updateCheckpoints() {
  for(const c of checkpoints) {
    if(!c.active && playerZ>=c.z-1 && playerZ<c.z+3) {
      c.active=true;
      checkpointZ=c.z-1;
      checkpointX=c.x;
      checkpointY=c.y;

      document.getElementById("cp").textContent=
        checkpoints.filter(x=>x.active).length+1;

      document.getElementById("message").textContent="CHECKPOINT!";

      setTimeout(()=>{
        if(running) document.getElementById("message").textContent="";
      },900);
    }
  }
}

// ==================================================
// 9. 플레이어 업데이트
// ==================================================
function updatePlayer(dt) {
  if(!running) return;

  elapsed=(performance.now()-startTime)/1000;
  invincible=Math.max(0,invincible-dt);

  // 좌우는 화면 기준으로 일관되게 이동한다.
  let direction=0;

  if(keys["arrowleft"] || keys["a"]) direction+=1;
  if(keys["arrowright"] || keys["d"]) direction-=1;

  playerX+=direction*10*dt;
  playerX=THREE.MathUtils.clamp(playerX,-6.5,6.5);

  // 자동 전진
  playerZ+=15*dt;

  // 점프: 키를 누른 순간 한 번만 실행한다.
  if(jumpRequested && grounded) {
    verticalSpeed=12;
    grounded=false;
  }

  // 점프 요청은 매 프레임 소비한다.
  jumpRequested=false;

  // 중력 적용
  verticalSpeed-=25*dt;
  playerY+=verticalSpeed*dt;

  // 실제 발판 위에 내려왔을 때만 착지
  const ground=findGround(playerX,playerZ);

  if(ground && verticalSpeed<=0 &&
     playerY<=ground.top+.12 &&
     playerY>=ground.top-1.2) {
    playerY=ground.top;
    verticalSpeed=0;
    grounded=true;
  } else {
    grounded=false;
  }

  // 낙하하면 마지막 체크포인트로 복귀
  if(playerY < -12) {
    respawn();
  }

  if(playerZ>finishZ+10) {
    finishRace();
    return;
  }

  if(hitObstacle()) respawn();

  updateCheckpoints();

  playerGroup.position.set(playerX,playerY,playerZ);

  // 캐릭터가 이동 방향으로 살짝 기울어짐
  player.rotation.z=THREE.MathUtils.lerp(
    player.rotation.z,-direction*.13,.18
  );

  // 달리기 애니메이션
  const limbs=player.userData.limbs;
  if(grounded) {
    const swing=Math.sin(elapsed*13)*.5;
    limbs[1].rotation.x=swing;
    limbs[3].rotation.x=-swing;
    limbs[0].rotation.x=-swing*.6;
    limbs[2].rotation.x=swing*.6;
  } else {
    limbs[1].rotation.x=.6;
    limbs[3].rotation.x=.6;
  }

  // 카메라의 좌우 기준을 캐릭터와 함께 유지
  const targetCamera=new THREE.Vector3(
    playerX,playerY+5.2,playerZ-10.5
  );

  camera.position.lerp(
    targetCamera,1-Math.pow(.001,dt)
  );

  camera.lookAt(
    playerX,playerY+1.0,playerZ+5.5
  );

  const pct=Math.min(100,Math.max(0,playerZ/finishZ*100));
  document.getElementById("progress").style.width=pct+"%";

  document.getElementById("progressText").textContent=
    Math.floor(pct)+"% 진행 · 결승선까지 "+
    Math.max(0,Math.ceil(finishZ-playerZ))+"m";

  document.getElementById("timer").textContent=
    String(Math.floor(elapsed/60)).padStart(2,"0")+":"+
    String(Math.floor(elapsed%60)).padStart(2,"0");

  const ahead=bots.filter(b=>b.z>playerZ).length;
  document.getElementById("rank").textContent=
    "🏆 순위 "+(ahead+1)+"위";
}

// ==================================================
// 10. 간단한 경쟁 동물
// ==================================================
function makeBots() {
  for(let i=0;i<5;i++) {
    const bot=makeAnimal(animals[(i+1)%animals.length]);
    const group=new THREE.Group();
    group.add(bot);
    scene.add(group);

    bots.push({
      group,bot,z:3-i*2,
      x:[-4,-2,2,4,0][i],
      speed:12.2+Math.random()*2,
      phase:Math.random()*5
    });
  }
}

function updateBots(dt) {
  for(const b of bots) {
    if(finished) continue;

    b.z+=b.speed*dt;
    b.x+=Math.sin(elapsed*1.7+b.phase)*.65*dt;
    b.x=THREE.MathUtils.clamp(b.x,-5,5);

    let y=0;
    const ground=findGround(b.x,b.z);

    if(ground) y=ground.top;
    else if(b.z>=70 && b.z<110) y=4.2;
    else if(b.z>=110 && b.z<170) y=1.2;
    else if(b.z>=170 && b.z<210) y=2;
    else if(b.z>=210) y=2;

    b.group.position.set(b.x,y,b.z);
    b.bot.rotation.z=Math.sin(elapsed*5+b.phase)*.08;
  }
}

// ==================================================
// 11. 결승선
// ==================================================
function finishRace() {
  if(finished) return;

  finished=true;
  running=false;

  document.getElementById("message").textContent="🏁 FINISH!";

  const ahead=bots.filter(b=>b.z>playerZ).length;

  setTimeout(()=>{
    document.getElementById("overlay").classList.remove("hidden");
    document.getElementById("card").innerHTML=`
      <h1>🏆 레이스 종료!</h1>
      <p style="font-size:24px;font-weight:bold">최종 순위 ${ahead+1}위</p>
      <p>완주 시간: ${Math.floor(elapsed/60)}분 ${Math.floor(elapsed%60)}초</p>
      <p>낙하 횟수: ${falls}회</p>
      <button id="again">다시 도전!</button>
    `;
    document.getElementById("again").onclick=()=>location.reload();
  },900);
}

// ==================================================
// 12. 실행 루프
// ==================================================
function animate() {
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.04);

  if(running) {
    elapsed=(performance.now()-startTime)/1000;
  }

  updateMoving(dt);
  updateBots(dt);
  updatePlayer(dt);

  renderer.render(scene,camera);
}

makeCourse();
makeBots();
resetPlayer();

camera.position.set(0,6,-8);
camera.lookAt(0,1,8);

animate();

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
})();
</script>
