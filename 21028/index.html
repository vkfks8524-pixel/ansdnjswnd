<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>몽글몽글 레이스</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(#a98bff, #ffd6f0);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .wrap {
    position: relative;
    width: min(96vw, calc(96vh * 1.6));
    aspect-ratio: 16 / 10;
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
    background: #9bd7ff;
    container-type: inline-size;
  }
  #game { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* 공통 화면 */
  .screen { position: absolute; inset: 0; pointer-events: none; }
  .ui { pointer-events: auto; }
  .title {
    position: absolute; top: 4%; left: 0; right: 0; text-align: center;
    font-size: 5.4cqw; font-weight: 900; color: #fff;
    text-shadow: 0 .45cqw 0 #ff5c93, 0 .9cqw 1.4cqw rgba(0,0,0,.25);
  }
  .subtitle {
    position: absolute; top: 14%; left: 0; right: 0; text-align: center;
    font-size: 1.8cqw; font-weight: 800; color: #fff;
    text-shadow: 0 .2cqw .6cqw rgba(0,0,0,.35);
  }
  .tag { font-weight: 900; font-size: 1.8cqw; color: #fff; padding: .15cqw 1.2cqw; border-radius: 2cqw; }
  .t1 { background: #ff7aa8; }
  .t2 { background: #5aa9ff; }

  /* 동물 고르기 */
  .pick {
    position: absolute; bottom: 5%; transform: translateX(-50%);
    background: rgba(255,255,255,.93); border-radius: 2cqw; padding: 1cqw 1.8cqw;
    display: flex; flex-direction: column; align-items: center; gap: .5cqw;
    border: .4cqw solid; box-shadow: 0 .6cqw 0 rgba(0,0,0,.12);
  }
  .pick.p1 { left: 22%; border-color: #ff7aa8; }
  .pick.p2 { left: 78%; border-color: #5aa9ff; }
  .pick .row { display: flex; align-items: center; gap: .8cqw; }
  .name { font-size: 2.5cqw; font-weight: 900; color: #555; min-width: 9cqw; text-align: center; }
  .arw {
    font-size: 2cqw; width: 4.4cqw; height: 3.6cqw;
    border: none; border-radius: 1.2cqw; background: #ffe08a; color: #8a6a10;
    cursor: pointer; box-shadow: 0 .4cqw 0 #e0b84d;
  }
  .arw:active { transform: translateY(.3cqw); box-shadow: 0 .1cqw 0 #e0b84d; }
  .keys { font-size: 1.3cqw; color: #888; }
  .center-bottom {
    position: absolute; bottom: 7%; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 1cqw; pointer-events: none;
  }
  .big {
    font-size: 2.3cqw; font-weight: 900; padding: 1cqw 2.4cqw;
    border: none; border-radius: 3cqw; background: #ff5c93; color: #fff;
    cursor: pointer; box-shadow: 0 .6cqw 0 #d63d74;
  }
  .big small { font-size: 1.3cqw; opacity: .85; }
  .big:active { transform: translateY(.4cqw); box-shadow: 0 .2cqw 0 #d63d74; }
  .big.sub { background: #5aa9ff; box-shadow: 0 .6cqw 0 #3a7fd0; }
  .big.sub2 { background: #a46bff; box-shadow: 0 .6cqw 0 #7a45d6; }
  .btns { display: flex; gap: 1.6cqw; }

  /* 맵 테마 고르기 */
  #themeScreen {
    pointer-events: auto;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.55) 0 5cqw, transparent 5.2cqw),
      radial-gradient(circle at 18% 22%, rgba(255,255,255,.5) 0 4cqw, transparent 4.2cqw),
      radial-gradient(circle at 88% 14%, rgba(255,255,255,.5) 0 6cqw, transparent 6.2cqw),
      radial-gradient(circle at 80% 92%, rgba(255,255,255,.45) 0 9cqw, transparent 9.2cqw),
      radial-gradient(circle at 20% 95%, rgba(255,255,255,.4) 0 8cqw, transparent 8.2cqw),
      linear-gradient(#9d82ff, #f3b6e6);
  }
  #themeScreen .title { top: 3.5%; font-size: 4.4cqw; text-shadow: 0 .45cqw 0 #8a5cff, 0 .9cqw 1.4cqw rgba(60,20,120,.3); }
  #themeScreen .subtitle { top: 12.5%; font-size: 1.7cqw; text-shadow: 0 .2cqw .5cqw rgba(60,20,120,.4); }
  .back {
    position: absolute; top: 4%; left: 2.5%;
    font-size: 1.7cqw; font-weight: 900; color: #fff; background: #ff5c93;
    border: none; border-radius: 2cqw; padding: .6cqw 1.6cqw; cursor: pointer;
    box-shadow: 0 .4cqw 0 #d63d74;
  }
  .cards {
    position: absolute; top: 22%; left: 2.5%; right: 2.5%;
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.2cqw;
  }
  .card {
    position: relative; background: rgba(255,255,255,.94); border-radius: 1.8cqw; padding: .8cqw;
    display: flex; flex-direction: column; align-items: center; gap: .5cqw;
    border: .35cqw solid #fff; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 .5cqw 0 rgba(80,40,160,.18);
  }
  .card.sel {
    border-color: #ffc83d; transform: translateY(-.8cqw) scale(1.04);
    box-shadow: 0 0 0 .4cqw #ffe58a, 0 1cqw 2cqw rgba(80,40,160,.3);
  }
  .card .new {
    position: absolute; top: -.9cqw; right: -.6cqw; z-index: 2;
    background: #ff4f8b; color: #fff; font-size: 1cqw; font-weight: 900;
    padding: .2cqw .7cqw; border-radius: 1cqw; transform: rotate(8deg);
  }
  .thumb {
    position: relative; width: 100%; aspect-ratio: 1 / 1.05; border-radius: 1.2cqw; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  .thumb .e1 { font-size: 5cqw; filter: drop-shadow(0 .4cqw .4cqw rgba(0,0,0,.2)); }
  .thumb .e2 { position: absolute; top: 8%; left: 8%; font-size: 2.4cqw; }
  .thumb .e3 { position: absolute; bottom: 8%; right: 8%; font-size: 2.4cqw; }
  .cname { font-size: 1.6cqw; font-weight: 900; color: #5a3fa0; }
  .cdesc { font-size: 1.05cqw; color: #888; text-align: center; min-height: 2.8cqw; line-height: 1.35; }
  .csel { font-size: 1.3cqw; font-weight: 900; padding: .35cqw 1.4cqw; border-radius: 1.2cqw; background: #eee; color: #aaa; }
  .card.sel .csel { background: #ffc83d; color: #7a4a00; }
  .thint { font-size: 1.3cqw; color: #fff; font-weight: 700; text-shadow: 0 .1cqw .4cqw rgba(60,20,120,.4); }

  /* 레이스 중 화면 정보 */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  .divider {
    position: absolute; left: 50%; top: 0; bottom: 0; width: .5cqw;
    transform: translateX(-50%); background: #fff; box-shadow: 0 0 1cqw rgba(0,0,0,.25);
  }
  .hudbox {
    position: absolute; top: 2.5%; width: 44%;
    display: flex; align-items: center; gap: 1cqw;
    background: rgba(255,255,255,.9); border-radius: 1.6cqw; padding: .7cqw 1.2cqw;
    box-shadow: 0 .4cqw 0 rgba(0,0,0,.1);
  }
  .hb1 { left: 2%; }
  .hb2 { left: 54%; }
  .hname { font-size: 1.8cqw; font-weight: 900; color: #555; min-width: 6.5cqw; }
  .bar { flex: 1; height: 1.3cqw; background: #eee; border-radius: 1cqw; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 1cqw; }
  .mini {
    position: absolute; left: 50%; top: 18%; bottom: 6%; width: 2.6cqw;
    transform: translateX(-50%); background: rgba(255,255,255,.95); border-radius: 2cqw;
    box-shadow: 0 0 1cqw rgba(0,0,0,.2);
  }
  .mini .flag { position: absolute; top: -3.2cqw; left: 50%; transform: translateX(-50%); font-size: 2.2cqw; }
  .dot {
    position: absolute; left: 50%; width: 2.3cqw; height: 2.3cqw; border-radius: 50%;
    color: #fff; font-size: 1.2cqw; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    border: .25cqw solid #fff; transform: translate(-50%, -50%); top: 100%;
  }
  .d1 { background: #ff7aa8; margin-left: -.5cqw; }
  .d2 { background: #5aa9ff; margin-left: .5cqw; }
  #count {
    position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%);
    font-size: 14cqw; font-weight: 900; color: #fff;
    -webkit-text-stroke: .5cqw #ff5c93; text-shadow: 0 .8cqw 0 rgba(0,0,0,.18);
  }
  #count.pop { animation: pop .6s ease-out; }
  @keyframes pop {
    0% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }
  #banner {
    position: absolute; top: 42%; transform: translate(-50%, -50%);
    background: #fff; border: .5cqw solid; border-radius: 2.5cqw;
    padding: 1.2cqw 3cqw; font-size: 3.6cqw; font-weight: 900; white-space: nowrap;
    box-shadow: 0 .8cqw 0 rgba(0,0,0,.15);
  }

  #errorBox {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5cqw;
    background: #fff0f6; color: #d63d74; font-size: 2.4cqw; font-weight: 800; text-align: center; padding: 4cqw;
  }
  #errorBox .tip { font-size: 1.7cqw; color: #7a4a6a; font-weight: 700; line-height: 1.5; }
  #errorBox small { font-size: 1.3cqw; color: #a0507a; font-weight: 600; word-break: break-all; }

  /* 태블릿용 터치 버튼 (터치 화면에서만 보임) */
  .pad {
    position: absolute; bottom: 3%; display: none;
    grid-template-columns: repeat(3, 5.5cqw); grid-template-rows: repeat(3, 5.5cqw);
    gap: .5cqw; opacity: .8;
  }
  .pad1 { left: 2%; }
  .pad2 { right: 2%; }
  @media (pointer: coarse) { .wrap.racing .pad { display: grid; } }
  .pad button { border: none; border-radius: 1.2cqw; font-size: 2.4cqw; color: #fff; touch-action: none; }
  .pad1 button { background: #ff7aa8; }
  .pad2 button { background: #5aa9ff; }
  .pad button.on { filter: brightness(.8); }
  .pad .u { grid-column: 2; grid-row: 1; }
  .pad .l { grid-column: 1; grid-row: 2; }
  .pad .r { grid-column: 3; grid-row: 2; }
  .pad .d { grid-column: 2; grid-row: 3; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="game"></canvas>

  <!-- 레이스 중 화면 정보 -->
  <div id="hud" class="hidden">
    <div class="divider"></div>
    <div class="hudbox hb1"><span class="tag t1">1P</span><span class="hname" id="hn1"></span><div class="bar"><i id="hbar1" style="background:#ff7aa8"></i></div></div>
    <div class="hudbox hb2"><span class="tag t2">2P</span><span class="hname" id="hn2"></span><div class="bar"><i id="hbar2" style="background:#5aa9ff"></i></div></div>
    <div class="mini"><span class="flag">🏁</span><span class="dot d1" id="md1">1</span><span class="dot d2" id="md2">2</span></div>
    <div id="count"></div>
    <div id="banner" class="hidden"></div>
  </div>

  <!-- 동물 고르기 화면 -->
  <div class="screen" id="selectScreen">
    <div class="title">☁️ 몽글몽글 레이스</div>
    <div class="subtitle">장애물을 피해 먼저 결승선(GOAL)에 도착하면 승리!</div>
    <div class="pick p1 ui">
      <span class="tag t1">1P</span>
      <div class="row">
        <button class="arw" data-p="0" data-d="-1">◀</button>
        <span class="name" id="name1"></span>
        <button class="arw" data-p="0" data-d="1">▶</button>
      </div>
      <div class="keys">고르기 A / D · 이동 W A S D</div>
    </div>
    <div class="pick p2 ui">
      <span class="tag t2">2P</span>
      <div class="row">
        <button class="arw" data-p="1" data-d="-1">◀</button>
        <span class="name" id="name2"></span>
        <button class="arw" data-p="1" data-d="1">▶</button>
      </div>
      <div class="keys">고르기 ← / → · 이동 방향키</div>
    </div>
    <div class="center-bottom">
      <button class="big ui" id="nextBtn">맵 고르기 ▶ <small>(스페이스)</small></button>
    </div>
  </div>

  <!-- 맵 테마 고르기 화면 -->
  <div class="screen hidden" id="themeScreen">
    <button class="back" id="themeBack">◀ 뒤로</button>
    <div class="title">✨ 맵 테마 선택 ✨</div>
    <div class="subtitle">플레이할 맵 테마를 선택해주세요!</div>
    <div class="cards" id="cards"></div>
    <div class="center-bottom">
      <button class="big ui" id="themeStart">시작하기! ▶</button>
      <div class="thint">◀ ▶ 키로 고르기 · 스페이스로 시작 · ESC 뒤로</div>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div class="screen hidden" id="resultScreen">
    <div class="title" id="winText"></div>
    <div class="subtitle" id="winTime"></div>
    <div class="center-bottom">
      <div class="btns ui">
        <button class="big" id="againBtn">다시 하기 <small>(스페이스)</small></button>
        <button class="big sub2" id="mapBtn">맵 바꾸기</button>
        <button class="big sub" id="backBtn">동물 다시 고르기</button>
      </div>
    </div>
  </div>

  <div id="errorBox" class="hidden"></div>

  <!-- 터치 버튼 -->
  <div class="pad pad1">
    <button class="u" data-p="0" data-k="up">▲</button>
    <button class="l" data-p="0" data-k="left">◀</button>
    <button class="r" data-p="0" data-k="right">▶</button>
    <button class="d" data-p="0" data-k="down">▼</button>
  </div>
  <div class="pad pad2">
    <button class="u" data-p="1" data-k="up">▲</button>
    <button class="l" data-p="1" data-k="left">◀</button>
    <button class="r" data-p="1" data-k="right">▶</button>
    <button class="d" data-p="1" data-k="down">▼</button>
  </div>
</div>

<script>
// ===== 문제가 생기면 화면에 알려주기 =====
function showBootError(msg, err, tip) {
  if (window.__bootError) return;
  window.__bootError = true;
  const box = document.getElementById('errorBox');
  let detail = err ? (err.message || String(err)) : '';
  if (detail === 'WEBGL') {
    msg = '이 브라우저에서 3D 그래픽(WebGL)을 사용할 수 없어요.';
    tip = 'Chrome으로 열거나, 브라우저 설정에서 "하드웨어 가속 사용"을 켠 뒤 다시 실행해주세요.';
    detail = '';
  }
  box.innerHTML = '';
  const m = document.createElement('div'); m.textContent = msg; box.appendChild(m);
  if (tip) { const t = document.createElement('div'); t.className = 'tip'; t.textContent = tip; box.appendChild(t); }
  if (detail) { const d = document.createElement('small'); d.textContent = '오류 내용: ' + detail; box.appendChild(d); }
  box.classList.remove('hidden');
  ['selectScreen', 'themeScreen', 'resultScreen', 'hud'].forEach(id => document.getElementById(id).classList.add('hidden'));
}

// 10초가 지나도 게임이 시작되지 않으면 알려주기
setTimeout(function () {
  if (!window.__gameStarted) {
    showBootError('게임이 시작되지 않았어요.', null,
      '코드가 끝까지 복사되지 않았을 수 있어요. 코드 블록의 복사 버튼으로 전체를 다시 복사해 저장하거나, 인터넷 연결을 확인한 뒤 새로고침 해주세요.');
  }
}, 10000);

// ===== three.js 불러오기 (안 되면 다른 주소에서 다시 시도) =====
const THREE_URLS = [
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js',
];
function loadThree(i) {
  if (window.THREE) { startGame(); return; }
  if (i >= THREE_URLS.length) {
    showBootError('3D 그래픽 도구(three.js)를 불러오지 못했어요.', null, '인터넷에 연결된 상태에서 새로고침 해주세요.');
    return;
  }
  const s = document.createElement('script');
  s.src = THREE_URLS[i];
  s.onload = () => { if (window.THREE) startGame(); else loadThree(i + 1); };
  s.onerror = () => loadThree(i + 1);
  document.head.appendChild(s);
}
function startGame() {
  try { gameMain(); }
  catch (e) { showBootError('게임을 시작하는 중 문제가 생겼어요.', e, '아래 오류 내용을 알려주세요.'); }
}

function gameMain() {

// ===== 기본 설정 (게임 규칙은 그대로예요) =====
const wrap = document.getElementById('wrap');
const canvas = document.getElementById('game');

const COURSE_W = 400;      // 코스 너비
const COURSE_LEN = 5200;   // 코스 전체 길이
const START_Y = 5050;      // 출발 위치
const FINISH_Y = 150;      // 결승선 위치
const R = 20;              // 동물 크기(반지름)
const SPEED = 230;         // 달리는 속도
const U = 20;              // 게임 숫자 → 3D 크기로 바꾸는 비율
const PCOL = ['#ff7aa8', '#5aa9ff'];

const ANIMALS = [
  { id: 'rabbit', name: '토끼',   color: '#fdfdfd', belly: '#ffe4ee', arm: '#fdfdfd', foot: '#ffd0de' },
  { id: 'cat',    name: '고양이', color: '#ffb347', belly: '#fff1d6', arm: '#ffb347', foot: '#ffe0b0' },
  { id: 'bear',   name: '곰',     color: '#b97a4c', belly: '#f0cfa8', arm: '#b97a4c', foot: '#8a5634' },
  { id: 'pig',    name: '돼지',   color: '#ffb8cc', belly: '#ffd9e4', arm: '#ffb8cc', foot: '#ff8fb1' },
  { id: 'chick',  name: '병아리', color: '#ffe14d', belly: '#fff6b8', arm: '#ffe14d', foot: '#ff9f43' },
  { id: 'panda',  name: '판다',   color: '#fbfbfb', belly: '#ffffff', arm: '#2b2b2b', foot: '#2b2b2b' },
];

// ===== 맵 테마 =====
const THEMES = [
  { id: 'cloud', name: '뭉글 구름', desc: '폭신폭신 구름 위를 달려요!', art: ['☁️', '🌈', '🎈'], card: 'linear-gradient(#a8dcff, #ffd9f0)',
    sky: ['#79c8ff', '#ffe1f2'], fog: '#ffe1f2', hemi: ['#ffffff', '#c9b5ff', 0.75], sunI: 0.85,
    floor: ['#45bdff', '#62c9ff'], seam: '#bfe9ff', goal: '#ff9fd0', skirt: '#2f8fd6', rail: ['#ffb43d', '#ff7aa8'],
    below: '#fff2fa', belowE: '#ffd6ef', belowY: -14,
    obsA: '#ff6fa5', obsB: '#7c6cff', stripe: '#ffffff', spin: '#ffb43d', spinPost: '#ff6fa5', bump: '#a77bff', bumpTop: '#ffe14d', arch: '#ff6fa5' },
  { id: 'desert', name: '사막 피라미드', desc: '뜨거운 태양 아래 위험한 유적지!', art: ['🏜️', '☀️', '🐫'], card: 'linear-gradient(#ffe29a, #ff9e5e)',
    sky: ['#6fc2ff', '#ffe3b3'], fog: '#ffe3b3', hemi: ['#fff5e0', '#d9a066', 0.75], sunI: 0.95,
    floor: ['#f2c46b', '#f7d38c'], seam: '#fff0c9', goal: '#ffb36b', skirt: '#c88a3c', rail: ['#ff8a3d', '#35c2d6'],

function animateAnimal(m, t, mode, dt) {
  const k = 1 - Math.exp(-dt * 12);
  let by = 0, rx = 0, rz = 0, fl = 0, fr = 0, flY = 0, frY = 0, al = 0, ar = 0, raise = 0;
  if (mode === 'run') {
    const s = Math.sin(t * 14);
    by = Math.abs(Math.cos(t * 14)) * 0.2;
    rx = -0.18;
    fl = s * 0.3; fr = -s * 0.3;
    flY = Math.max(0, s) * 0.15; frY = Math.max(0, -s) * 0.15;
    al = -s * 1.1; ar = s * 1.1;
  } else if (mode === 'dizzy') {
    rz = Math.sin(t * 14) * 0.22; rx = 0.15;
    raise = 0.8 + Math.sin(t * 10) * 0.3;
  } else if (mode === 'cheer') {
    by = Math.abs(Math.sin(t * 6)) * 0.6;
    raise = 2.5 + Math.sin(t * 12) * 0.3;
  } else if (mode === 'hop') {
    by = Math.abs(Math.sin(t * 3.5)) * 0.35;
    raise = 0.6 + Math.sin(t * 7) * 0.4;
  } else {
    by = Math.abs(Math.sin(t * 2.5)) * 0.04;
  }
  m.body.position.y = by;
  m.body.rotation.x += (rx - m.body.rotation.x) * k;
  m.body.rotation.z += (rz - m.body.rotation.z) * k;
  m.footL.position.z = fl; m.footL.position.y = 0.2 + flY;
  m.footR.position.z = fr; m.footR.position.y = 0.2 + frY;
  m.armL.rotation.x += (al - m.armL.rotation.x) * k;
  m.armR.rotation.x += (ar - m.armR.rotation.x) * k;
  m.armL.rotation.z += (-raise - m.armL.rotation.z) * k;
  m.armR.rotation.z += (raise - m.armR.rotation.z) * k;
  m.stars.visible = (mode === 'dizzy');
  m.stars.rotation.y = t * 6;
}

    const seg = part(CYL, i % 2 ? '#b07a4c' : '#9a6638', i * 0.18, (i + 0.5) * h / 5, 0, 0.38 - i * 0.03, h / 5 + 0.05, 0.38 - i * 0.03);
    seg.rotation.z = -0.06 * i;
    p.add(seg);
  }
  const top = new THREE.Group();
  top.position.set(0.9, h, 0);
  for (let k = 0; k < 6; k++) {
    const piv = new THREE.Group();
    piv.rotation.y = k * Math.PI / 3;
    const leaf = part(SPH, k % 2 ? '#3fae5a' : '#55c26c', 0, -0.4, 1.9, 0.55, 0.12, 2.1);
    leaf.rotation.x = 0.35;
    piv.add(leaf);
    top.add(piv);
  }
  top.add(part(SPH, '#7a4a28', 0, -0.4, 0.4, 0.3));
  p.add(top);
  g.add(p);
}
function addTree(g, x, base, z, h) {
  g.add(part(CYL, '#7a4a28', x, base + h / 2, z, 0.6, h, 0.6));
  g.add(part(SPH, '#3fae5a', x, base + h + 0.5, z, 2.6));
  g.add(part(SPH, '#55c26c', x + 1.6, base + h - 0.4, z + 0.6, 1.9));
  g.add(part(SPH, '#2f9a4a', x - 1.5, base + h - 0.2, z - 0.5, 2.0));
}
function addCoral(g, x, base, z, rand) {
  g.add(part(SPH, '#ffe2a8', x, base, z, 3.2, 0.9, 3.2));
  const cols = ['#ff7f9f', '#ff9f6b', '#b28dff', '#ffd166', '#ff5e7e'];
  for (let k = 0; k < 6; k++) {
    const c = cols[Math.floor(rand() * cols.length)];
    const dx = (rand() - 0.5) * 3.6, dz = (rand() - 0.5) * 3.6, h = 1.5 + rand() * 3;
    const br = part(CYL, c, x + dx, base + h / 2, z + dz, 0.3, h, 0.3);
    br.rotation.z = (rand() - 0.5) * 0.5;
    g.add(br);
    g.add(part(SPH, c, x + dx + Math.sin(br.rotation.z) * -h / 2, base + h, z + dz, 0.55));
  }
}
function addSeaweed(g, x, base, z, h) {
  const w = new THREE.Group();
  w.position.set(x, base, z);
  for (let i = 0; i < 5; i++) w.add(part(SPH, i % 2 ? '#3ccf7a' : '#2fb36a', 0, i * h / 5 + 0.6, 0, 0.35, h / 7, 0.35));

}
function addLollipop(g, x, base, z, h, color) {
  const l = new THREE.Group();
  l.position.set(x, base, z);
  l.add(part(CYL, '#ffffff', 0, h / 2, 0, 0.22, h, 0.22));
  const disc = part(CYL, color, 0, h + 1.6, 0, 1.8, 0.5, 1.8); disc.rotation.x = Math.PI / 2; l.add(disc);
  for (const s of [-1, 1]) {
    const sw = new THREE.Mesh(TORUS_RING, M('#ffffff'));
    sw.position.set(0, h + 1.6, s * 0.26); sw.scale.setScalar(1.1);

  }
  g.add(l);
  anim(l, 'rot', 0.6);
}
function addCupcake(g, x, base, z, s) {
  g.add(part(CYL, '#ffb3c7', x, base + 1 * s, z, 1.4 * s, 2 * s, 1.4 * s));
  g.add(part(SPH, '#fff3f8', x, base + 2.4 * s, z, 1.6 * s, 1.1 * s, 1.6 * s));
  g.add(part(SPH, '#ff4f6b', x, base + 3.6 * s, z, 0.4 * s));
}
function addPlanet(g, x, y, z, r, c1, c2, ring) {
  const p = new THREE.Group();
  p.position.set(x, y, z);
  const ball = new THREE.Mesh(SPH, M(c1, 0.6));
  ball.scale.setScalar(r);

  if (ring) {

    rg.scale.set(r * 1.7, r * 1.7, r * 1.5);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#ffd6f0', 70, 200);
const hemi = new THREE.HemisphereLight('#ffffff', '#b9a5ff', 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffffff', 0.85);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
sun.shadow.camera.top = 28; sun.shadow.camera.bottom = -28;

const stage = new THREE.Group();
scene.add(stage);
let stageThemeId = null;
let stageTrash = [];

function clearStage() {
  while (stage.children.length) stage.remove(stage.children[0]);
  stageTrash.forEach(x => x.dispose());
  stageTrash = [];
  decoAnims = [];
}

function buildStage(th) {
  clearStage();
  stageThemeId = th.id;
  scene.background = skyTexture(th);
  scene.fog.color.set(th.fog);
  hemi.color.set(th.hemi[0]); hemi.groundColor.set(th.hemi[1]); hemi.intensity = th.hemi[2];
  sun.intensity = th.sunI;

  // 폭신한 에어매트 바닥
  for (let y = 0; y < COURSE_LEN; y += 80) {
    let col = th.floor[Math.floor(y / 80) % 2];
    if (y + 80 <= FINISH_Y - 30) col = th.goal;
    const f = part(BOX, col, 0, -0.75, toZ(y + 40), COURSE_W / U, 1.5, 80 / U);
    f.castShadow = false;
    stage.add(f);
    const seam = part(BOX, th.seam, 0, 0.005, toZ(y), COURSE_W / U - 0.4, 0.02, 0.12);
    seam.castShadow = false;
    stage.add(seam);
  }
  const skirt = part(BOX, th.skirt, 0, -2.6, toZ(COURSE_LEN / 2), COURSE_W / U + 1.2, 2.4, COURSE_LEN / U);
  skirt.castShadow = false;
  stage.add(skirt);

  // 양옆 통통한 튜브 난간
  for (let y = 0; y < COURSE_LEN; y += 160) {
    const col = th.rail[Math.floor(y / 160) % 2];
    for (const s of [-1, 1]) {
      const rail = part(CYL, col, s * 10.9, 0.7, toZ(y + 80), 0.9, 8, 0.9);
      rail.rotation.x = Math.PI / 2;
      stage.add(rail);
    }
  }
  for (const s of [-1, 1]) {
    stage.add(part(SPH, th.rail[0], s * 10.9, 0.7, toZ(COURSE_LEN), 0.9));
    stage.add(part(SPH, th.rail[0], s * 10.9, 0.7, toZ(0), 0.9));
  }

  // 코스를 받치는 기둥
  if (th.belowY > -40) {
    for (let y = 300; y < COURSE_LEN; y += 600) {
      for (const s of [-1, 1]) {
        const h = -3.8 - th.belowY;
        stage.add(part(CYL, th.skirt, s * 7.5, -3.8 - h / 2, toZ(y), 0.8, h, 0.8));
      }
    }
  }

  // 아래쪽 바닥 (물, 모래, 구름 바다 등)
  if (th.below) {
    const mat = new THREE.MeshStandardMaterial({ color: th.below, roughness: 0.35, emissive: th.belowE, emissiveIntensity: 0.25 });
    stageTrash.push(mat);
    const floorBelow = new THREE.Mesh(PLANE, mat);
    floorBelow.rotation.x = -Math.PI / 2;
    floorBelow.scale.set(900, 900, 1);
    floorBelow.position.set(0, th.belowY, -120);
    floorBelow.receiveShadow = true;
    stage.add(floorBelow);
  }

  // 출발선과 출발 아치
  const sl = part(BOX, '#ffffff', 0, 0.02, toZ(START_Y + 34), COURSE_W / U, 0.04, 0.4);
  sl.castShadow = false;
  stage.add(sl);
  const az = toZ(START_Y + 60);
  for (const s of [-1, 1]) {
    stage.add(part(CYL, th.arch, s * 11.8, 3.5, az, 0.8, 7, 0.8));
    stage.add(part(SPH, '#ffffff', s * 11.8, 7.3, az, 1.0));
  }
  const beam = part(CYL, th.arch, 0, 7.6, az, 0.8, 23.6, 0.8);
  beam.rotation.z = Math.PI / 2;
  stage.add(beam);
  const sb = new THREE.Mesh(PLANE, bannerMat('START', th.arch));
  sb.scale.set(9, 2.25, 1); sb.position.set(0, 7.6, az + 0.85);
  stage.add(sb);

  // 결승선과 무지개 골인 아치
  const gz = toZ(FINISH_Y - 15);
  const finish = new THREE.Mesh(PLANE, checkerMat);
  finish.scale.set(COURSE_W / U, 1.5, 1);
  finish.rotation.x = -Math.PI / 2;
  finish.position.set(0, 0.02, gz);
  finish.receiveShadow = true;
  stage.add(finish);
  addRainbow(stage, 0, 0, gz, 1, 0);
  const rand0 = makeRandom(99);
  addCloud(stage, -11.5, 0.8, gz, 1.1, rand0, '#ffffff');
  addCloud(stage, 11.5, 0.8, gz, 1.1, rand0, '#ffffff');
  const gb = new THREE.Mesh(PLANE, bannerMat('GOAL', th.arch));
  gb.scale.set(8, 2, 1); gb.position.set(0, 6.6, gz + 0.5);
  stage.add(gb);
  for (const s of [-1, 1]) {
    addBalloon(stage, s * 14, 9, gz - 4, s > 0 ? '#ff6fa5' : '#5ec4ff');
  }

  // 테마별 장식
  buildDeco(th);
}

function sideZ(i, n, rand) { return 18 - (i / n) * 290 - rand() * 4; }

function buildDeco(th) {
  const rand = makeRandom(1234);
  const B = th.belowY;
  if (th.id === 'cloud') {
    for (let i = 0; i < 44; i++) {
      const s = i % 2 ? 1 : -1;
      addCloud(stage, s * (16 + rand() * 34), -4 + rand() * 26, sideZ(i, 44, rand), 1.2 + rand() * 1.6, rand, rand() < 0.3 ? '#ffe3f4' : '#ffffff');
    }
    for (let i = 0; i < 70; i++) {
      const m = new THREE.Mesh(SPH, M(rand() < 0.4 ? '#ffe0f2' : '#ffffff', 1));
      m.scale.setScalar(5 + rand() * 6);
      m.position.set((rand() - 0.5) * 140, B + 1, 30 - rand() * 330);
      stage.add(m);
    }
    for (let i = 0; i < 14; i++) {
      const s = i % 2 ? 1 : -1;
      addBalloon(stage, s * (18 + rand() * 20), 8 + rand() * 12, sideZ(i, 14, rand), CANDY[i % 6]);
    }
    for (let i = 0; i < 5; i++) {
      const s = i % 2 ? 1 : -1;
      addRainbow(stage, s * (34 + rand() * 10), B, -20 - i * 55, 1.3, s * 0.6);
    }
  } else if (th.id === 'desert') {
    for (let i = 0; i < 18; i++) {
      const s = i % 2 ? 1 : -1, h = 14 + rand() * 18;
      const p = part(PYR, rand() < 0.5 ? '#e3b25f' : '#d49d47', s * (36 + rand() * 30), B + h / 2, sideZ(i, 18, rand), h * 0.6, h, h * 0.6);
      p.rotation.y = Math.PI / 4;
      stage.add(p);
    }
    for (let i = 0; i < 34; i++) {
      const s = i % 2 ? 1 : -1;
      addCactus(stage, s * (14 + rand() * 12), B, sideZ(i, 34, rand), 3 + rand() * 4);
    }
    for (let i = 0; i < 26; i++) {
      stage.add(part(SPH, '#f0c878', (rand() - 0.5) * 120, B, 20 - rand() * 300, 6 + rand() * 6, 1.5 + rand() * 1.5, 6 + rand() * 6));
    }
    for (let i = 0; i < 6; i++) {
      const s = i % 2 ? 1 : -1;
      addPalm(stage, s * (13 + rand() * 4), B, sideZ(i, 6, rand) - 20, 8 + rand() * 3);
    }
    const sunBall = new THREE.Mesh(SPH, MB('#ffe066'));
    sunBall.scale.setScalar(9); sunBall.position.set(50, 70, -200);
    stage.add(sunBall);
  } else if (th.id === 'ocean') {
    for (let i = 0; i < 20; i++) {
      const s = i % 2 ? 1 : -1;
      addCoral(stage, s * (16 + rand() * 18), B, sideZ(i, 20, rand), rand);
    }
    for (let i = 0; i < 40; i++) {
      const s = i % 2 ? 1 : -1;
      addSeaweed(stage, s * (13 + rand() * 22), B, sideZ(i, 40, rand), 3 + rand() * 4);
    }
    for (let i = 0; i < 50; i++) {
      const b = new THREE.Mesh(SPH, bubbleMat);
      b.scale.setScalar(0.3 + rand() * 0.6);
      b.position.set((rand() < 0.5 ? -1 : 1) * (12 + rand() * 25), B + rand() * 20, 20 - rand() * 300);
      b.userData.base = B;
      stage.add(b);
      decoAnims.push({ o: b, kind: 'rise', speed: 1.5 + rand() * 2, amp: 22, base: B, phase: 0 });
    }
    for (let i = 0; i < 8; i++) {
      const s = i % 2 ? 1 : -1;
      const shell = part(SPH, i % 3 ? '#ffd1dc' : '#fff1b8', s * (14 + rand() * 6), B + 0.6, sideZ(i, 8, rand), 1.2, 0.6, 1.0);
      stage.add(shell);
    }
  } else if (th.id === 'jungle') {
    for (let i = 0; i < 40; i++) {
      const s = i % 2 ? 1 : -1;
      if (rand() < 0.5) addTree(stage, s * (15 + rand() * 25), B, sideZ(i, 40, rand), 8 + rand() * 8);
      else addPalm(stage, s * (14 + rand() * 20), B, sideZ(i, 40, rand), 9 + rand() * 6);
    }
    for (let i = 0; i < 24; i++) {
      const s = i % 2 ? 1 : -1;
      const r = part(ICO, rand() < 0.5 ? '#9aa0a6' : '#7d8a7a', s * (13 + rand() * 30), B + 0.5, sideZ(i, 24, rand), 1.5 + rand() * 2);
      r.rotation.set(rand() * 3, rand() * 3, 0);

    for (let i = 0; i < 16; i++) {
      const s = i % 2 ? 1 : -1, x = s * (13 + rand() * 8), z = sideZ(i, 16, rand);
      stage.add(part(CYL, '#fff3e0', x, B + 1, z, 0.4, 2, 0.4));
      stage.add(part(SPH, rand() < 0.5 ? '#ff5e7e' : '#ffb43d', x, B + 2.1, z, 1.3, 0.7, 1.3));
    }
  } else if (th.id === 'space') {
    const pos = [];
    for (let i = 0; i < 900; i++) {
      const a = rand() * Math.PI * 2, b = (rand() - 0.5) * Math.PI, r = 170 + rand() * 60;
      pos.push(Math.cos(a) * Math.cos(b) * r, Math.sin(b) * r, -120 + Math.sin(a) * Math.cos(b) * r);

    const sg = new THREE.BufferGeometry();
    sg.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    stageTrash.push(sg);
    stage.add(new THREE.Points(sg, starPointsMat));
    const pc = [['#ff9f6b', '#ffe14d'], ['#7ad7ff', '#ffffff'], ['#b28dff', '#ff4fd8'], ['#7ee8a2', '#3df2ff'], ['#ff6fa5', '#ffd166'], ['#ffd166', '#ff9f6b']];
    for (let i = 0; i < 8; i++) {
      const s = i % 2 ? 1 : -1;
      addPlanet(stage, s * (45 + rand() * 40), -15 + rand() * 50, sideZ(i, 8, rand), 5 + rand() * 9, pc[i % 6][0], pc[i % 6][1], rand() < 0.6);
    }
    for (let i = 0; i < 36; i++) {

    for (let i = 0; i < 6; i++) {

      ring.position.set(0, 1.5, -20 - i * 42);

  } else if (th.id === 'candy') {
    for (let i = 0; i < 30; i++) {
      const s = i % 2 ? 1 : -1;
      addCandyPillar(stage, s * (16 + rand() * 24), sideZ(i, 30, rand), 8 + rand() * 12, 0.8 + rand() * 1.1, CANDY[Math.floor(rand() * 6)], CANDY[Math.floor(rand() * 6)], B);
    }
    for (let i = 0; i < 16; i++) {

      addLollipop(stage, s * (14 + rand() * 14), B, sideZ(i, 16, rand), 6 + rand() * 6, CANDY[i % 6]);
    }
    for (let i = 0; i < 14; i++) {
      const s = i % 2 ? 1 : -1;
      addCupcake(stage, s * (15 + rand() * 20), B, sideZ(i, 14, rand), 1.2 + rand());

    for (let i = 0; i < 14; i++) {

      const d = addDonut(stage, s * (18 + rand() * 20), 8 + rand() * 12, sideZ(i, 14, rand), 1.5 + rand() * 1.5, CANDY[i % 6]);

}

// ===== 장애물 3D 모양 (풍선처럼 둥글둥글) =====
const obsGroup = new THREE.Group();
scene.add(obsGroup);

// 위에서 보면 알약 모양인 벽 (둥근 끝 + 둥근 윗면)
function pillWall(color, stripe, w, d, h) {
  const g = new THREE.Group();
  const r = d / 2;
  const bw = Math.max(0.01, w - d);
  g.add(part(BOX, color, 0, h / 2, 0, bw, h, d));
  const top = part(CYL, color, 0, h, 0, r, bw, r); top.rotation.z = Math.PI / 2; g.add(top);
  for (const s of [-1, 1]) {
    g.add(part(CYL, color, s * bw / 2, h / 2, 0, r, h, r));
    g.add(part(SPH, color, s * bw / 2, h, 0, r));
  }
  g.add(part(BOX, stripe, 0, h * 0.55, 0, bw, 0.35, d + 0.04));
  for (const s of [-1, 1]) g.add(part(CYL, stripe, s * bw / 2, h * 0.55, 0, r + 0.02, 0.35, r + 0.02));
  return g;
}

function buildObstacleMeshes(th) {
  while (obsGroup.children.length) obsGroup.remove(obsGroup.children[0]);
  for (const o of obstacles) {
    if (o.type === 'rect') {
      const g = pillWall(th.obsA, th.stripe, o.w / U, o.h / U, 2.2);
      g.position.set(toX(o.x + o.w / 2), 0, toZ(o.y + o.h / 2));
      obsGroup.add(g);
    } else if (o.type === 'slider') {
      const z = toZ(o.y + o.h / 2);
      const track = part(BOX, th.seam, 0, 0.01, z, COURSE_W / U - 0.5, 0.04, 0.5);
      track.castShadow = false;
      obsGroup.add(track);
      const g = pillWall(th.obsB, th.stripe, o.w / U, o.h / U, 2.0);
      g.position.set(0, 0, z);
      obsGroup.add(g);
      o.mesh = g;
    } else if (o.type === 'spinner') {
      const x = toX(o.cx), z = toZ(o.cy);
      obsGroup.add(part(CYL, th.spinPost, x, 1.6, z, 0.9, 3.2, 0.9));
      obsGroup.add(part(SPH, th.stripe, x, 3.2, z, 0.95, 0.55, 0.95));
      const arm = new THREE.Group();
      arm.position.set(x, 1.2, z);
      const bar = part(CYL, th.spin, 0, 0, 0, 0.48, o.len * 2 / U, 0.48);
      bar.rotation.z = Math.PI / 2;
      arm.add(bar);
      for (let k = -6; k <= 6; k += 2) {
        if (k === 0) continue;
        const st = part(CYL, th.stripe, k, 0, 0, 0.5, 0.3, 0.5);
        st.rotation.z = Math.PI / 2;
        arm.add(st);
      }
      for (const s of [-1, 1]) arm.add(part(SPH, th.spinPost, s * o.len / U, 0, 0, 0.62));
      obsGroup.add(arm);
      o.mesh = arm;
    } else if (o.type === 'bumper') {
      const g = new THREE.Group();
      g.position.set(toX(o.x), 0, toZ(o.y));
      const r = o.r / U;
      g.add(part(CYL, th.bump, 0, 0.4, 0, r, 0.8, r));
      g.add(part(SPH, th.bump, 0, 0.9, 0, r, 0.75, r));
      const ring = new THREE.Mesh(TORUS_RING, M(th.bumpTop));
      ring.rotation.x = Math.PI / 2; ring.position.y = 0.85; ring.scale.setScalar(r);
      g.add(ring);
      g.add(part(SPH, th.bumpTop, 0, 1.62, 0, r * 0.35, r * 0.2, r * 0.35));
      obsGroup.add(g);
      o.mesh = g;
    }
  }
}

function updateObstacleMeshes() {
  for (const o of obstacles) {
    if (!o.mesh) continue;
    if (o.type === 'slider') o.mesh.position.x = toX(sliderX(o) + o.w / 2);
    else if (o.type === 'spinner') o.mesh.rotation.y = -(worldT * o.speed + o.phase);
    else if (o.type === 'bumper') {
      const s = 1 + Math.max(0, o.hit) * 1.5;
      o.mesh.scale.set(s, 1 / Math.sqrt(s), s);
    }
  }
}

const confetti = [];
const confGeo = new THREE.PlaneGeometry(0.28, 0.42);
const confMats = CANDY.map(c => new THREE.MeshBasicMaterial({ color: c, side: THREE.DoubleSide }));
function burstConfetti(x, z) {
  for (let i = 0; i < 150; i++) {
    const m = new THREE.Mesh(confGeo, confMats[i % confMats.length]);
    m.position.set(x + (Math.random() - 0.5) * 3, 3 + Math.random() * 2, z + (Math.random() - 0.5) * 3);
    m.userData = {
      vx: (Math.random() - 0.5) * 14, vy: 8 + Math.random() * 10, vz: (Math.random() - 0.5) * 14,
      sx: Math.random() * 10, sy: Math.random() * 10, life: 3.5,
    };
    scene.add(m);
    confetti.push(m);
  }
}
function updateConfetti(dt) {
  for (let i = confetti.length - 1; i >= 0; i--) {
    const m = confetti[i], d = m.userData;
    d.vy -= 14 * dt;
    d.vx *= Math.pow(0.4, dt); d.vz *= Math.pow(0.4, dt);
    if (d.vy < -3) d.vy = -3;
    m.position.x += d.vx * dt; m.position.y += d.vy * dt; m.position.z += d.vz * dt;
    m.rotation.x += d.sx * dt; m.rotation.y += d.sy * dt;
    d.life -= dt;
    if (d.life <= 0) { scene.remove(m); confetti.splice(i, 1); }
  }
}
function clearConfetti() { confetti.forEach(m => scene.remove(m)); confetti.length = 0; }

// ===== 동물 고르기 / 결과 화면 무대 =====
const lobby = new THREE.Scene();
lobby.fog = new THREE.Fog('#ffd6f0', 30, 90);
lobby.add(new THREE.HemisphereLight('#ffffff', '#b9a5ff', 0.8));
const lobbySun = new THREE.DirectionalLight('#ffffff', 0.8);
lobbySun.position.set(5, 12, 8);
lobbySun.castShadow = true;
lobbySun.shadow.mapSize.set(1024, 1024);
lobbySun.shadow.camera.left = -8; lobbySun.shadow.camera.right = 8;
lobbySun.shadow.camera.top = 8; lobbySun.shadow.camera.bottom = -8;
lobbySun.shadow.bias = -0.0006;
lobby.add(lobbySun);
const lobbyCam = new THREE.PerspectiveCamera(38, 1.6, 0.1, 300);
lobbyCam.position.set(0, 2.8, 10.5);
lobbyCam.lookAt(0, 1.0, 0);

const lobbyGroundMat = new THREE.MeshStandardMaterial({ color: '#62c9ff', roughness: 0.45 });
const ground = new THREE.Mesh(CYL, lobbyGroundMat);
ground.scale.set(40, 1, 40); ground.position.y = -0.5; ground.receiveShadow = true;
lobby.add(ground);
const pedestals = [part(CYL, '#ff9cc0', -2.8, 0.35, 0, 1.5, 0.7, 1.5), part(CYL, '#8cc6ff', 2.8, 0.35, 0, 1.5, 0.7, 1.5)];
pedestals.forEach(p => lobby.add(p));
const goldPed = part(CYL, '#ffd166', 0, 0.6, 0, 1.7, 1.2, 1.7);
goldPed.visible = false;
lobby.add(goldPed);
const lobbyAnims = [];
(function () {
  const rand = makeRandom(4242);
  addRainbow(lobby, 0, -0.5, -16, 1.4, 0);
  for (let i = 0; i < 8; i++) addCloud(lobby, -26 + i * 7.5, 2 + rand() * 9, -24 - rand() * 6, 1.2 + rand(), rand, i % 3 ? '#ffffff' : '#ffe3f4');
  for (let i = 0; i < 4; i++) {
    const d = addDonut(lobby, (i < 2 ? -1 : 1) * (8 + (i % 2) * 4), 5.5 + (i % 2) * 2, -10 - (i % 2) * 4, 1.2, CANDY[i]);
    lobbyAnims.push({ o: d, kind: 'spin', speed: 0.5, amp: 0, base: d.position.y, phase: 0 });
  }
})();
function setLobbyTheme(th) {
  lobby.background = skyTexture(th);
  lobby.fog.color.set(th.fog);
  lobbyGroundMat.color.set(th.floor[1]);
}

const lobbyModels = [null, null];
function rebuildLobbyModel(p) {
  if (lobbyModels[p]) lobby.remove(lobbyModels[p].root);
  const m = buildAnimal(choice[p]);
  m.root.position.set(p === 0 ? -2.8 : 2.8, 0.7, 0);
  lobby.add(m.root);
  lobbyModels[p] = m;
}
let resultModel = null;
function setLobbyMode(mode) {
  const sel = (mode === 'select');
  pedestals.forEach(p => { p.visible = sel; });
  lobbyModels.forEach(m => { if (m) m.root.visible = sel; });
  goldPed.visible = !sel;
  if (resultModel) { lobby.remove(resultModel.root); resultModel = null; }
  if (!sel && winner) {
    resultModel = buildAnimal(winner.animal);
    resultModel.root.position.set(0, 1.2, 0);
    lobby.add(resultModel.root);
  }
}
function updateLobby(dt) {
  if (state === 'select' || state === 'theme') {
    lobbyModels.forEach((m, i) => {
      if (!m) return;
      m.root.rotation.y = Math.PI + Math.sin(animT * 1.2 + i) * 0.35;
      animateAnimal(m, animT + i * 0.5, 'hop', dt);
    });
  } else if (resultModel) {
    resultModel.root.rotation.y = Math.PI + Math.sin(animT * 1.5) * 0.4;
    animateAnimal(resultModel, animT, 'cheer', dt);
  }
  updateDeco(lobbyAnims, dt);
}

// ===== 코스 만들기 (두 사람이 같은 코스를 달려요) =====
function buildCourse(seed) {
  const rand = makeRandom(seed);
  const obs = [];
  const types = ['wall', 'slider', 'spinner', 'bumpers'];
  let last = '';
  let y = START_Y - 300;
  while (y > 450) {
    let t;
    do { t = types[Math.floor(rand() * types.length)]; } while (t === last);
    last = t;
    if (t === 'wall') {
      const gap = 120;
      const gx = 20 + rand() * (COURSE_W - gap - 40);
      obs.push({ type: 'rect', x: 0, y: y, w: gx, h: 28 });
      obs.push({ type: 'rect', x: gx + gap, y: y, w: COURSE_W - gx - gap, h: 28 });
    } else if (t === 'slider') {
      const w = 130;
      obs.push({ type: 'slider', y: y, w: w, h: 26, range: (COURSE_W - w) / 2, speed: 1.5 + rand() * 1.5, phase: rand() * 6.28 });
    } else if (t === 'spinner') {
      obs.push({ type: 'spinner', cx: COURSE_W / 2, cy: y, len: 150, speed: (rand() < 0.5 ? -1 : 1) * (1.6 + rand() * 1.2), phase: rand() * 6.28 });
    } else {
      for (let i = 0; i < 3; i++) {
        obs.push({ type: 'bumper', x: (i + 0.5) * (COURSE_W / 3) + (rand() - 0.5) * 50, y: y - 40 + rand() * 80, r: 26, hit: 0 });
      }
    }
    y -= 260 + rand() * 80;
  }
  return obs;
}

function makePlayer(idx, animal) {
  return { idx: idx, animal: animal, x: idx === 0 ? 140 : 260, y: START_Y, kx: 0, ky: 0, stun: 0, moving: false, mx: 0, my: -1, model: null };
}

function sliderX(o) { return (COURSE_W - o.w) / 2 + Math.sin(worldT * o.speed + o.phase) * o.range; }

// ===== 부딪힘 처리 =====
function knock(p, nx, ny, force, stun, back) {
  p.kx = nx * force;
  p.ky = ny * force + back;
  p.stun = Math.max(p.stun, stun);
}

function pushOutOfRect(p, x, y, w, h) {
  const cx = clamp(p.x, x, x + w), cy = clamp(p.y, y, y + h);
  const dx = p.x - cx, dy = p.y - cy;
  const d = Math.hypot(dx, dy);
  if (d >= R) return null;
  let nx, ny;
  if (d === 0) {
    const left = p.x - x, right = x + w - p.x, top = p.y - y, bottom = y + h - p.y;
    const m = Math.min(left, right, top, bottom);
    if (m === left) { nx = -1; ny = 0; p.x = x - R; }
    else if (m === right) { nx = 1; ny = 0; p.x = x + w + R; }
    else if (m === top) { nx = 0; ny = -1; p.y = y - R; }
    else { nx = 0; ny = 1; p.y = y + h + R; }
  } else {
    nx = dx / d; ny = dy / d;
    p.x = cx + nx * R; p.y = cy + ny * R;
  }
  return { nx: nx, ny: ny };
}

function updatePlayer(p, dt) {
  const inp = input[p.idx];
  let mx = (inp.right ? 1 : 0) - (inp.left ? 1 : 0);
  let my = (inp.down ? 1 : 0) - (inp.up ? 1 : 0);
  if (p.stun > 0) { p.stun -= dt; mx = 0; my = 0; }
  const len = Math.hypot(mx, my) || 1;
  p.moving = (mx !== 0 || my !== 0);
  if (p.moving) { p.mx = mx; p.my = my; }
  p.x += (mx / len * SPEED + p.kx) * dt;
  p.y += (my / len * SPEED + p.ky) * dt;
  const decay = Math.pow(0.03, dt);
  p.kx *= decay; p.ky *= decay;

  for (const o of obstacles) {
    if (o.type === 'rect') {
      if (Math.abs(o.y - p.y) > 80) continue;
      const n = pushOutOfRect(p, o.x, o.y, o.w, o.h);
      if (n) {
        const dot = p.kx * n.nx + p.ky * n.ny;
        if (dot < 0) { p.kx -= dot * n.nx; p.ky -= dot * n.ny; }
      }
    } else if (o.type === 'slider') {
      if (Math.abs(o.y - p.y) > 80) continue;
      const n = pushOutOfRect(p, sliderX(o), o.y, o.w, o.h);
      if (n) knock(p, n.nx, n.ny, 420, 0.5, 120);
    } else if (o.type === 'spinner') {
      if (Math.abs(o.cy - p.y) > o.len + 40) continue;
      const ang = worldT * o.speed + o.phase;
      const c = Math.cos(ang), s = Math.sin(ang);
      const ax = o.cx - c * o.len, ay = o.cy - s * o.len;
      const bx = o.cx + c * o.len, by = o.cy + s * o.len;
      const segLen2 = (2 * o.len) * (2 * o.len);
      const t = clamp(((p.x - ax) * (bx - ax) + (p.y - ay) * (by - ay)) / segLen2, 0, 1);
      const qx = ax + t * (bx - ax), qy = ay + t * (by - ay);
      const dx = p.x - qx, dy = p.y - qy;
      const d = Math.hypot(dx, dy);
      const lim = R + 8;
      if (d < lim) {
        let nx = 0, ny = 1;
        if (d > 0.001) { nx = dx / d; ny = dy / d; }
        p.x = qx + nx * lim; p.y = qy + ny * lim;
        knock(p, nx, ny, 480, 0.6, 120);
      }
    } else if (o.type === 'bumper') {
      const dx = p.x - o.x, dy = p.y - o.y;
      const d = Math.hypot(dx, dy);
      const lim = R + o.r;
      if (d < lim) {
        let nx = 0, ny = 1;
        if (d > 0.001) { nx = dx / d; ny = dy / d; }
        p.x = o.x + nx * lim; p.y = o.y + ny * lim;
        knock(p, nx, ny, 380, 0.15, 0);
        o.hit = 0.2;
      }
    }
  }

  p.x = clamp(p.x, R, COURSE_W - R);
  p.y = Math.min(p.y, COURSE_LEN - R);
}

function progressOf(p) { return clamp((START_Y - p.y) / (START_Y - FINISH_Y), 0, 1); }

function updatePlayerModels(dt) {
  for (const p of players) {
    const m = p.model;
    m.root.position.set(toX(p.x), 0, toZ(p.y));
    if (p.moving && p.stun <= 0) {
      const target = Math.atan2(-p.mx, -p.my);
      m.heading = lerpAngle(m.heading, target, 1 - Math.exp(-dt * 12));
    }
    m.root.rotation.y = m.heading;
    let mode = 'idle';
    if (state === 'finish' && p === winner) mode = 'cheer';
    else if (p.stun > 0) mode = 'dizzy';
    else if (p.moving) mode = 'run';
    animateAnimal(m, animT + p.idx * 0.37, mode, dt);
  }
}

// ===== 카메라 (각자 캐릭터 뒤에서 따라가요) =====
const cams = [new THREE.PerspectiveCamera(55, 0.8, 0.1, 500), new THREE.PerspectiveCamera(55, 0.8, 0.1, 500)];
const camLook = [new THREE.Vector3(), new THREE.Vector3()];
function updateCams(dt, snap) {
  const f = snap ? 1 : 1 - Math.exp(-dt * 6);
  players.forEach((p, i) => {
    const px = toX(p.x), pz = toZ(p.y);
    const cam = cams[i];
    cam.position.x += (px * 0.55 - cam.position.x) * f;
    cam.position.y += (8 - cam.position.y) * f;
    cam.position.z += (pz + 12.5 - cam.position.z) * f;
    camLook[i].x += (px * 0.8 - camLook[i].x) * f;
    camLook[i].y += (1.2 - camLook[i].y) * f;
    camLook[i].z += (pz - 9 - camLook[i].z) * f;
    cam.lookAt(camLook[i]);
  });
}
function aimSun(p) {
  const x = toX(p.x), z = toZ(p.y) - 8;
  sun.position.set(x + 10, 28, z + 12);
  sun.target.position.set(x, 0, z);
  sun.target.updateMatrixWorld();
}

function render() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (state === 'select' || state === 'theme' || state === 'result') {
    renderer.setScissorTest(false);
    renderer.setViewport(0, 0, w, h);
    lobbyCam.aspect = w / h;
    lobbyCam.updateProjectionMatrix();
    renderer.render(lobby, lobbyCam);
  } else {
    renderer.setScissorTest(true);
    const half = Math.floor(w / 2);
    for (let i = 0; i < 2; i++) {
      const x = i * half;
      const vw = i === 0 ? half : w - half;
      renderer.setViewport(x, 0, vw, h);
      renderer.setScissor(x, 0, vw, h);
      cams[i].aspect = vw / h;
      cams[i].updateProjectionMatrix();
      aimSun(players[i]);
      renderer.render(scene, cams[i]);
    }
  }
}

// ===== 화면 정보 (진행도, 카운트다운) =====
const hud = document.getElementById('hud');
const countEl = document.getElementById('count');
const bannerEl = document.getElementById('banner');
const hbar = [document.getElementById('hbar1'), document.getElementById('hbar2')];
const mdot = [document.getElementById('md1'), document.getElementById('md2')];

function setCount(txt) {
  if (txt === lastCountTxt) return;
  lastCountTxt = txt;
  countEl.textContent = txt;
  countEl.classList.remove('pop');
  void countEl.offsetWidth;
  if (txt) countEl.classList.add('pop');
}

function updateHUD() {
  players.forEach((p, i) => {
    const pr = progressOf(p);
    hbar[i].style.width = (pr * 100) + '%';
    mdot[i].style.top = ((1 - pr) * 100) + '%';
  });
  if (state === 'countdown') setCount(String(Math.ceil(countdown - 1)));
  else if (state === 'race' && countdown > 0) setCount('GO!');
  else setCount('');
}

// ===== 맵 테마 카드 =====
const cardsEl = document.getElementById('cards');
THEMES.forEach((th, i) => {
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML =
    '<span class="new">NEW!</span>' +
    '<div class="thumb" style="background:' + th.card + '">' +
      '<span class="e2">' + th.art[1] + '</span><span class="e1">' + th.art[0] + '</span><span class="e3">' + th.art[2] + '</span>' +
    '</div>' +
    '<div class="cname">' + th.name + '</div>' +
    '<div class="cdesc">' + th.desc + '</div>' +
    '<div class="csel">선택</div>';
  c.addEventListener('click', () => setTheme(i));
  c.addEventListener('dblclick', () => { setTheme(i); startRace(); });
  cardsEl.appendChild(c);
});
function setTheme(i) {
  themeIdx = (i + THEMES.length) % THEMES.length;
  [...cardsEl.children].forEach((c, k) => {
    c.classList.toggle('sel', k === themeIdx);
    c.querySelector('.csel').textContent = k === themeIdx ? '선택됨 ✔' : '선택';
  });
  setLobbyTheme(THEMES[themeIdx]);
}

// ===== 화면 전환 =====
const selectScreen = document.getElementById('selectScreen');
const themeScreen = document.getElementById('themeScreen');
const resultScreen = document.getElementById('resultScreen');

function updateNames() {
  document.getElementById('name1').textContent = ANIMALS[choice[0]].name;
  document.getElementById('name2').textContent = ANIMALS[choice[1]].name;
}

function changeAnimal(p, d) {
  choice[p] = (choice[p] + d + ANIMALS.length) % ANIMALS.length;
  updateNames();
  rebuildLobbyModel(p);
}

function showScreen(name) {
  selectScreen.classList.toggle('hidden', name !== 'select');
  themeScreen.classList.toggle('hidden', name !== 'theme');
  resultScreen.classList.toggle('hidden', name !== 'result');
  hud.classList.toggle('hidden', name !== 'hud');
}

function goTheme() {
  state = 'theme';
  wrap.classList.remove('racing');
  setLobbyMode('select');
  showScreen('theme');
}

function goSelect() {
  state = 'select';
  wrap.classList.remove('racing');
  setLobbyMode('select');
  showScreen('select');
}

function startRace() {
  const th = THEMES[themeIdx];
  if (stageThemeId !== th.id) buildStage(th);
  obstacles = buildCourse(Math.floor(Math.random() * 1000000) + 1);
  buildObstacleMeshes(th);
  players.forEach(p => { if (p.model) scene.remove(p.model.root); });
  players = [makePlayer(0, choice[0]), makePlayer(1, choice[1])];
  players.forEach(p => { p.model = buildAnimal(p.animal); scene.add(p.model.root); });
  clearConfetti();
  worldT = 0; raceTime = 0; countdown = 4; winner = null;
  clearInput();
  document.getElementById('hn1').textContent = ANIMALS[choice[0]].name;
  document.getElementById('hn2').textContent = ANIMALS[choice[1]].name;
  bannerEl.classList.add('hidden');
  showScreen('hud');
  wrap.classList.add('racing');
  lastCountTxt = '';
  state = 'countdown';
  updatePlayerModels(0);
  updateObstacleMeshes();
  updateCams(0, true);
}

function showResult() {
  state = 'result';
  const name = ANIMALS[winner.animal].name;
  const t = document.getElementById('winText');
  t.textContent = '🏆 ' + (winner.idx + 1) + 'P ' + name + ' 승리!';
  t.style.textShadow = '0 .45cqw 0 ' + PCOL[winner.idx] + ', 0 .9cqw 1.4cqw rgba(0,0,0,.25)';
  document.getElementById('winTime').textContent = THEMES[themeIdx].name + ' · 기록: ' + raceTime.toFixed(2) + '초';
  setLobbyMode('result');
  showScreen('result');
}

// ===== 매 순간 반복되는 게임 진행 =====
function loop(ts) {
  try { frame(ts); }
  catch (e) { showBootError('게임 진행 중 문제가 생겼어요.', e, '아래 오류 내용을 알려주세요.'); return; }
  requestAnimationFrame(loop);
}

function frame(ts) {
  const dt = lastTs ? Math.min(0.033, (ts - lastTs) / 1000) : 0;
  lastTs = ts;
  animT += dt;
  for (const o of obstacles) if (o.hit > 0) o.hit -= dt;

  if (state === 'select' || state === 'theme' || state === 'result') {
    updateLobby(dt);
  } else {
    worldT += dt;
    if (state === 'countdown') {
      countdown -= dt;
      if (countdown <= 1) state = 'race';
    } else if (state === 'race') {
      raceTime += dt;
      if (countdown > 0) countdown -= dt;
      for (const p of players) updatePlayer(p, dt);
      const done = players.filter(p => p.y <= FINISH_Y);
      if (done.length > 0) {
        done.sort((a, b) => a.y - b.y);
        winner = done[0];
        state = 'finish';
        finishTimer = 2.2;
        wrap.classList.remove('racing');
        clearInput();
        burstConfetti(toX(winner.x), toZ(winner.y) - 1);
        bannerEl.textContent = '🏁 ' + (winner.idx + 1) + 'P 골인!';
        bannerEl.style.borderColor = PCOL[winner.idx];
        bannerEl.style.color = PCOL[winner.idx];
        bannerEl.style.left = winner.idx === 0 ? '25%' : '75%';
        bannerEl.classList.remove('hidden');
      }
    } else if (state === 'finish') {
      finishTimer -= dt;
      if (finishTimer <= 0) showResult();
    }
    if (state !== 'result') {
      updateObstacleMeshes();
      updatePlayerModels(dt);
      updateConfetti(dt);
      updateCams(dt, false);
      updateHUD();
      updateDeco(decoAnims, dt);
    }
  }

  render();
}

// ===== 키보드 =====
const KEYMAP = {
  KeyW: [0, 'up'], KeyS: [0, 'down'], KeyA: [0, 'left'], KeyD: [0, 'right'],
  ArrowUp: [1, 'up'], ArrowDown: [1, 'down'], ArrowLeft: [1, 'left'], ArrowRight: [1, 'right'],
};

window.addEventListener('keydown', e => {
  const m = KEYMAP[e.code];
  if (m) {
    e.preventDefault();
    if (!e.repeat) {
      if (state === 'select') {
        if (m[1] === 'left') changeAnimal(m[0], -1);
        if (m[1] === 'right') changeAnimal(m[0], 1);
      } else if (state === 'theme') {
        if (m[1] === 'left') setTheme(themeIdx - 1);
        if (m[1] === 'right') setTheme(themeIdx + 1);
      }
    }
    input[m[0]][m[1]] = true;
  }
  if (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter') {
    e.preventDefault();
    if (e.repeat) return;
    if (state === 'select') goTheme();
    else if (state === 'theme' || state === 'result') startRace();
  }
  if (e.code === 'Escape' && state === 'theme') goSelect();
});

window.addEventListener('keyup', e => {
  const m = KEYMAP[e.code];
  if (m) input[m[0]][m[1]] = false;
});

window.addEventListener('blur', clearInput);

// ===== 버튼 =====
function onClick(id, fn) {
  document.getElementById(id).addEventListener('click', e => { e.currentTarget.blur(); fn(); });
}
document.querySelectorAll('.arw').forEach(b => {
  b.addEventListener('click', e => {
    changeAnimal(Number(b.dataset.p), Number(b.dataset.d));
    e.currentTarget.blur();
  });
});
onClick('nextBtn', goTheme);
onClick('themeBack', goSelect);
onClick('themeStart', startRace);
onClick('againBtn', startRace);
onClick('mapBtn', goTheme);
onClick('backBtn', goSelect);

// ===== 터치 버튼 (태블릿) =====
document.querySelectorAll('.pad button').forEach(b => {
  const p = Number(b.dataset.p), k = b.dataset.k;
  const on = e => { e.preventDefault(); input[p][k] = true; b.classList.add('on'); };
  const off = () => { input[p][k] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, off));
});

// ===== 시작 =====
updateNames();
rebuildLobbyModel(0);
rebuildLobbyModel(1);
setTheme(0);
setLobbyMode('select');
requestAnimationFrame(loop);
window.__gameStarted = true;
}

loadThree(0);
