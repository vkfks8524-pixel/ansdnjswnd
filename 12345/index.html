<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>나의 첫 웹사이트</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eff5e9;color:#214a35;font-family:Arial,'Malgun Gothic',sans-serif}
    main{max-width:620px;margin:24px;padding:40px;background:white;border-radius:24px;box-shadow:0 16px 50px #31512810}
    h1{font-size:36px;line-height:1.3}p{line-height:1.8}button{background:#286347;color:white;border:0;padding:14px 20px;border-radius:12px;cursor:pointer;font:inherit}
    #message{min-height:30px;font-weight:bold}
  </style>
</head>
<body>
  <main><p>MY FIRST WEBSITE</p><h1>생각을 코드로,<br>코드를 작품으로.</h1><p>HTML, CSS, JavaScript가 모두 들어 있는 단일 HTML 예제예요. 글과 색을 바꿔 나만의 작품을 만들어 보세요.</p><button id="hello">눌러 보세요</button><p id="message" aria-live="polite"></p></main>
  <script>document.getElementById('hello').addEventListener('click',function(){document.getElementById('message').textContent='안녕하세요! JavaScript도 잘 실행돼요. 🌱';});</script>
</body>
</html>
